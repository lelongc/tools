        function drawAsset(canvasId, badgeText, badgeColor) {
            const canvas = document.getElementById(canvasId);
            const ctx = canvas.getContext('2d');
            const img = new Image();
            
            img.onload = () => {
                ctx.fillStyle = '#ffffff';
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                const iconSize = 200;
                const x = (canvas.width - iconSize) / 2;
                const y = (canvas.height - iconSize) / 2;
                
                ctx.imageSmoothingEnabled = true;
                ctx.imageSmoothingQuality = 'high';
                ctx.drawImage(img, x, y, iconSize, iconSize);

                const badgeRadius = 35;
                const badgeX = x + iconSize - 20;
                const badgeY = y + iconSize - 20;

                ctx.shadowColor = 'rgba(0, 0, 0, 0.2)';
                ctx.shadowBlur = 10;
                ctx.shadowOffsetX = 0;
                ctx.shadowOffsetY = 4;

                ctx.beginPath();
                ctx.arc(badgeX, badgeY, badgeRadius, 0, 2 * Math.PI);
                ctx.fillStyle = badgeColor;
                ctx.fill();

                ctx.shadowColor = 'transparent';

                ctx.lineWidth = 4;
                ctx.strokeStyle = '#ffffff';
                ctx.stroke();

                ctx.fillStyle = '#ffffff';
                ctx.font = 'bold 24px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(badgeText, badgeX, badgeY + 2);
            };
            
            img.src = iconSrc;
        }

        window.onload = () => {
            drawAsset('canvas-monthly', '1M', '#0ea5e9'); // Cyan
            drawAsset('canvas-yearly', '1Y', '#8b5cf6'); // Purple
            drawAsset('canvas-lifetime', '∞', '#f59e0b'); // Gold
        };

        function downloadImage(canvasId, filename) {
            const canvas = document.getElementById(canvasId);
            const link = document.createElement('a');
            link.download = filename;
            link.href = canvas.toDataURL('image/png');
            link.click();
        }
    </script>
