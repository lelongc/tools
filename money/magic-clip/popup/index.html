<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>NeoClip</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #fafbff;
            --text: #1e293b;
            --text-secondary: #64748b;
            --text-light: #94a3b8;
            --card-bg: white;
            --card-border: #e5e7eb;
            --card-border-hover: #c7d2fe;
            --card-shadow-hover: rgba(99,102,241,0.08);
            --toggle-bg: #cbd5e1;
        }
        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #0b0f19;
                --text: #f9fafb;
                --text-secondary: #cbd5e1;
                --text-light: #64748b;
                --card-bg: #1f2937;
                --card-border: #1f2937;
                --card-border-hover: #374151;
                --card-shadow-hover: rgba(99,102,241,0.15);
                --toggle-bg: #4b5563;
            }
        }
        body.dark {
            --bg: #0b0f19;
            --text: #f9fafb;
            --text-secondary: #cbd5e1;
            --text-light: #64748b;
            --card-bg: #1f2937;
            --card-border: #1f2937;
            --card-border-hover: #374151;
            --card-shadow-hover: rgba(99,102,241,0.15);
            --toggle-bg: #4b5563;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            width: 320px;
            background: var(--bg);
            color: var(--text);
            transition: background 0.2s ease, color 0.2s ease;
        }

        /* Header */
        .header {
            background: linear-gradient(135deg, #6366f1, #8b5cf6, #06b6d4);
            padding: 20px 20px 18px;
            color: white;
        }
        .header-row {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .logo-icon {
            width: 32px;
            height: 32px;
            background: rgba(255,255,255,0.2);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(4px);
        }
        .logo-icon svg {
            width: 18px;
            height: 18px;
            color: white;
        }
        .header-text h2 {
            font-size: 16px;
            font-weight: 700;
            letter-spacing: 0.3px;
        }
        .header-text p {
            font-size: 11px;
            opacity: 0.85;
            margin-top: 2px;
            font-weight: 400;
        }

        /* Content */
        .content {
            padding: 16px 20px;
        }
        .info {
            font-size: 12px;
            color: var(--text-secondary);
            line-height: 1.65;
            margin-bottom: 16px;
        }

        /* Stats Grid */
        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 16px;
        }
        .stat-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 12px;
            padding: 14px;
            display: flex;
            align-items: center;
            gap: 10px;
            transition: all 0.2s ease;
        }
        .stat-card:hover {
            border-color: var(--card-border-hover);
            box-shadow: 0 2px 8px var(--card-shadow-hover);
            transform: translateY(-1px);
        }
        .stat-icon {
            width: 34px;
            height: 34px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }
        .stat-icon svg {
            width: 16px;
            height: 16px;
        }
        .stat-icon.purple {
            background: linear-gradient(135deg, rgba(99,102,241,0.12), rgba(139,92,246,0.12));
            color: #6366f1;
        }
        .stat-icon.cyan {
            background: linear-gradient(135deg, rgba(6,182,212,0.12), rgba(59,130,246,0.12));
            color: #06b6d4;
        }
        .stat-icon.amber {
            background: linear-gradient(135deg, rgba(245,158,11,0.12), rgba(251,146,60,0.12));
            color: #f59e0b;
        }
        .stat-icon.emerald {
            background: linear-gradient(135deg, rgba(16,185,129,0.12), rgba(52,211,153,0.12));
            color: #10b981;
        }
        .stat-info {
            display: flex;
            flex-direction: column;
        }
        .stat-value {
            font-size: 18px;
            font-weight: 700;
            color: var(--text);
            line-height: 1;
        }
        .stat-label {
            font-size: 10px;
            color: var(--text-light);
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-top: 3px;
        }

        /* Settings */
        .settings {
            padding: 0 20px 16px;
        }
        .setting-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--card-bg);
            padding: 12px 14px;
            border-radius: 12px;
            border: 1px solid var(--card-border);
            transition: all 0.2s ease;
        }
        .setting-label {
            font-size: 13px;
            font-weight: 600;
            color: var(--text);
        }
        .setting-desc {
            font-size: 10px;
            color: var(--text-light);
            margin-top: 2px;
        }
        
        /* Toggle Switch */
        .toggle {
            position: relative;
            display: inline-block;
            width: 36px;
            height: 20px;
        }
        .toggle input {
            opacity: 0;
            width: 0;
            height: 0;
        }
        .slider {
            position: absolute;
            cursor: pointer;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: var(--toggle-bg);
            transition: .3s;
            border-radius: 20px;
        }
        .slider:before {
            position: absolute;
            content: "";
            height: 14px;
            width: 14px;
            left: 3px;
            bottom: 3px;
            background-color: white;
            transition: .3s;
            border-radius: 50%;
            box-shadow: 0 1px 2px rgba(0,0,0,0.1);
        }
        input:checked + .slider {
            background: linear-gradient(135deg, #6366f1, #06b6d4);
        }
        input:checked + .slider:before {
            transform: translateX(16px);
        }

        /* Footer */
        .footer {
            padding: 12px 20px;
            border-top: 1px solid var(--card-border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: all 0.2s ease;
        }
        .version {
            font-size: 10px;
            color: var(--text-light);
            font-weight: 500;
        }
        .footer-link {
            font-size: 10px;
            color: #6366f1;
            text-decoration: none;
            font-weight: 500;
            transition: color 0.15s;
        }
        .footer-link:hover { color: #4f46e5; }
    </style>
</head>
<body>
    <div class="header">
        <div class="header-row">
            <div class="logo-icon">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="8" y="2" width="8" height="4" rx="1"/>
                    <rect x="4" y="4" width="16" height="18" rx="2"/>
                    <path d="M9 12h6M9 16h4"/>
                </svg>
            </div>
            <div class="header-text">
                <h2>NeoClip</h2>
                <p>Smart Clipboard Manager</p>
            </div>
        </div>
    </div>
    <div class="content">
        <p class="info">
            Access your clipboard history via the floating bubble or by pressing <b>Alt+V</b> on any webpage.
        </p>
        <div id="stats" class="stats-grid"></div>
    </div>
    <div class="settings">
        <div class="setting-row">
            <div>
                <div class="setting-label">Show Floating Bubble</div>
                <div class="setting-desc">Display bubble on webpages</div>
            </div>
            <label class="toggle">
                <input type="checkbox" id="toggle-bubble" checked>
                <span class="slider"></span>
            </label>
        </div>
    </div>
    <div class="footer">
        <span class="version">v3.0.0 · 100% Offline</span>
        <a href="#" class="footer-link">⭐ Rate us</a>
    </div>
    <script src="app.js"></script>
</body>
</html>
