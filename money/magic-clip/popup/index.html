<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Magic Clip</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            width: 320px;
            padding: 16px;
            background: #fff;
            color: #333;
        }
        h2 { font-size: 15px; font-weight: 600; margin-bottom: 12px; }
        .info {
            font-size: 12px;
            color: #888;
            line-height: 1.6;
            margin-bottom: 12px;
        }
        .stat {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-top: 1px solid #eee;
            font-size: 12px;
        }
        .stat-label { color: #888; }
        .stat-value { font-weight: 500; }
        .footer {
            margin-top: 12px;
            padding-top: 10px;
            border-top: 1px solid #eee;
            font-size: 10px;
            color: #bbb;
            text-align: center;
        }
    </style>
</head>
<body>
    <h2>Magic Clip</h2>
    <p class="info">
        Click the floating bubble on any webpage to access your clipboard history, collections, and OCR scanner.
    </p>
    <div id="stats"></div>
    <div class="footer">v2.0.0 &middot; Zero-knowledge &middot; 100% offline</div>
    <script src="app.js"></script>
</body>
</html>
