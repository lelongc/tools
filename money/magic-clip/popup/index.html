<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>NeoClip Settings</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #f8fafc;
            --text: #0f172a;
            --text-secondary: #475569;
            --text-light: #64748b;
            --card-bg: #ffffff;
            --card-border: #e2e8f0;
            --primary: #3b82f6;
            --primary-hover: #2563eb;
            --toggle-bg: #cbd5e1;
            --danger: #ef4444;
            --success: #10b981;
        }
        body.dark {
            --bg: #0f172a;
            --text: #f8fafc;
            --text-secondary: #cbd5e1;
            --text-light: #94a3b8;
            --card-bg: #1e293b;
            --card-border: #334155;
            --primary: #3b82f6;
            --toggle-bg: #475569;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body {
            width: 320px;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: var(--bg);
            color: var(--text);
            transition: background 0.2s ease, color 0.2s ease;
        }

        /* Header */
        .header {
            padding: 16px 20px;
            background: var(--card-bg);
            border-bottom: 1px solid var(--card-border);
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .logo-icon {
            width: 24px;
            height: 24px;
            color: var(--primary);
        }
        .header-text h2 {
            font-size: 15px;
            font-weight: 600;
            color: var(--text);
        }

        /* Content */
        .content {
            padding: 16px 20px;
        }

        /* Stats Grid */
        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 20px;
        }
        .stat-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 8px;
            padding: 12px;
        }
        .stat-value {
            font-size: 16px;
            font-weight: 600;
            color: var(--text);
        }
        .stat-label {
            font-size: 11px;
            color: var(--text-secondary);
            margin-top: 4px;
        }

        /* Settings Rows */
        .settings-group {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 8px;
            overflow: hidden;
            margin-bottom: 16px;
        }
        .setting-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 16px;
            border-bottom: 1px solid var(--card-border);
        }
        .setting-row:last-child {
            border-bottom: none;
        }
        .setting-label {
            font-size: 13px;
            font-weight: 500;
            color: var(--text);
        }
        .setting-desc {
            font-size: 11px;
            color: var(--text-light);
            margin-top: 2px;
        }
        
        /* Pro & License Area */
        .pro-section {
            padding: 16px;
            background: rgba(59, 130, 246, 0.05);
            border-bottom: 1px solid var(--card-border);
        }
        .pro-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }
        .pro-badge {
            font-size: 10px;
            background: var(--primary);
            color: white;
            padding: 2px 6px;
            border-radius: 4px;
            font-weight: 600;
        }
        .input-group {
            display: flex;
            gap: 8px;
            margin-bottom: 8px;
        }
        .input-text {
            flex: 1;
            padding: 6px 10px;
            border: 1px solid var(--card-border);
            border-radius: 6px;
            font-size: 12px;
            background: var(--card-bg);
            color: var(--text);
            outline: none;
        }
        .input-text:focus {
            border-color: var(--primary);
        }
        .btn {
            background: var(--primary);
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 500;
            cursor: pointer;
            transition: background 0.2s;
        }
        .btn:hover {
            background: var(--primary-hover);
        }
        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        .btn-secondary {
            background: var(--card-bg);
            color: var(--text);
            border: 1px solid var(--card-border);
        }
        .btn-secondary:hover {
            background: var(--bg);
        }

        /* Toggle */
        .toggle {
            position: relative;
            display: inline-block;
            width: 32px;
            height: 18px;
        }
        .toggle input { opacity: 0; width: 0; height: 0; }
        .slider {
            position: absolute;
            cursor: pointer;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: var(--toggle-bg);
            transition: .2s;
            border-radius: 18px;
        }
        .slider:before {
            position: absolute;
            content: "";
            height: 14px;
            width: 14px;
            left: 2px;
            bottom: 2px;
            background-color: white;
            transition: .2s;
            border-radius: 50%;
        }
        input:checked + .slider { background-color: var(--primary); }
        input:checked + .slider:before { transform: translateX(14px); }

        .footer {
            padding: 12px 20px;
            text-align: center;
            font-size: 11px;
            color: var(--text-light);
        }
    </style>
</head>
<body>
    <div class="header">
        <svg class="logo-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="8" y="2" width="8" height="4" rx="1"/>
            <rect x="4" y="4" width="16" height="18" rx="2"/>
            <path d="M9 12h6M9 16h4"/>
        </svg>
        <div class="header-text">
            <h2>NeoClip Settings</h2>
        </div>
    </div>
    
    <div class="content">
        <div id="stats" class="stats-grid">
            <!-- Populated by app.js -->
            <div class="stat-card">
                <div class="stat-value" id="stat-items">-</div>
                <div class="stat-label">Clips Saved</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="stat-cols">-</div>
                <div class="stat-label">Collections</div>
            </div>
        </div>

        <div class="settings-group">
            <div class="pro-section" id="license-area">
                <div class="pro-header">
                    <span class="setting-label">License & Cloud Sync</span>
                    <span class="pro-badge">PRO</span>
                </div>
                <div id="pro-unlocked" style="display: none;">
                    <div style="font-size: 12px; color: var(--success); font-weight: 500; margin-bottom: 12px;">✓ Pro Activated</div>
                    <button id="btn-sync-login" class="btn btn-secondary" style="width: 100%; margin-bottom: 8px;">Login to Google</button>
                    <button id="btn-sync-now" class="btn btn-secondary" style="width: 100%; display: none; margin-bottom: 8px;">Backup to Drive</button>
                    <button id="btn-sync-restore" class="btn btn-secondary" style="width: 100%; display: none;">Restore from Drive</button>
                    <div id="sync-status" style="font-size: 11px; margin-top: 8px; color: var(--text-light); text-align: center;"></div>
                </div>
                <div id="pro-locked">
                    <p style="font-size: 11px; color: var(--text-secondary); margin-bottom: 8px;">Enter key to unlock Drive Sync & Unlimited History.</p>
                    <div class="input-group">
                        <input type="text" id="license-input" class="input-text" placeholder="License Key">
                        <button id="btn-verify-license" class="btn">Verify</button>
                    </div>
                </div>
            </div>

            <div class="setting-row">
                <div>
                    <div class="setting-label">Show Bubble</div>
                    <div class="setting-desc">Display on webpages</div>
                </div>
                <label class="toggle">
                    <input type="checkbox" id="toggle-bubble" checked>
                    <span class="slider"></span>
                </label>
            </div>
            <div class="setting-row">
                <div>
                    <div class="setting-label">Dark Mode</div>
                    <div class="setting-desc">Toggle popup theme</div>
                </div>
                <label class="toggle">
                    <input type="checkbox" id="toggle-theme">
                    <span class="slider"></span>
                </label>
            </div>
            <div class="setting-row" style="cursor: pointer;" id="clear-storage">
                <div>
                    <div class="setting-label" style="color: var(--danger);">Clear Storage</div>
                    <div class="setting-desc">Delete all local data</div>
                </div>
            </div>
        </div>
    </div>
    
    <div class="footer">
        v3.0.0 · 100% Offline
    </div>

    <script src="app.js"></script>
</body>
</html>
