<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Mã QR Ví Solana Agentic</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #0b0e11;
            color: #eaecef;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        .card {
            background: #181a20;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
            text-align: center;
            max-width: 450px;
        }
        h2 { color: #ab9ff2; margin-top: 0; }
        .qr-box {
            background: white;
            padding: 16px;
            border-radius: 12px;
            display: inline-block;
            margin: 20px 0;
        }
        .address {
            font-family: monospace;
            font-size: 13px;
            word-break: break-all;
            background: #2b313a;
            padding: 12px;
            border-radius: 8px;
            color: #f0b90b;
        }
        p { color: #848e9c; font-size: 14px; line-height: 1.6; }
    </style>
</head>
<body>
    <div class="card">
        <h2>Quét Mã Nhận Tiền Mạng Solana</h2>
        <p>Mở App Phantom &rarr; Chọn Gửi (Send) &rarr; Bấm biểu tượng <b>Quét mã QR</b> &rarr; Quét hình bên dưới:</p>
        
        <div class="qr-box">
            <img src="https://api.qrserver.com/v1/create-qr-code/?size=280x280&data=HmWkLz5gLAb9wGacxTfUTPm9yNrMQojfFaaZXABgWDPd" alt="QR Solana Address" width="280" height="280">
        </div>

        <div>Địa chỉ nhận (Ví Agentic):</div>
        <div class="address">HmWkLz5gLAb9wGacxTfUTPm9yNrMQojfFaaZXABgWDPd</div>
    </div>
</body>
</html>
