<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Quét mã QR kết nối Binance Agentic Wallet</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #0b0e11;
            color: #eaecef;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        .card {
            background: #181a20;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
            text-align: center;
            max-width: 420px;
        }
        h2 { color: #f0b90b; margin-top: 0; }
        .qr-box {
            background: white;
            padding: 15px;
            border-radius: 12px;
            display: inline-block;
            margin: 20px 0;
        }
        .code {
            font-size: 24px;
            font-weight: bold;
            letter-spacing: 4px;
            color: #f0b90b;
            background: #2b313a;
            padding: 8px 16px;
            border-radius: 8px;
            display: inline-block;
        }
        p { color: #848e9c; font-size: 14px; line-height: 1.6; }
    </style>
</head>
<body>
    <div class="card">
        <h2>Kết Nối Ví AI Agentic</h2>
        <p>1. Mở App Binance trên điện thoại<br>2. Bấm biểu tượng <b>[Quét mã QR]</b> ở góc trên bên phải màn hình chính Binance<br>3. Hướng camera vào mã QR bên dưới:</p>
        
        <div class="qr-box">
            <img src="https://api.qrserver.com/v1/create-qr-code/?size=250x250&data=https%3A%2F%2Fapp.binance.com%2Funi-qr%2F25gg46KM" alt="Mã QR Binance" width="250" height="250">
        </div>

        <div>Mã ghép nối (Pairing Code):</div>
        <div class="code">de694b</div>
        <p style="margin-top: 15px;">Sau khi quét xong, bấm <b>Xác nhận (Confirm)</b> trên điện thoại để hoàn tất!</p>
    </div>
</body>
</html>
