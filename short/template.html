<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080, height=1920">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&family=Outfit:wght@600;800;900&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1080px; height: 1920px;
    overflow: hidden;
    font-family: 'Outfit', 'Inter', sans-serif;
    position: relative;
    background: linear-gradient(160deg, #0a0a1a 0%, #0d1325 30%, #111827 60%, #0f172a 100%);
  }

  /* ========== AMBIENT GLOW ========== */
  .ambient-glow {
    position: absolute; width: 600px; height: 600px;
    border-radius: 50%; filter: blur(120px); opacity: 0.15;
    pointer-events: none; z-index: 0;
    transition: background 1.5s ease;
  }
  .glow-1 { top: 10%; left: -10%; background: #6366f1; }
  .glow-2 { bottom: 20%; right: -15%; background: #ec4899; }

  /* ========== PARTICLES ========== */
  .particles { position:absolute; top:0; left:0; width:100%; height:100%; z-index:1; pointer-events:none; overflow:hidden; }
  .particle {
    position:absolute; border-radius:50%;
    background: rgba(255,255,255,0.08);
    animation: floatUp linear infinite;
  }
  @keyframes floatUp {
    0% { transform:translateY(100vh) scale(0); opacity:0; }
    10% { opacity:1; } 90% { opacity:1; }
    100% { transform:translateY(-10vh) scale(1); opacity:0; }
  }

  /* ========== BRAND HEADER ========== */
  .brand-header {
    position: absolute;
    top: 90px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 20;
    text-align: center;
    width: 100%;
  }
  .brand-sub {
    font-size: 26px;
    font-weight: 800;
    color: #6366f1;
    letter-spacing: 8px;
    text-transform: uppercase;
    margin-bottom: 6px;
    text-shadow: 0 0 20px rgba(99,102,241,0.6);
  }
  .brand-title {
    font-size: 52px;
    font-weight: 900;
    color: #ffffff;
    letter-spacing: 3px;
    text-transform: uppercase;
    text-shadow: 0 4px 15px rgba(0,0,0,0.6);
  }

  /* ========== KEYWORD LABEL (top center) ========== */
  .keyword-label {
    position: absolute; top: 260px; left: 50%;
    transform: translateX(-50%);
    z-index: 10; text-align: center;
    font-size: 44px; font-weight: 900;
    color: #FFD700; letter-spacing: 4px;
    text-transform: uppercase;
    text-shadow: 0 0 35px rgba(255,215,0,0.4);
    opacity: 0; transition: opacity 0.4s ease;
  }
  .keyword-label.visible { opacity: 1; }

  /* ========== MEDIA CONTAINER (centered, large vertical) ========== */
  .media-container {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    width: 900px; height: 1100px;
    border-radius: 32px;
    overflow: hidden;
    z-index: 5;
    box-shadow: 0 0 80px rgba(99,102,241,0.25), 0 30px 80px rgba(0,0,0,0.6);
    border: 3px solid rgba(255,255,255,0.12);
    background: #111;
  }

  .media-slot {
    position: absolute; top: 0; left: 0;
    width: 100%; height: 100%;
    opacity: 0;
    transition: opacity 0.8s ease, transform 6s cubic-bezier(0.25, 0.46, 0.45, 0.94);
    transform: scale(1.08);
  }
  .media-slot.active {
    opacity: 1;
    transform: scale(1);
  }

  .media-slot img {
    width: 100%; height: 100%;
    object-fit: cover;
  }
  .media-slot video {
    width: 100%; height: 100%;
    object-fit: cover;
  }

  /* Gradient overlay on media */
  .media-overlay {
    position: absolute; top: 0; left: 0;
    width: 100%; height: 100%;
    background: linear-gradient(to bottom, rgba(0,0,0,0.15) 0%, transparent 20%, transparent 80%, rgba(0,0,0,0.3) 100%);
    border-radius: 32px;
    pointer-events: none; z-index: 6;
  }

  /* ========== PROGRESS BAR ========== */
  .progress-bar {
    position: absolute; bottom: 0; left: 0;
    height: 6px; width: 0%; z-index: 20;
    background: linear-gradient(90deg, #6366f1, #a855f7, #ec4899);
    border-radius: 0 3px 3px 0;
  }

  /* ========== FILM GRAIN ========== */
  .film-grain {
    position:absolute; top:0; left:0; width:100%; height:100%; z-index:15;
    opacity:0.035; pointer-events:none;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
    animation: grain 0.3s steps(3) infinite;
  }
  @keyframes grain {
    0%{transform:translate(0,0)} 33%{transform:translate(-2px,1px)} 66%{transform:translate(1px,-2px)}
  }

  /* ========== DECORATIVE LINES ========== */
  .deco-line {
    position: absolute; left: 50%; height: 2px;
    background: linear-gradient(90deg, transparent, rgba(99,102,241,0.45), transparent);
    transform: translateX(-50%);
    z-index: 8; pointer-events: none;
    width: 0; transition: width 0.6s ease;
  }
  .deco-line.show { width: 60%; }
  .deco-top { top: 350px; }
  .deco-bottom { bottom: 21%; }
</style>
</head>
<body>
  <div class="ambient-glow glow-1"></div>
  <div class="ambient-glow glow-2"></div>
  <div class="particles" id="particles"></div>
  <div class="film-grain"></div>

  <!-- ========== BRAND HEADER ========== -->
  <div class="brand-header">
    <div class="brand-sub">ENGLISH DAILY</div>
    <div class="brand-title">LEARN ENGLISH</div>
  </div>

  <div class="keyword-label" id="keyword-label"></div>
  <div class="deco-line deco-top" id="deco-top"></div>

  <div class="media-container">
    <div id="media-slots"></div>
    <div class="media-overlay"></div>
  </div>

  <div class="deco-line deco-bottom" id="deco-bottom"></div>

  <div class="progress-bar" id="progress-bar"></div>

<script>
  const DATA = __TIMELINE_DATA__;
  const { total_duration: totalDuration, scenes, subtitles } = DATA;

  const mediaSlotsEl = document.getElementById('media-slots');
  const subContainer = document.getElementById('subtitle-container');
  const progressBar = document.getElementById('progress-bar');
  const kwLabel = document.getElementById('keyword-label');
  const decoTop = document.getElementById('deco-top');
  const decoBottom = document.getElementById('deco-bottom');
  const particlesEl = document.getElementById('particles');

  // --- Particles ---
  for (let i = 0; i < 10; i++) {
    const p = document.createElement('div');
    p.className = 'particle';
    const sz = 2 + Math.random() * 4;
    p.style.cssText = `width:${sz}px;height:${sz}px;left:${Math.random()*100}%;animation-duration:${10+Math.random()*15}s;animation-delay:${Math.random()*8}s;`;
    particlesEl.appendChild(p);
  }

  // --- Build media slots (video or image per scene) ---
  scenes.forEach((sc, i) => {
    const slot = document.createElement('div');
    slot.className = 'media-slot';
    slot.id = 'media-' + i;

    if (sc.media_type === 'video' && sc.has_media) {
      const vid = document.createElement('video');
      vid.autoplay = false; vid.muted = true; vid.loop = true; vid.playsInline = true;
      vid.src = sc.video_path;
      vid.load();
      slot.appendChild(vid);
    } else if (sc.has_media) {
      const img = document.createElement('img');
      img.src = sc.image_path;
      img.alt = sc.keyword;
      slot.appendChild(img);
    } else {
      slot.style.background = 'linear-gradient(135deg, #1e1b4b, #312e81)';
    }
    mediaSlotsEl.appendChild(slot);
  });
  // ===== ANIMATION ENGINE (scenes + progress only, subtitles burned by FFmpeg) =====
  let startTime = null;
  let lastScene = -1;

  function update(ts) {
    if (!startTime) startTime = ts;
    const t = (ts - startTime) / 1000;
    if (t >= totalDuration + 0.5) return;

    // --- Scene switching ---
    let si = -1;
    for (let i = scenes.length - 1; i >= 0; i--) {
      if (t >= scenes[i].start) { si = i; break; }
    }

    if (si !== lastScene) {
      if (lastScene >= 0) {
        const old = document.getElementById('media-' + lastScene);
        old.classList.remove('active');
        const oldVid = old.querySelector('video');
        if (oldVid) oldVid.pause();
      }
      if (si >= 0) {
        const cur = document.getElementById('media-' + si);
        cur.classList.add('active');
        const curVid = cur.querySelector('video');
        if (curVid) { curVid.currentTime = 0; curVid.play().catch(() => {}); }

        kwLabel.textContent = scenes[si].keyword.toUpperCase();
        kwLabel.classList.remove('visible');
        void kwLabel.offsetWidth;
        kwLabel.classList.add('visible');

        decoTop.classList.remove('show'); decoBottom.classList.remove('show');
        void decoTop.offsetWidth;
        decoTop.classList.add('show'); decoBottom.classList.add('show');
        setTimeout(() => { decoTop.classList.remove('show'); decoBottom.classList.remove('show'); }, 1500);
      }
      lastScene = si;
    }

    // --- Progress bar ---
    progressBar.style.width = Math.min((t / totalDuration) * 100, 100) + '%';

    requestAnimationFrame(update);
  }

  // Auto-start
  requestAnimationFrame(update);

</script>
</body>
</html>
