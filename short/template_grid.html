<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080, height=1920, initial-scale=1.0">
<title>Vocabulary Grid</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@700;900&display=swap');
*{box-sizing:border-box;margin:0;padding:0}
body,html{width:1080px;height:1920px;overflow:hidden;background:#0f0c29;font-family:'Montserrat',Arial,sans-serif}
#bg{position:absolute;top:0;left:0;width:1080px;height:1920px;background:linear-gradient(180deg,#1a1545 0%,#0f0c29 50%,#1a1545 100%);z-index:1}
.glow1{position:absolute;width:600px;height:600px;background:radial-gradient(circle,rgba(99,102,241,0.12)0%,transparent 70%);top:15%;left:5%;z-index:2}
.glow2{position:absolute;width:500px;height:500px;background:radial-gradient(circle,rgba(236,72,153,0.08)0%,transparent 70%);bottom:20%;right:5%;z-index:2}
#header{position:absolute;top:40px;left:50%;transform:translateX(-50%);z-index:20;text-align:center}
#header-text{font-size:42px;font-weight:900;letter-spacing:3px;text-transform:uppercase;background:linear-gradient(90deg,#00f0ff,#ff007f,#ffff00);-webkit-background-clip:text;-webkit-text-fill-color:transparent;filter:drop-shadow(0 2px 8px rgba(0,240,255,0.3))}
#word-counter{font-size:22px;color:rgba(255,255,255,0.5);margin-top:5px;letter-spacing:2px}
#grid-wrapper{position:absolute;top:130px;left:50%;transform:translateX(-50%);width:1000px;height:1000px;z-index:10;border-radius:30px;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,0.6),0 0 40px rgba(99,102,241,0.15);border:4px solid rgba(255,255,255,0.1)}
#grid-image{width:100%;height:100%;object-fit:cover}
#grid-overlay{position:absolute;top:130px;left:50%;transform:translateX(-50%);width:1000px;height:1000px;z-index:15;display:grid;grid-template-columns:repeat(4,1fr);grid-template-rows:repeat(4,1fr);border-radius:30px;overflow:hidden;pointer-events:none}
.grid-cell{position:relative;border:2px solid transparent;transition:all 0.35s ease}
.grid-cell.dimmed{background:rgba(0,0,0,0.45)}
.grid-cell.active{background:transparent;border-color:#ffff00;box-shadow:inset 0 0 25px rgba(255,255,0,0.25),0 0 20px rgba(255,255,0,0.4);transform:scale(1.02);z-index:5}
#subtitle-container{position:absolute;top:1180px;left:50%;transform:translateX(-50%);width:980px;height:600px;display:flex;justify-content:center;align-items:center;text-align:center;z-index:20;padding:20px}
.subtitle-text{font-size:72px;font-weight:900;line-height:1.35;color:#fff;text-transform:uppercase;display:flex;flex-wrap:wrap;justify-content:center;gap:16px 24px;text-shadow:0 4px 12px rgba(0,0,0,0.9)}
.word{display:inline-block;transform:scale(0.9);opacity:0.35;transition:all 0.15s ease}
.word.active{color:#ffff00;transform:scale(1.2);opacity:1;text-shadow:0 0 25px rgba(255,255,0,0.6),0 4px 12px rgba(0,0,0,0.9)}
.word.vocab-word{color:#00f0ff;opacity:0.9}
.word.active.vocab-word{color:#00ff66;transform:scale(1.25);text-shadow:0 0 30px rgba(0,255,102,0.7)}
#active-word-display{position:absolute;top:1150px;left:50%;transform:translateX(-50%);z-index:25;font-size:28px;font-weight:700;color:rgba(255,255,0,0.7);letter-spacing:4px;text-transform:uppercase;text-shadow:0 2px 10px rgba(0,0,0,0.5);opacity:0;transition:opacity 0.3s}
#active-word-display.visible{opacity:1}
</style>
</head>
<body>
<div id="bg"></div><div class="glow1"></div><div class="glow2"></div>
<div id="header"><div id="header-text">TITLE</div><div id="word-counter"></div></div>
<div id="grid-wrapper"><img id="grid-image" src="" alt="Vocabulary Grid"></div>
<div id="grid-overlay"></div>
<div id="active-word-display"></div>
<div id="subtitle-container"><div class="subtitle-text" id="subtitle-display"></div></div>
<script>
window.videoData=window.videoData||{title:'',gridImage:'',words:[],vocabTimeline:[],subtitles:[],audioDuration:60};
var headerText=document.getElementById('header-text'),wordCounter=document.getElementById('word-counter'),gridImage=document.getElementById('grid-image'),gridOverlay=document.getElementById('grid-overlay'),subtitleDisplay=document.getElementById('subtitle-display'),activeWordDisplay=document.getElementById('active-word-display');
for(var ci=0;ci<16;ci++){var cell=document.createElement('div');cell.className='grid-cell';cell.id='cell-'+ci;gridOverlay.appendChild(cell)}
var lastActiveCell=-1;
window.renderFrame=function(t){
headerText.innerText=window.videoData.title;
if(!gridImage.src||gridImage.src===''||gridImage.src===window.location.href)gridImage.src=window.videoData.gridImage;
var ai=-1,tl=window.videoData.vocabTimeline;
for(var i=0;i<tl.length;i++){if(t>=tl[i].start&&t<=tl[i].end){ai=tl[i].word_index;break}}
if(ai!==lastActiveCell){lastActiveCell=ai;for(var j=0;j<16;j++){var c=document.getElementById('cell-'+j);if(!c)continue;c.className=ai===-1?'grid-cell':j===ai?'grid-cell active':'grid-cell dimmed'}}
if(ai>=0&&ai<window.videoData.words.length){wordCounter.innerText=(ai+1)+' / 16';activeWordDisplay.innerText=window.videoData.words[ai];activeWordDisplay.className='visible'}else{wordCounter.innerText='';activeWordDisplay.className=''}
var asub=null;for(var k=0;k<window.videoData.subtitles.length;k++){var s=window.videoData.subtitles[k];if(t>=s.start&&t<=s.end){asub=s;break}}
if(asub){var html='';if(asub.words&&asub.words.length>0){var awi=-1;for(var m=0;m<asub.words.length;m++){if(t>=asub.words[m].start&&t<=asub.words[m].end){awi=m;break}}if(awi===-1){for(var n=0;n<asub.words.length;n++){if(t>=asub.words[n].start)awi=n}}var vwl=window.videoData.words.map(function(w){return w.toLowerCase()});asub.words.forEach(function(w,idx){var cw=w.word.replace(/[^a-zA-Z0-9]/g,'').toLowerCase();var iv=vwl.some(function(vw){return cw===vw||cw.indexOf(vw)>=0});var cn='word';if(idx===awi)cn+=' active';if(iv)cn+=' vocab-word';html+='<span class="'+cn+'">'+w.word+'</span> '})}else{var ws=asub.text.split(/\s+/);var dur=asub.end-asub.start;var el=t-asub.start;var tc=ws.reduce(function(s,w){return s+w.length},0)||1;var ct=0,awi2=-1;var wt2=ws.map(function(w){var wd=dur*(w.length/tc);var st=ct;ct+=wd;return{start:st,end:ct}});for(var p=0;p<wt2.length;p++){if(el>=wt2[p].start&&el<=wt2[p].end){awi2=p;break}}ws.forEach(function(w,idx){var cn='word';if(idx===awi2)cn+=' active';html+='<span class="'+cn+'">'+w+'</span> '})}if(subtitleDisplay.innerHTML!==html)subtitleDisplay.innerHTML=html}else{subtitleDisplay.innerHTML=''}
};
window.isReady=true;
</script>
</body>
</html>
