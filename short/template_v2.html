<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1080, height=1920, initial-scale=1.0">
    <title>Viral English Shorts Template</title>
    <style>
        /* CSS Reset & Setup */
        * { box-sizing: border-box; margin: 0; padding: 0; }
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@800;900&display=swap');
        
        body, html {
            width: 1080px;
            height: 1920px;
            overflow: hidden;
            background-color: #0b0914;
            font-family: 'Montserrat', sans-serif;
        }

        /* Dynamic Animated Background */
        #bg-gradient {
            position: absolute;
            top: 0; left: 0; width: 1080px; height: 1920px;
            background: radial-gradient(circle at 50% 50%, #1e1b4b 0%, #0b0914 100%);
            z-index: 1;
        }

        /* Ambient Glow in Background */
        .glow {
            position: absolute;
            width: 800px;
            height: 800px;
            background: radial-gradient(circle, rgba(99, 102, 241, 0.15) 0%, transparent 70%);
            top: 30%;
            left: 10%;
            z-index: 2;
            pointer-events: none;
        }

        /* Header (Sleek badge) - Prevents text wrapping */
        #header-container {
            position: absolute;
            top: 80px;
            left: 50%;
            transform: translateX(-50%);
            background: linear-gradient(135deg, rgba(255,255,255,0.1), rgba(255,255,255,0.03));
            backdrop-filter: blur(10px);
            padding: 15px 40px;
            border-radius: 50px;
            z-index: 20;
            border: 1px solid rgba(255, 255, 255, 0.15);
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            white-space: nowrap;
        }

        #header-text {
            font-size: 32px;
            font-weight: 900;
            color: #fff;
            letter-spacing: 4px;
            text-transform: uppercase;
            background: linear-gradient(90deg, #00f0ff, #ff007f);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* Image/Text Card Container (Floating Card Style) */
        #media-wrapper {
            position: absolute;
            top: 180px;
            left: 50%;
            transform: translateX(-50%);
            width: 860px;
            height: 860px;
            z-index: 10;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #media-container {
            width: 800px;
            height: 800px;
            border-radius: 40px;
            overflow: hidden;
            box-shadow: 0 35px 70px rgba(0,0,0,0.7), 0 0 45px rgba(99, 102, 241, 0.25);
            border: 6px solid rgba(255,255,255,0.15);
            background: #121026;
            position: relative;
        }

        .media-img {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            object-fit: cover;
            transform-origin: center center;
            opacity: 0;
        }

        /* Text Pop Box in the Center */
        #text-pop-container {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #3b0764 0%, #121026 100%);
            opacity: 0;
            z-index: 5;
            padding: 40px;
            text-align: center;
        }

        #text-pop-word {
            font-size: 96px;
            font-weight: 900;
            color: #ffff00; /* Neon Yellow */
            text-transform: uppercase;
            text-shadow: 0 0 40px rgba(255, 255, 0, 0.8), 0 5px 20px rgba(0,0,0,0.8);
            letter-spacing: 4px;
            transform-origin: center center;
        }

        /* Subtitle Container - PLACED WELL BELOW THE IMAGE */
        #subtitle-container {
            position: absolute;
            top: 1080px;
            left: 50%;
            transform: translateX(-50%);
            width: 960px;
            height: 680px;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            z-index: 20;
            padding: 20px;
        }

        /* Word-by-word CapCut / Hormozi Style */
        .subtitle-text {
            font-size: 78px;
            font-weight: 900;
            line-height: 1.4;
            color: #ffffff;
            text-transform: uppercase;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 20px 30px;
            text-shadow: 0 4px 10px rgba(0,0,0,0.9);
        }

        .word {
            display: inline-block;
            transform: scale(0.9);
            opacity: 0.4;
        }

        /* Active Spoken Word gets POPPED and HIGHLIGHTED */
        .word.active {
            color: #ffff00; /* Neon Yellow */
            transform: scale(1.25);
            opacity: 1;
            text-shadow: 0 0 30px rgba(255, 255, 0, 0.6), 0 4px 15px rgba(0,0,0,0.9);
        }

        /* Keyword Highlights */
        .word.keyword-match {
            color: #00f0ff; /* Neon Cyan */
            opacity: 0.85;
        }

        .word.active.keyword-match {
            color: #00ff66; /* Neon Green when spoken */
            transform: scale(1.3);
            text-shadow: 0 0 35px rgba(0, 255, 102, 0.7), 0 4px 15px rgba(0,0,0,0.9);
        }

    </style>
</head>
<body>

    <div id="bg-gradient"></div>
    <div class="glow"></div>

    <div id="header-container">
        <div id="header-text">English Pro</div>
    </div>

    <!-- Media Container with idle floating animation -->
    <div id="media-wrapper">
        <div id="media-container">
            <img id="media-image-1" class="media-img" src="" alt="">
            <img id="media-image-2" class="media-img" src="" alt="">
            <!-- Text Pop Container inside center card -->
            <div id="text-pop-container">
                <div id="text-pop-word">WORD</div>
            </div>
        </div>
    </div>

    <div id="subtitle-container">
        <div class="subtitle-text" id="subtitle-display"></div>
    </div>

    <script>
        // Data injected by Python
        window.videoData = window.videoData || {
            title: "Learn English",
            segments: [],
            subtitles: []
        };

        const bgGradient = document.getElementById('bg-gradient');
        const img1 = document.getElementById('media-image-1');
        const img2 = document.getElementById('media-image-2');
        const textPopContainer = document.getElementById('text-pop-container');
        const textPopWord = document.getElementById('text-pop-word');
        const subtitleDisplay = document.getElementById('subtitle-display');
        const headerText = document.getElementById('header-text');
        const mediaWrapper = document.getElementById('media-wrapper');

        // Helper to update elements opacity and transform based on segment properties
        function applySegmentStyles(elem, type, seg, timeSeconds, targetOpacity) {
            elem.style.opacity = targetOpacity;
            if (targetOpacity <= 0) return;

            const duration = seg.end - seg.start;
            const elapsed = timeSeconds - seg.start;
            const progress = Math.min(Math.max(elapsed / duration, 0), 1);

            if (type === 'image') {
                const scale = 1.0 + (0.12 * progress);
                const rot = Math.sin(progress * Math.PI) * 1.5;
                elem.style.transform = `scale(${scale}) rotate(${rot}deg)`;
            } else if (type === 'text_pop') {
                // Bounce scale effect (from 0.5 to 1.3 in first 200ms, then settle)
                let scale = 1.0;
                const popTime = 0.22; 
                if (elapsed < popTime) {
                    const t = elapsed / popTime;
                    scale = 0.4 + 0.9 * Math.sin(t * Math.PI / 2);
                } else {
                    const t = (elapsed - popTime) / (duration - popTime || 1);
                    scale = 1.3 - 0.1 * t;
                }
                textPopWord.innerText = seg.text;
                textPopWord.style.transform = `scale(${scale})`;
            }
        }

        window.renderFrame = function(timeSeconds) {
            // Update Header
            if (headerText.innerText !== window.videoData.title) {
                headerText.innerText = window.videoData.title;
            }

            // Slowly rotate background gradient
            bgGradient.style.background = `radial-gradient(circle at 50% 50%, #1e1b4b 0%, #0b0914 100%)`;

            // Floating card effect
            const floatOffset = Math.sin(timeSeconds * 3) * 10;
            mediaWrapper.style.transform = `translateX(-50%) translateY(${floatOffset}px)`;

            // ---- 1. Segment Visual Timeline Rendering ----
            let activeIdx = -1;
            for (let i = 0; i < window.videoData.segments.length; i++) {
                const seg = window.videoData.segments[i];
                if (timeSeconds >= seg.start && timeSeconds <= seg.end) {
                    activeIdx = i;
                    break;
                }
            }

            if (activeIdx !== -1) {
                const activeSeg = window.videoData.segments[activeIdx];
                const segmentDuration = Math.max(activeSeg.end - activeSeg.start, 0.001);
                const crossfadeDuration = Math.min(0.35, segmentDuration * 0.35);
                const timeInSegment = timeSeconds - activeSeg.start;

                if (activeIdx > 0 && crossfadeDuration > 0 && timeInSegment < crossfadeDuration) {
                    // Crossfading active!
                    const prevSeg = window.videoData.segments[activeIdx - 1];
                    const progress = timeInSegment / crossfadeDuration;

                    // Set target elements based on type
                    // Clean up visibility for unused types
                    const prevType = prevSeg.type;
                    const nextType = activeSeg.type;

                    // Handle prev elements
                    if (prevType === 'image') {
                        img1.src = prevSeg.path;
                        applySegmentStyles(img1, 'image', prevSeg, timeSeconds, 1 - progress);
                        textPopContainer.style.opacity = 0;
                    } else if (prevType === 'text_pop') {
                        img1.style.opacity = 0;
                        applySegmentStyles(textPopContainer, 'text_pop', prevSeg, timeSeconds, 1 - progress);
                    }

                    // Handle next elements
                    if (nextType === 'image') {
                        img2.src = activeSeg.path;
                        applySegmentStyles(img2, 'image', activeSeg, timeSeconds, progress);
                    } else if (nextType === 'text_pop') {
                        img2.style.opacity = 0;
                        applySegmentStyles(textPopContainer, 'text_pop', activeSeg, timeSeconds, progress);
                    }

                } else {
                    // Static Segment (No crossfade active)
                    if (activeSeg.type === 'image') {
                        img1.style.opacity = 0;
                        textPopContainer.style.opacity = 0;
                        img2.src = activeSeg.path;
                        applySegmentStyles(img2, 'image', activeSeg, timeSeconds, 1.0);
                    } else if (activeSeg.type === 'text_pop') {
                        img1.style.opacity = 0;
                        img2.style.opacity = 0;
                        applySegmentStyles(textPopContainer, 'text_pop', activeSeg, timeSeconds, 1.0);
                    }
                }
            } else {
                img1.style.opacity = 0;
                img2.style.opacity = 0;
                textPopContainer.style.opacity = 0;
            }

            // ---- 2. Subtitles with exact or estimated word timings ----
            let activeSub = null;
            for (let i = 0; i < window.videoData.subtitles.length; i++) {
                const sub = window.videoData.subtitles[i];
                if (timeSeconds >= sub.start && timeSeconds <= sub.end) {
                    activeSub = sub;
                    break;
                }
            }

            if (activeSub) {
                let htmlContent = "";

                if (activeSub.words && activeSub.words.length > 0) {
                    // 2a. Use exact word timestamps from Gemini API
                    let activeWordIndex = -1;
                    for (let i = 0; i < activeSub.words.length; i++) {
                        const w = activeSub.words[i];
                        if (timeSeconds >= w.start && timeSeconds <= w.end) {
                            activeWordIndex = i;
                            break;
                        }
                    }
                    // Fallback for silent gaps
                    if (activeWordIndex === -1) {
                        for (let i = 0; i < activeSub.words.length; i++) {
                            if (timeSeconds >= activeSub.words[i].start) {
                                activeWordIndex = i;
                            }
                        }
                    }

                    activeSub.words.forEach((w, idx) => {
                        let cleanWord = w.word.replace(/[.,\/#!$%\^&\*;:{}=\-_`~()?]/g,"").toLowerCase();
                        const isKeyword = activeSub.highlighted && cleanWord.includes(activeSub.highlighted.toLowerCase());
                        
                        let className = "word";
                        if (idx === activeWordIndex) className += " active";
                        if (isKeyword) className += " keyword-match";

                        htmlContent += `<span class="${className}">${w.word}</span> `;
                    });
                } else {
                    // 2b. Fallback: Estimate based on length
                    const words = activeSub.text.split(/\s+/);
                    const duration = activeSub.end - activeSub.start;
                    const elapsed = timeSeconds - activeSub.start;
                    const totalChars = words.reduce((sum, word) => sum + word.length, 0) || 1;
                    
                    let cumulativeTime = 0;
                    let activeWordIndex = -1;

                    const wordTimings = words.map((word) => {
                        const wordDur = duration * (word.length / totalChars);
                        const start = cumulativeTime;
                        const end = cumulativeTime + wordDur;
                        cumulativeTime = end;
                        return { start, end };
                    });

                    for (let i = 0; i < wordTimings.length; i++) {
                        if (elapsed >= wordTimings[i].start && elapsed <= wordTimings[i].end) {
                            activeWordIndex = i;
                            break;
                        }
                    }

                    words.forEach((word, idx) => {
                        let cleanWord = word.replace(/[.,\/#!$%\^&\*;:{}=\-_`~()?]/g,"").toLowerCase();
                        const isKeyword = activeSub.highlighted && cleanWord.includes(activeSub.highlighted.toLowerCase());
                        
                        let className = "word";
                        if (idx === activeWordIndex) className += " active";
                        if (isKeyword) className += " keyword-match";

                        htmlContent += `<span class="${className}">${word}</span> `;
                    });
                }

                if (subtitleDisplay.innerHTML !== htmlContent) {
                    subtitleDisplay.innerHTML = htmlContent;
                }
            } else {
                subtitleDisplay.innerHTML = "";
            }
        };

        window.isReady = true;
    </script>
</body>
</html>
