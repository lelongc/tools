<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8">
  <title>Cài đặt Auto Video Illustrator</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 20px;
      max-width: 500px;
      margin: auto;
    }

    .form-group {
      margin-bottom: 15px;
    }

    label {
      display: block;
      margin-bottom: 5px;
      font-weight: bold;
    }

    input[type="text"],
    input[type="password"] {
      width: 100%;
      padding: 8px;
      box-sizing: border-box;
    }

    button {
      padding: 10px 15px;
      background: #4CAF50;
      color: white;
      border: none;
      cursor: pointer;
    }

    button:hover {
      background: #45a049;
    }

    #status {
      margin-top: 10px;
      color: green;
      font-weight: bold;
    }
  </style>
</head>

<body>
  <h2>Cài đặt API Keys</h2>

  <div class="form-group">
    <label for="geminiApiKey">Gemini API Key (AI Phân tích):</label>
    <input type="password" id="geminiApiKey" placeholder="Nhập Gemini API Key">
  </div>

  <div class="form-group">
    <label for="googleSearchApiKey">Google Custom Search API Key:</label>
    <input type="password" id="googleSearchApiKey" placeholder="Nhập Google Search API Key">
  </div>

  <div class="form-group">
    <label for="googleSearchCx">Google Search Engine ID (CX):</label>
    <input type="text" id="googleSearchCx" placeholder="Nhập Search Engine ID">
  </div>

  <button id="saveBtn">Lưu Cài Đặt</button>
  <div id="status"></div>

  <script src="options.js"></script>
</body>

</html>
