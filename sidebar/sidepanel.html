<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sidebar Quick Links</title>
    <link rel="stylesheet" href="sidepanel.css">
</head>
<body>
    <div id="sidebar-container">
        <!-- Header -->
        <div class="header">
            <h2>My Links</h2>
            <button id="add-current-tab-btn" class="primary-btn" title="Add Current Tab">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="12" y1="5" x2="12" y2="19"></line>
                    <line x1="5" y1="12" x2="19" y2="12"></line>
                </svg>
            </button>
        </div>

        <!-- List of Links -->
        <div id="links-container" class="links-list">
            <!-- Items injected by JS -->
        </div>

        <!-- Viewing Area (Iframe) -->
        <div id="viewer-container" class="viewer-hidden">
            <div class="viewer-header">
                <span id="viewer-title">Website</span>
                <div class="viewer-actions">
                    <button id="open-new-tab-btn" class="icon-btn" title="Open in New Tab">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path>
                            <polyline points="15 3 21 3 21 9"></polyline>
                            <line x1="10" y1="14" x2="21" y2="3"></line>
                        </svg>
                    </button>
                    <button id="close-viewer-btn" class="icon-btn" title="Close Viewer">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <line x1="18" y1="6" x2="6" y2="18"></line>
                            <line x1="6" y1="6" x2="18" y2="18"></line>
                        </svg>
                    </button>
                </div>
            </div>
            <div class="iframe-wrapper">
                <div id="iframe-error-msg" class="hidden">
                    <p>This website blocks embedded viewing.</p>
                    <button id="fallback-open-tab-btn" class="secondary-btn">Open in New Tab</button>
                </div>
                <iframe id="content-viewer" sandbox="allow-same-origin allow-scripts allow-forms allow-popups"></iframe>
            </div>
        </div>
    </div>
    
    <!-- Template for list items -->
    <template id="link-item-template">
        <div class="link-item">
            <img class="favicon" src="" alt="icon">
            <div class="link-info">
                <span class="link-title"></span>
                <span class="link-url"></span>
            </div>
            <div class="item-actions">
                <button class="open-tab-btn icon-btn" title="Open in New Tab">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path>
                        <polyline points="15 3 21 3 21 9"></polyline>
                        <line x1="10" y1="14" x2="21" y2="3"></line>
                    </svg>
                </button>
                <button class="remove-btn icon-btn" title="Remove">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <polyline points="3 6 5 6 21 6"></polyline>
                        <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
                    </svg>
                </button>
            </div>
        </div>
    </template>

    <script src="sidepanel.js"></script>
</body>
</html>
