<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Sub-Video Workspace</title>
  <link rel="stylesheet" href="workspace.css">
  <script src="config.js"></script>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>🎧 Sub-Video <span>AI Generator</span></h1>
      <p>Kéo thả file Video vào đây để máy tính tự động tách âm thanh và dịch thành phụ đề SRT.</p>
      <div class="settings">
        <div class="setting-group">
          <label>Dịch sang:</label>
          <select id="tgtLang">
            <option value="Vietnamese">Tiếng Việt</option>
            <option value="English">Tiếng Anh</option>
            <option value="">Không dịch (Chỉ xuất văn bản gốc)</option>
          </select>
        </div>
      </div>
    </div>

    <div id="drop-zone" class="drop-zone">
      <div class="drop-content">
        <div class="icon">📁</div>
        <h3>Kéo thả file video (.mp4, .mkv)</h3>
        <p>hoặc bấm để chọn file từ máy tính</p>
      </div>
      <input type="file" id="file-input" accept="video/*,audio/*" style="display:none">
    </div>

    <div id="progress-container" class="hidden">
      <h3 id="status-text">Đang chuẩn bị...</h3>
      <div class="progress-bar">
        <div id="progress-fill" class="fill"></div>
      </div>
      <div id="log-box" class="log-box"></div>
      <button id="download-btn" class="btn hidden">📥 Tải file .SRT</button>
    </div>
  </div>
  <script src="workspace.js"></script>
</body>
</html>
