<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="ex_grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff6b6b"/>
      <stop offset="70%" stop-color="#dc2626"/>
      <stop offset="100%" stop-color="#7f1d1d"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-color="#450a0a" flood-opacity="0.35"/>
    </filter>
  </defs>
  <!-- Yellow Flash Aura behind -->
  <polygon points="64,4 76,34 104,20 86,48 116,60 84,72 100,104 68,88 56,120 48,88 18,100 34,70 4,58 34,46 16,18 48,32" fill="#fef08a" stroke="#ca8a04" stroke-width="3"/>
