  <polygon points="54,16 74,16 68,76 60,76" fill="url(#ex_grad)" stroke="#450a0a" stroke-width="6" stroke-linejoin="round" filter="url(#shadow)"/>
  <!-- Dot -->
  <circle cx="64" cy="98" r="10" fill="url(#ex_grad)" stroke="#450a0a" stroke-width="6" filter="url(#shadow)"/>
