<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160">
  <defs>
    <linearGradient id="gold_star" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#facc15"/>
      <stop offset="100%" stop-color="#ca8a04"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-color="#713f12" flood-opacity="0.35"/>
    </filter>
  </defs>
  <!-- Confetti Ribbons & Streamers -->
  <path d="M20 40 Q40 20 20 10 Q40 0 60 20" fill="none" stroke="#ec4899" stroke-width="4" stroke-linecap="round"/>
  <path d="M140 40 Q120 20 140 10 Q120 0 100 20" fill="none" stroke="#3b82f6" stroke-width="4" stroke-linecap="round"/>
  <polygon points="12,70 18,78 10,82" fill="#8b5cf6"/>
  <polygon points="144,70 150,78 140,82" fill="#10b981"/>
  <polygon points="26,130 36,132 30,140" fill="#f59e0b"/>
  <polygon points="130,130 140,132 134,140" fill="#ef4444"/>
  <!-- Central Mega Gold Star -->
  <polygon points="80,24 95,58 132,61 104,86 113,122 80,103 47,122 56,86 28,61 65,58" 
           fill="url(#gold_star)" stroke="#854d0e" stroke-width="6" stroke-linejoin="round" filter="url(#shadow)"/>
  <!-- Top Specular Highlight -->
  <polygon points="80,32 90,56 80,64 70,56" fill="#ffffff" fill-opacity="0.7"/>
  <!-- Mini Sparkles -->
  <polygon points="40,26 42,32 48,34 42,36 40,42 38,36 32,34 38,32" fill="#ffffff"/>
  <polygon points="120,26 122,32 128,34 122,36 120,42 118,36 112,34 118,32" fill="#ffffff"/>
</svg>