<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="wood_grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ea580c"/>
      <stop offset="100%" stop-color="#9a3412"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>
  <!-- Box -->
  <rect x="20" y="24" width="88" height="88" rx="8" fill="url(#wood_grad)" stroke="#431407" stroke-width="6" filter="url(#shadow)"/>
  <!-- Wood Planks -->
  <line x1="20" y1="52" x2="108" y2="52" stroke="#431407" stroke-width="3"/>
  <line x1="20" y1="84" x2="108" y2="84" stroke="#431407" stroke-width="3"/>
  <!-- White Banner for TNT -->
  <rect x="26" y="46" width="76" height="36" fill="#ffffff" stroke="#431407" stroke-width="2"/>
  <!-- TNT Text -->
  <text x="64" y="73" font-family="Arial Black, Impact, sans-serif" font-weight="900" font-size="24" fill="#dc2626" text-anchor="middle">TNT</text>
</svg>