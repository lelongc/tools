<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="star_grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="40%" stop-color="#facc15"/>
      <stop offset="100%" stop-color="#ca8a04"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-color="#713f12" flood-opacity="0.35"/>
    </filter>
  </defs>
  <!-- 5-Point Star -->
  <polygon points="64,12 79,46 116,49 88,74 97,110 64,91 31,110 40,74 12,49 49,46" 
           fill="url(#star_grad)" stroke="#854d0e" stroke-width="5" stroke-linejoin="round" filter="url(#shadow)"/>
  <!-- Highlight Top Edge -->
  <polygon points="64,18 76,44 64,52 52,44" fill="#ffffff" fill-opacity="0.6"/>
</svg>