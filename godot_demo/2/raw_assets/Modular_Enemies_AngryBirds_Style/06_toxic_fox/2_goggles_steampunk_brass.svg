<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 100" width="220" height="100">
  <defs>
    <linearGradient id="brass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="60%" stop-color="#ca8a04"/>
      <stop offset="100%" stop-color="#713f12"/>
    </linearGradient>
    <radialGradient id="green_glow" cx="40%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#ecfccb"/>
      <stop offset="50%" stop-color="#84cc16"/>
      <stop offset="100%" stop-color="#3f6212"/>
    </radialGradient>
  </defs>
  <!-- Leather Strap -->
  <rect x="10" y="40" width="200" height="20" rx="4" fill="#451a03" stroke="#1c0b02" stroke-width="3"/>
  <!-- Left Brass Eyepiece -->
  <circle cx="68" cy="50" r="38" fill="url(#brass)" stroke="#1c0b02" stroke-width="6"/>
  <circle cx="68" cy="50" r="26" fill="url(#green_glow)" stroke="#1c0b02" stroke-width="3"/>
  <!-- Right Brass Eyepiece -->
  <circle cx="152" cy="50" r="38" fill="url(#brass)" stroke="#1c0b02" stroke-width="6"/>
  <circle cx="152" cy="50" r="26" fill="url(#green_glow)" stroke="#1c0b02" stroke-width="3"/>
  <!-- Center Bridge -->
  <rect x="98" y="44" width="24" height="12" rx="3" fill="url(#brass)" stroke="#1c0b02" stroke-width="3"/>
</svg>