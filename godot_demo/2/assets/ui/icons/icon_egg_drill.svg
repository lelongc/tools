<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="drillSteel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="35%" stop-color="#94a3b8"/>
      <stop offset="70%" stop-color="#475569"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="drillTip" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#facc15"/>
      <stop offset="100%" stop-color="#ca8a04"/>
    </linearGradient>
  </defs>

  <!-- Circular Badge Background -->
  <circle cx="32" cy="32" r="30" fill="#334155" stroke="#1e293b" stroke-width="2.5"/>
  <circle cx="32" cy="32" r="27" fill="#1e293b"/>

  <!-- Drill Egg Body -->
  <path d="M32 8 C20 8, 14 26, 14 38 C14 50, 22 56, 32 56 C42 56, 50 50, 50 38 C50 26, 44 8, 32 8 Z" 
        fill="url(#drillSteel)" stroke="#0f172a" stroke-width="2.5"/>

  <!-- Spiral Helical Drill Flutes -->
  <path d="M17 24 Q32 20, 47 30" fill="none" stroke="#0f172a" stroke-width="3" stroke-linecap="round"/>
  <path d="M17 23 Q32 19, 47 29" fill="none" stroke="#f1f5f9" stroke-width="1" stroke-linecap="round"/>

  <path d="M14 36 Q32 32, 50 42" fill="none" stroke="#0f172a" stroke-width="3.5" stroke-linecap="round"/>
  <path d="M14 35 Q32 31, 50 41" fill="none" stroke="#f1f5f9" stroke-width="1" stroke-linecap="round"/>

  <path d="M18 48 Q32 46, 46 51" fill="none" stroke="#0f172a" stroke-width="3" stroke-linecap="round"/>

  <!-- Carbide Drill Tip Cap (Gold) -->
  <path d="M28 8 L32 3 L36 8 Z" fill="url(#drillTip)" stroke="#854d0e" stroke-width="1.5"/>

  <!-- Yellow Hazard Warning Stripes -->
  <rect x="25" y="37" width="14" height="4" fill="#facc15" transform="rotate(-15 32 39)"/>
  <rect x="27" y="37" width="3" height="4" fill="#0f172a" transform="rotate(-15 32 39)"/>
  <rect x="34" y="37" width="3" height="4" fill="#0f172a" transform="rotate(-15 32 39)"/>
</svg>
