<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <radialGradient id="bomb_grad" cx="40%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#4a5568"/>
      <stop offset="50%" stop-color="#2d3748"/>
      <stop offset="100%" stop-color="#1a202c"/>
    </radialGradient>
    <linearGradient id="fuse_spark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffff00"/>
      <stop offset="100%" stop-color="#ff3b00"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="4" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>
  <!-- Fuse -->
  <path d="M64 26 C64 14 78 18 80 8" fill="none" stroke="#d69e2e" stroke-width="4" stroke-linecap="round"/>
  <!-- Spark -->
  <polygon points="80,8 86,2 84,9 90,8 84,12 87,17 81,13 77,18 78,11 73,10" fill="url(#fuse_spark)"/>
  <!-- Bomb Cap -->
  <rect x="56" y="24" width="16" height="8" rx="3" fill="#718096" stroke="#1a202c" stroke-width="2"/>
  <!-- Egg Bomb Body -->
  <path d="M64 28 C38 28 26 54 26 82 C26 102 42 116 64 116 C86 116 102 102 102 82 C102 54 90 28 64 28 Z" 
        fill="url(#bomb_grad)" stroke="#1a202c" stroke-width="5" filter="url(#shadow)"/>
  <!-- Danger Skull / Flame Icon on Bomb -->
  <path d="M64 68 C58 68 54 74 54 80 C54 86 64 96 64 96 C64 96 74 86 74 80 C74 74 70 68 64 68 Z" fill="#e53e3e"/>
  <ellipse cx="64" cy="82" rx="4" ry="6" fill="#ecc94b"/>
  <!-- Highlight -->
  <ellipse cx="48" cy="50" rx="10" ry="18" transform="rotate(-25 48 50)" fill="#ffffff" fill-opacity="0.3"/>
</svg>