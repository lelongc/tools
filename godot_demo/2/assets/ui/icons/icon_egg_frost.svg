<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="frostIce" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="35%" stop-color="#7dd3fc"/>
      <stop offset="75%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
  </defs>

  <!-- Circular Badge Background -->
  <circle cx="32" cy="32" r="30" fill="#0369a1" stroke="#082f49" stroke-width="2.5"/>
  <circle cx="32" cy="32" r="27" fill="#0c4a6e"/>

  <!-- Frost Egg Silhouette -->
  <path d="M32 8 C20 8, 14 26, 14 38 C14 50, 22 56, 32 56 C42 56, 50 50, 50 38 C50 26, 44 8, 32 8 Z" 
        fill="url(#frostIce)" stroke="#082f49" stroke-width="2.5"/>

