    <line x1="32" y1="26" x2="32" y2="46"/>
    <line x1="22" y1="36" x2="42" y2="36"/>
    <line x1="25" y1="29" x2="39" y2="43"/>
    <line x1="25" y1="43" x2="39" y2="29"/>
    <!-- Snowflake Chevrons -->
    <path d="M30 29 L32 26 L34 29"/>
    <path d="M30 43 L32 46 L34 43"/>
    <path d="M25 34 L22 36 L25 38"/>
    <path d="M39 34 L42 36 L39 38"/>
  </g>
  <circle cx="32" cy="36" r="2.5" fill="#bae6fd"/>

  <!-- Sparkle Glints -->
  <polygon points="44,20 45,17 46,20 49,20 47,21 48,24 45,22 43,24 44,21 41,20" fill="#ffffff"/>
  <polygon points="18,44 19,42 20,44 22,44 20,45 21,47 19,46 17,47 18,45 16,44" fill="#ffffff"/>
</svg>
