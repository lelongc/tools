<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="chickYellow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="40%" stop-color="#facc15"/>
      <stop offset="100%" stop-color="#ca8a04"/>
    </linearGradient>
    <linearGradient id="shellWhite" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#f1f5f9"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>
  </defs>

  <!-- Circular Badge Background -->
  <circle cx="32" cy="32" r="30" fill="#a16207" stroke="#713f12" stroke-width="2.5"/>
  <circle cx="32" cy="32" r="27" fill="#451a03"/>

  <!-- Main Shell Silhouette -->
  <path d="M32 8 C20 8, 14 26, 14 38 C14 50, 22 56, 32 56 C42 56, 50 50, 50 38 C50 26, 44 8, 32 8 Z" 
        fill="url(#shellWhite)" stroke="#1e293b" stroke-width="2.5"/>

  <!-- Peeking Cute Chick Inside Hatching Crack -->
  <!-- Cute Chick Head -->
  <circle cx="32" cy="28" r="13" fill="url(#chickYellow)" stroke="#854d0e" stroke-width="1.8"/>
  <!-- Beak -->
  <polygon points="30,28 34,28 32,32" fill="#f97316" stroke="#c2410c" stroke-width="1"/>
  <!-- Big Eyes -->
  <circle cx="27" cy="25" r="3" fill="#0f172a"/>
  <circle cx="26" cy="24" r="1.2" fill="#ffffff"/>
  <circle cx="37" cy="25" r="3" fill="#0f172a"/>
  <circle cx="36" cy="24" r="1.2" fill="#ffffff"/>
  <!-- Rosy Cheeks -->
  <circle cx="24" cy="29" r="2" fill="#f43f5e" opacity="0.6"/>
  <circle cx="40" cy="29" r="2" fill="#f43f5e" opacity="0.6"/>

  <!-- Broken Eggshell Bottom Cap with Zig-Zag Teeth -->
  <path d="M14 38 Q22 42, 32 40 Q42 42, 50 38 C50 50, 42 56, 32 56 C22 56, 14 50, 14 38 Z" fill="url(#shellWhite)" stroke="#1e293b" stroke-width="2.2"/>
  <path d="M14 38 L20 34 L26 38 L32 32 L38 38 L44 34 L50 38" fill="none" stroke="#1e293b" stroke-width="2.2" stroke-linejoin="round"/>

  <!-- Left Flapping Wing -->
  <path d="M16 26 Q10 28, 12 34 Q18 34, 18 30 Z" fill="url(#chickYellow)" stroke="#854d0e" stroke-width="1.5"/>
  <!-- Right Flapping Wing -->
  <path d="M48 26 Q54 28, 52 34 Q46 34, 46 30 Z" fill="url(#chickYellow)" stroke="#854d0e" stroke-width="1.5"/>

  <!-- Eggshell Top Hat Piece -->
  <polygon points="26,12 32,8 38,12 35,16 32,13 29,16" fill="#ffffff" stroke="#1e293b" stroke-width="1.5"/>
</svg>
