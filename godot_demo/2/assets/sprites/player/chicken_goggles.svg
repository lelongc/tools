<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96">
  <defs>
    <linearGradient id="goggleBrass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="35%" stop-color="#f59e0b"/>
      <stop offset="75%" stop-color="#b45309"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>
    <radialGradient id="goggleGlass" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#f0f9ff"/>
      <stop offset="45%" stop-color="#38bdf8"/>
      <stop offset="90%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </radialGradient>
  </defs>

  <!-- Side Leather Straps -->
  <path d="M20 35 L30 35" stroke="#451a03" stroke-width="4.5" stroke-linecap="round"/>
  <path d="M70 35 L80 35" stroke="#451a03" stroke-width="4.5" stroke-linecap="round"/>

  <!-- Left Brass Goggle Rim & Lens -->
  <circle cx="39" cy="34" r="10.5" fill="url(#goggleBrass)" stroke="#451a03" stroke-width="1.8"/>
  <circle cx="39" cy="34" r="8" fill="url(#goggleGlass)"/>
  <!-- Glass Highlight Curve -->
  <path d="M34 30 Q39 31, 37 36" stroke="#ffffff" stroke-width="2" fill="none" stroke-linecap="round" opacity="0.85"/>
  <circle cx="42" cy="37" r="1.2" fill="#ffffff" opacity="0.75"/>

  <!-- Right Brass Goggle Rim & Lens -->
  <circle cx="61" cy="34" r="10.5" fill="url(#goggleBrass)" stroke="#451a03" stroke-width="1.8"/>
  <circle cx="61" cy="34" r="8" fill="url(#goggleGlass)"/>
  <!-- Glass Highlight Curve -->
  <path d="M56 30 Q61 31, 59 36" stroke="#ffffff" stroke-width="2" fill="none" stroke-linecap="round" opacity="0.85"/>
  <circle cx="64" cy="37" r="1.2" fill="#ffffff" opacity="0.75"/>

  <!-- Brass Bridge Connection with Rivets -->
  <rect x="47" y="32" width="6" height="4.5" rx="1.5" fill="url(#goggleBrass)" stroke="#451a03" stroke-width="1.2"/>
  <circle cx="50" cy="34" r="0.8" fill="#451a03"/>
</svg>
