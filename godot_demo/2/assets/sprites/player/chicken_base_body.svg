<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96">
  <defs>
    <radialGradient id="chickenBody" cx="40%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#facc15"/>
      <stop offset="85%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#ca8a04"/>
    </radialGradient>
    <linearGradient id="leatherCap" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#78350f"/>
      <stop offset="50%" stop-color="#92400e"/>
      <stop offset="100%" stop-color="#451a03"/>
    </linearGradient>
  </defs>

  <!-- Main Round Hen Body -->
  <circle cx="50" cy="54" r="34" fill="url(#chickenBody)" stroke="#ca8a04" stroke-width="2.5"/>

  <!-- Red Crown Comb (Top of head) with glossy highlight -->
  <path d="M40 22 C38 12, 46 10, 48 18 C50 8, 60 8, 60 18 C64 12, 70 14, 68 24 Z" 
        fill="#dc2626" stroke="#991b1b" stroke-width="2"/>
  <ellipse cx="48" cy="15" rx="3" ry="1.5" fill="#fca5a5" opacity="0.6"/>

  <!-- Aviator Leather Pilot Helmet -->
  <path d="M26 40 C24 24, 40 18, 56 18 C72 18, 76 28, 76 40 C76 43, 72 44, 68 44 C66 36, 58 32, 48 32 C38 32, 32 36, 28 44 C26 44, 26 42, 26 40 Z" 
        fill="url(#leatherCap)" stroke="#3b1502" stroke-width="2.5"/>
  <!-- Helmet Ear Flaps -->
  <path d="M25 38 C22 46, 22 56, 26 62 C28 62, 30 56, 30 46 Z" fill="url(#leatherCap)" stroke="#3b1502" stroke-width="1.8"/>
  <path d="M75 38 C78 46, 78 56, 74 62 C72 62, 70 56, 70 46 Z" fill="url(#leatherCap)" stroke="#3b1502" stroke-width="1.8"/>

  <!-- Steampunk Goggles Strap Behind Head -->
  <path d="M22 36 Q50 34, 78 36" fill="none" stroke="#1e293b" stroke-width="4.5" stroke-linecap="round"/>

  <!-- Cute Rosy Cheeks -->
  <ellipse cx="32" cy="57" rx="5" ry="3" fill="#f87171" opacity="0.6"/>
  <ellipse cx="68" cy="57" rx="5" ry="3" fill="#f87171" opacity="0.6"/>

  <!-- Red Wattle below beak -->
  <path d="M47 64 C44 72, 52 74, 50 64 Z" fill="#ef4444" stroke="#991b1b" stroke-width="1.5"/>

  <!-- Default Closed Beak Base -->
  <path d="M44 56 Q50 53, 56 56 Q50 67, 44 56 Z" fill="#f97316" stroke="#9a3412" stroke-width="2" stroke-linejoin="round"/>
  <path d="M45 57 Q50 60, 55 57" fill="none" stroke="#9a3412" stroke-width="1.2"/>
</svg>
