      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>
    <linearGradient id="badgeInterior" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2d1547"/>
      <stop offset="100%" stop-color="#160826"/>
