  <!-- Vệt sáng bóng trên vòm -->
  <path d="M 16 8 Q 64 12 112 8 C 118 8 119 11 116 14 Q 64 18 12 14 C 9 11 10 8 16 8 Z" fill="#ffffff" opacity="0.35"/>
