<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 80" width="256" height="80">
  <!-- Bong bóng hướng dẫn dạng khung gỗ đục lỗ tinh tế (9-Patch Tutorial Speech Bubble) -->
  <!-- Thân khung gỗ chính dày dặn bo tròn góc -->
  <rect x="3" y="3" width="250" height="66" rx="16" fill="#3a2214" stroke="#221208" stroke-width="3"/>
  <!-- Nẹp gỗ nổi 3D -->
  <rect x="7" y="7" width="242" height="58" rx="12" fill="#4d2f1b" stroke="#361f10" stroke-width="1.8"/>
  <!-- Lòng panel khoét chìm màu gỗ mun đậm để đọc chữ sắc nét -->
  <rect x="14" y="14" width="228" height="44" rx="8" fill="#201107" stroke="#140a04" stroke-width="1.5"/>

  <!-- 4 Đinh tán đồng thau ở 4 góc -->
  <circle cx="16" cy="16" r="2.8" fill="#c49652" stroke="#523310" stroke-width="1"/>
  <circle cx="15" cy="15" r="0.9" fill="#fff5d6"/>
  <circle cx="240" cy="16" r="2.8" fill="#c49652" stroke="#523310" stroke-width="1"/>
  <circle cx="239" cy="15" r="0.9" fill="#fff5d6"/>
  <circle cx="16" cy="56" r="2.8" fill="#c49652" stroke="#523310" stroke-width="1"/>
  <circle cx="15" cy="55" r="0.9" fill="#fff5d6"/>
  <circle cx="240" cy="56" r="2.8" fill="#c49652" stroke="#523310" stroke-width="1"/>
  <circle cx="239" cy="55" r="0.9" fill="#fff5d6"/>

  <!-- Mũi nhọn bong bóng chỉ xuống đáy ở giữa (Speech Pointer Tail) -->
  <polygon points="120,68 136,68 128,78" fill="#3a2214" stroke="#221208" stroke-width="2.5" stroke-linejoin="round"/>
  <polygon points="122,67 134,67 128,75" fill="#4d2f1b"/>
</svg>
