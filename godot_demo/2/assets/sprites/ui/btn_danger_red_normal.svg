<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 64" width="192" height="64">
  <defs>
    <!-- Thân nút đỏ ruby rực lửa -->
    <linearGradient id="redBase" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ff4d4d"/>
      <stop offset="35%" stop-color="#e62222"/>
      <stop offset="85%" stop-color="#b80c0c"/>
      <stop offset="100%" stop-color="#8a0505"/>
    </linearGradient>
    <linearGradient id="redGloss" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.85"/>
      <stop offset="45%" stop-color="#ffffff" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="redBevelBottom" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#590303"/>
      <stop offset="100%" stop-color="#330101"/>
    </linearGradient>
  </defs>

  <!-- Bóng đổ đáy -->
  <rect x="6" y="8" width="180" height="52" rx="18" fill="#000000" opacity="0.35"/>

  <!-- Khối đế 3D dày 8px -->
  <rect x="4" y="6" width="184" height="54" rx="18" fill="url(#redBevelBottom)" stroke="#2b0000" stroke-width="2"/>

  <!-- Mặt nút nổi lên trên -->
  <rect x="4" y="4" width="184" height="48" rx="16" fill="url(#redBase)" stroke="#ffa3a3" stroke-width="1.8"/>

  <!-- Vệt sáng phản chiếu Gloss -->
  <path d="M 18 8 Q 96 12 174 8 C 178 8 180 12 178 18 Q 96 28 14 18 C 12 12 14 8 18 8 Z" fill="url(#redGloss)"/>

  <!-- Đinh tán góc màu bạc sáng -->
  <circle cx="16" cy="28" r="3.2" fill="#ffd1d1" stroke="#590303" stroke-width="1.2"/>
  <circle cx="15.2" cy="27.2" r="1.2" fill="#ffffff"/>
  <circle cx="176" cy="28" r="3.2" fill="#ffd1d1" stroke="#590303" stroke-width="1.2"/>
  <circle cx="175.2" cy="27.2" r="1.2" fill="#ffffff"/>
</svg>
