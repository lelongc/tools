<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 48" width="192" height="48">
  <defs>
    <!-- Gỗ sồi nâu vàng phong cách Cartoon -->
    <linearGradient id="shelfWood" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#df9648"/>
      <stop offset="40%" stop-color="#c67d38"/>
      <stop offset="85%" stop-color="#9a5a20"/>
      <stop offset="100%" stop-color="#733d14"/>
    </linearGradient>
    <linearGradient id="shelfBevel" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#542807"/>
      <stop offset="100%" stop-color="#2b1101"/>
    </linearGradient>
    <!-- Rãnh trũng đặt trứng (Recessed slot) -->
    <linearGradient id="grooveSlot" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e0c03"/>
      <stop offset="50%" stop-color="#3d1b06"/>
      <stop offset="100%" stop-color="#4d2407"/>
    </linearGradient>
  </defs>

  <!-- Bóng đổ đáy -->
  <rect x="4" y="6" width="184" height="40" rx="16" fill="#000000" opacity="0.35"/>

  <!-- Khối đế gỗ 3D Bevel 6px -->
  <rect x="2" y="4" width="188" height="42" rx="16" fill="url(#shelfBevel)" stroke="#1f0c01" stroke-width="2"/>

  <!-- Thân khay gỗ chính -->
  <rect x="2" y="2" width="188" height="38" rx="14" fill="url(#shelfWood)" stroke="#fed7aa" stroke-width="1.5"/>

  <!-- Rãnh khoét trũng (Recessed groove) để đặt các quả trứng lọt vào -->
  <rect x="10" y="7" width="172" height="28" rx="12" fill="url(#grooveSlot)" stroke="#2b1101" stroke-width="1.8"/>

  <!-- Vệt bóng sáng viền ngoài -->
  <path d="M 14 4 H 178 Q 186 4 186 7 H 6 Q 6 4 14 4 Z" fill="#ffffff" opacity="0.45"/>

  <!-- Đinh ốc kim loại 2 bên -->
  <circle cx="6" cy="21" r="2.2" fill="#e2e8f0" stroke="#334155" stroke-width="0.8"/>
  <circle cx="186" cy="21" r="2.2" fill="#e2e8f0" stroke="#334155" stroke-width="0.8"/>
</svg>
