<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 64" width="192" height="64">
  <defs>
    <!-- Thân nút xanh lục bảo tươi sáng -->
    <linearGradient id="greenBase" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#48db48"/>
      <stop offset="35%" stop-color="#2bb82b"/>
      <stop offset="85%" stop-color="#1b8c1b"/>
      <stop offset="100%" stop-color="#126e12"/>
    </linearGradient>
    <!-- Viền bóng dập nổi 3D phía trên -->
    <linearGradient id="greenGloss" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.85"/>
      <stop offset="40%" stop-color="#ffffff" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <!-- Đế 3D tối màu tạo độ dày khối 8px -->
    <linearGradient id="greenBevelBottom" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0d4d0d"/>
      <stop offset="100%" stop-color="#062b06"/>
    </linearGradient>
  </defs>

  <!-- Bóng đổ đáy nút (Shadow) -->
  <rect x="6" y="8" width="180" height="52" rx="18" fill="#000000" opacity="0.35"/>

  <!-- Khối đế 3D Bevel dày cộm (Độ lún 8px) -->
  <rect x="4" y="6" width="184" height="54" rx="18" fill="url(#greenBevelBottom)" stroke="#041f04" stroke-width="2"/>

  <!-- Mặt nút nổi lên trên -->
  <rect x="4" y="4" width="184" height="48" rx="16" fill="url(#greenBase)" stroke="#74f074" stroke-width="1.8"/>

  <!-- Vệt sáng phản chiếu (Gloss highlight cong mềm) -->
  <path d="M 18 8 Q 96 12 174 8 C 178 8 180 12 178 18 Q 96 28 14 18 C 12 12 14 8 18 8 Z" fill="url(#greenGloss)"/>

  <!-- Hai đinh tán/ngọc sáng góc trái phải tạo phong cách Cartoon -->
  <circle cx="16" cy="28" r="3.2" fill="#a3f7a3" stroke="#0e5c0e" stroke-width="1.2"/>
  <circle cx="15.2" cy="27.2" r="1.2" fill="#ffffff"/>
  <circle cx="176" cy="28" r="3.2" fill="#a3f7a3" stroke="#0e5c0e" stroke-width="1.2"/>
  <circle cx="175.2" cy="27.2" r="1.2" fill="#ffffff"/>
</svg>
