<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <!-- Khung viền gỗ sồi dày dặn (Outer Heavy Wood Frame) -->
  <rect x="4" y="4" width="248" height="248" rx="26" fill="#442816" stroke="#241308" stroke-width="4"/>
  <!-- Lớp gỗ nẹp nổi bề mặt 3D -->
  <rect x="12" y="12" width="232" height="232" rx="20" fill="#58351e" stroke="#361f0f" stroke-width="2"/>
  <!-- Lòng panel khoét chìm màu gỗ mun đậm làm nền cho các thành phần UI -->
  <rect x="22" y="22" width="212" height="212" rx="14" fill="#24140b" stroke="#180c05" stroke-width="2.5"/>

  <!-- 4 Nẹp góc đồng thau đúc dày dặn có đinh tán (Heavy Brass Corner Brackets) -->
  <!-- Góc trên - Trái -->
  <path d="M 6 36 L 6 18 A 12 12 0 0 1 18 6 L 36 6 L 36 18 L 18 18 L 18 36 Z" fill="#c49652" stroke="#482e11" stroke-width="1.8"/>
  <circle cx="26" cy="12" r="2.2" fill="#523310"/>
  <circle cx="12" cy="26" r="2.2" fill="#523310"/>
  <circle cx="25" cy="11" r="0.9" fill="#fff5d6"/>
  <circle cx="11" cy="25" r="0.9" fill="#fff5d6"/>

  <!-- Góc trên - Phải -->
  <path d="M 250 36 L 250 18 A 12 12 0 0 0 238 6 L 220 6 L 220 18 L 238 18 L 238 36 Z" fill="#c49652" stroke="#482e11" stroke-width="1.8"/>
  <circle cx="230" cy="12" r="2.2" fill="#523310"/>
  <circle cx="244" cy="26" r="2.2" fill="#523310"/>
  <circle cx="229" cy="11" r="0.9" fill="#fff5d6"/>
  <circle cx="243" cy="25" r="0.9" fill="#fff5d6"/>

  <!-- Góc dưới - Trái -->
  <path d="M 6 220 L 6 238 A 12 12 0 0 0 18 250 L 36 250 L 36 238 L 18 238 L 18 220 Z" fill="#c49652" stroke="#482e11" stroke-width="1.8"/>
  <circle cx="26" cy="244" r="2.2" fill="#523310"/>
  <circle cx="12" cy="230" r="2.2" fill="#523310"/>
  <circle cx="25" cy="243" r="0.9" fill="#fff5d6"/>
  <circle cx="11" cy="229" r="0.9" fill="#fff5d6"/>

  <!-- Góc dưới - Phải -->
  <path d="M 250 220 L 250 238 A 12 12 0 0 1 238 250 L 220 250 L 220 238 L 238 238 L 238 220 Z" fill="#c49652" stroke="#482e11" stroke-width="1.8"/>
  <circle cx="230" cy="244" r="2.2" fill="#523310"/>
  <circle cx="244" cy="230" r="2.2" fill="#523310"/>
  <circle cx="229" cy="243" r="0.9" fill="#fff5d6"/>
  <circle cx="243" cy="229" r="0.9" fill="#fff5d6"/>
</svg>
