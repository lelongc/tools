<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <!-- Thân modal FLAT màu tím sẫm thanh lịch -->
  <rect x="6" y="6" width="244" height="244" rx="24" fill="#1b0e33" stroke="#f1c40f" stroke-width="4"/>

  <!-- Viền nhấn bên trong (Flat inner trim) -->
  <rect x="18" y="18" width="220" height="220" rx="16" fill="none" stroke="#6c3483" stroke-width="2"/>

  <!-- 4 nẹp góc phẳng phong cách Cartoon Flat (Corner Brackets) -->
  <!-- Góc trên - Trái -->
  <path d="M 6 32 L 6 18 A 12 12 0 0 1 18 6 L 32 6 L 32 16 L 16 16 L 16 32 Z" fill="#f1c40f"/>
  <!-- Góc trên - Phải -->
  <path d="M 250 32 L 250 18 A 12 12 0 0 0 238 6 L 224 6 L 224 16 L 240 16 L 240 32 Z" fill="#f1c40f"/>
  <!-- Góc dưới - Trái -->
  <path d="M 6 224 L 6 238 A 12 12 0 0 0 18 250 L 32 250 L 32 240 L 16 240 L 16 224 Z" fill="#f1c40f"/>
  <!-- Góc dưới - Phải -->
  <path d="M 250 224 L 250 238 A 12 12 0 0 1 238 250 L 224 250 L 224 240 L 240 240 L 240 224 Z" fill="#f1c40f"/>
</svg>
