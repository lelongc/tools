<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 80" width="320" height="80">
  <defs>
    <!-- Dải ruy băng chính màu vàng kim rực rỡ -->
    <linearGradient id="ribbonGold" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fff59d"/>
      <stop offset="25%" stop-color="#fbc02d"/>
      <stop offset="85%" stop-color="#f57f17"/>
      <stop offset="100%" stop-color="#e65100"/>
    </linearGradient>
    <!-- Mặt gập 3D phía sau (Đuôi nheo gập nếp) -->
    <linearGradient id="ribbonFold" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#b26a00"/>
      <stop offset="100%" stop-color="#663c00"/>
    </linearGradient>
    <linearGradient id="ribbonTail" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fbc02d"/>
      <stop offset="100%" stop-color="#d86e00"/>
    </linearGradient>
  </defs>

  <!-- Bóng đổ -->
  <path d="M 35 30 L 10 50 L 35 68 L 285 68 L 310 50 L 285 30 Z" fill="#000000" opacity="0.35"/>

  <!-- ĐUÔI RĂNG CƯA TRÁI (Left Swallowtail) -->
  <path d="M 50 18 L 8 18 L 28 40 L 8 62 L 50 62 Z" fill="url(#ribbonTail)" stroke="#663c00" stroke-width="2"/>
  <!-- Nếp gập tam giác trái (3D Fold shadow) -->
  <path d="M 45 48 L 45 68 L 60 52 Z" fill="url(#ribbonFold)"/>

  <!-- ĐUÔI RĂNG CƯA PHẢI (Right Swallowtail) -->
  <path d="M 270 18 L 312 18 L 292 40 L 312 62 L 270 62 Z" fill="url(#ribbonTail)" stroke="#663c00" stroke-width="2"/>
  <!-- Nếp gập tam giác phải (3D Fold shadow) -->
  <path d="M 275 48 L 275 68 L 260 52 Z" fill="url(#ribbonFold)"/>

  <!-- THÂN DẢI RUY BĂNG CHÍNH VÒM CONG 3D (Arched Center Banner) -->
  <path d="M 45 10 Q 160 5 275 10 L 275 52 Q 160 58 45 52 Z" fill="url(#ribbonGold)" stroke="#fff9c4" stroke-width="2.5"/>

  <!-- Đường viền chỉ vàng thêu trang trí 2 mép -->
  <path d="M 48 16 Q 160 11 272 16" fill="none" stroke="#fffde7" stroke-width="1.8" stroke-dasharray="6,4"/>
  <path d="M 48 46 Q 160 52 272 46" fill="none" stroke="#ffe082" stroke-width="1.8" stroke-dasharray="6,4"/>

  <!-- Vệt sáng phản chiếu Gloss mềm mại -->
  <path d="M 55 13 Q 160 9 265 13 C 270 13 270 18 262 20 Q 160 26 58 20 C 50 18 50 13 55 13 Z" fill="#ffffff" opacity="0.6"/>

  <!-- Hai ngôi sao mini đính góc ruy băng -->
  <circle cx="58" cy="31" r="3.5" fill="#ffffff" stroke="#e65100" stroke-width="1"/>
  <circle cx="262" cy="31" r="3.5" fill="#ffffff" stroke="#e65100" stroke-width="1"/>
</svg>
