<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 64" width="192" height="64">
  <defs>
    <!-- Thân gỗ sồi nâu ấm áp hoạt hình -->
    <linearGradient id="woodBase" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#d4924b"/>
      <stop offset="35%" stop-color="#b87333"/>
      <stop offset="85%" stop-color="#915222"/>
      <stop offset="100%" stop-color="#733d14"/>
    </linearGradient>
    <linearGradient id="woodGloss" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fed7aa" stop-opacity="0.85"/>
      <stop offset="45%" stop-color="#fed7aa" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#fed7aa" stop-opacity="0"/>
    </linearGradient>
    <!-- Đế gỗ tối màu 8px -->
    <linearGradient id="woodBevelBottom" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#542807"/>
      <stop offset="100%" stop-color="#331401"/>
    </linearGradient>
  </defs>

  <!-- Bóng đổ đáy -->
  <rect x="6" y="8" width="180" height="52" rx="16" fill="#000000" opacity="0.4"/>

  <!-- Khối đế gỗ 3D dày 8px -->
  <rect x="4" y="6" width="184" height="54" rx="16" fill="url(#woodBevelBottom)" stroke="#260e01" stroke-width="2"/>

  <!-- Mặt thanh gỗ nổi lên trên -->
  <rect x="4" y="4" width="184" height="48" rx="14" fill="url(#woodBase)" stroke="#fbbf24" stroke-width="1.8"/>

  <!-- Vân gỗ hoạt hình uốn lượn -->
  <path d="M 18 19 Q 70 15 125 21 T 174 18" fill="none" stroke="#78380d" stroke-width="2.2" stroke-linecap="round" opacity="0.6"/>
  <path d="M 22 34 Q 85 39 130 33 T 170 36" fill="none" stroke="#662f0b" stroke-width="1.8" stroke-linecap="round" opacity="0.55"/>

  <!-- Vệt sáng bóng phía trên -->
  <path d="M 18 8 Q 96 11 174 8 C 178 8 180 12 178 17 Q 96 24 14 17 C 12 12 14 8 18 8 Z" fill="url(#woodGloss)"/>

  <!-- Đinh ốc kim loại 4 góc cổ điển -->
  <circle cx="16" cy="14" r="3.2" fill="#e2e8f0" stroke="#334155" stroke-width="1.2"/>
  <circle cx="15.2" cy="13.2" r="1.2" fill="#ffffff"/>
  <circle cx="176" cy="14" r="3.2" fill="#e2e8f0" stroke="#334155" stroke-width="1.2"/>
  <circle cx="175.2" cy="13.2" r="1.2" fill="#ffffff"/>
  <circle cx="16" cy="42" r="3.2" fill="#cbd5e1" stroke="#1e293b" stroke-width="1.2"/>
  <circle cx="176" cy="42" r="3.2" fill="#cbd5e1" stroke="#1e293b" stroke-width="1.2"/>
</svg>
