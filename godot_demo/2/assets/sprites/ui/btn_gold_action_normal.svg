<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 64" width="192" height="64">
  <defs>
    <!-- Thân nút vàng hoàng kim hổ phách -->
    <linearGradient id="goldBase" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fff066"/>
      <stop offset="25%" stop-color="#ffcc00"/>
      <stop offset="80%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="goldGloss" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="45%" stop-color="#ffffff" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <!-- Đế 3D caramel chocolate 8px -->
    <linearGradient id="goldBevelBottom" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#92400e"/>
      <stop offset="100%" stop-color="#5a2203"/>
    </linearGradient>
  </defs>

  <!-- Bóng đổ đáy -->
  <rect x="6" y="8" width="180" height="52" rx="18" fill="#000000" opacity="0.35"/>

  <!-- Khối đế 3D dày 8px -->
  <rect x="4" y="6" width="184" height="54" rx="18" fill="url(#goldBevelBottom)" stroke="#451a03" stroke-width="2"/>

  <!-- Mặt nút nổi lên trên -->
  <rect x="4" y="4" width="184" height="48" rx="16" fill="url(#goldBase)" stroke="#fffbeb" stroke-width="1.8"/>

  <!-- Vệt sáng phản chiếu Gloss -->
  <path d="M 18 8 Q 96 12 174 8 C 178 8 180 12 178 18 Q 96 28 14 18 C 12 12 14 8 18 8 Z" fill="url(#goldGloss)"/>

  <!-- Sao/ngọc vàng góc trang trí -->
  <circle cx="16" cy="28" r="3.2" fill="#fffbeb" stroke="#b45309" stroke-width="1.2"/>
  <circle cx="15.2" cy="27.2" r="1.2" fill="#ffffff"/>
  <circle cx="176" cy="28" r="3.2" fill="#fffbeb" stroke="#b45309" stroke-width="1.2"/>
  <circle cx="175.2" cy="27.2" r="1.2" fill="#ffffff"/>
</svg>
