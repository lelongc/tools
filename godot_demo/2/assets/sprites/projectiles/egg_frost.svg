  <!-- Glowing Snowflake Emblem -->
  <g transform="translate(20, 26)" stroke="#ffffff" stroke-width="1.6" stroke-linecap="round">
    <line x1="-6" y1="0" x2="6" y2="0"/>
    <line x1="0" y1="-6" x2="0" y2="6"/>
    <line x1="-4" y1="-4" x2="4" y2="4"/>
    <line x1="-4" y1="4" x2="4" y2="-4"/>
