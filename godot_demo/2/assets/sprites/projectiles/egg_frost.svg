  <polygon points="20,4 28,16 12,18" fill="#ffffff" opacity="0.65"/>
  <polygon points="28,16 36,26 24,30 12,18" fill="#7dd3fc" opacity="0.45"/>
  <polygon points="4,30 14,36 12,18" fill="#e0f2fe" opacity="0.5"/>
