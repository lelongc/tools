<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 48" width="40" height="48">
  <defs>
    <linearGradient id="drillGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#cbd5e1"/>
      <stop offset="40%" stop-color="#64748b"/>
      <stop offset="80%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="fluteGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
  </defs>

  <!-- Egg Base Body -->
  <path d="M20 4 C10 4, 4 18, 4 30 C4 40, 11 45, 20 45 C29 45, 36 40, 36 30 C36 18, 30 4, 20 4 Z" 
        fill="url(#drillGrad)" stroke="#0f172a" stroke-width="2.2"/>

  <!-- Spiral Helical Drill Flutes (Thread Grooves) -->
  <path d="M6 22 Q20 16, 34 14" fill="none" stroke="#0f172a" stroke-width="3" stroke-linecap="round"/>
  <path d="M6 22 Q20 16, 34 14" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-linecap="round"/>

  <path d="M5 32 Q20 26, 35 24" fill="none" stroke="#0f172a" stroke-width="3.2" stroke-linecap="round"/>
  <path d="M5 32 Q20 26, 35 24" fill="none" stroke="#38bdf8" stroke-width="1.6" stroke-linecap="round"/>

  <path d="M8 40 Q20 37, 32 35" fill="none" stroke="#0f172a" stroke-width="3" stroke-linecap="round"/>
  <path d="M8 40 Q20 37, 32 35" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Sharp Tungsten Carbide Drill Tip (Bottom) -->
  <polygon points="14,42 26,42 20,48" fill="#e2e8f0" stroke="#0f172a" stroke-width="1.5"/>

  <!-- Specular Sheen -->
  <ellipse cx="14" cy="12" rx="3" ry="5" fill="#ffffff" opacity="0.75" transform="rotate(-20 14 12)"/>
</svg>
