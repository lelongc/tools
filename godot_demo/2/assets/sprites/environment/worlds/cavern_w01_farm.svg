  <!-- Hanging Lantern / Sconce Glow on Middle Wall -->
  <circle cx="270" cy="280" r="60" fill="#ffa733" opacity="0.12"/>
  <circle cx="270" cy="280" r="28" fill="#ffd166" opacity="0.25"/>
