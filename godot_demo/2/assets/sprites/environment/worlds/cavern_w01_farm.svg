    <rect x="95" y="295" width="140" height="42" rx="4"/>
    <rect x="245" y="295" width="130" height="42" rx="4"/>
    <rect x="385" y="295" width="145" height="42" rx="4"/>

    <rect x="15" y="345" width="120" height="42" rx="4"/>
