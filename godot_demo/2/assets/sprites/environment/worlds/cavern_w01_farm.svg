  <!-- Giant Organic Tree Roots Crawling Down -->
  <g fill="none" stroke="#4a301e" stroke-linecap="round" opacity="0.75">
    <path d="M70,0 C65,60 110,130 90,210 C75,270 40,320 60,400 C75,460 120,530 100,620" stroke-width="12"/>
    <path d="M100,210 C140,250 160,310 150,370 C140,430 180,480 170,550" stroke-width="6"/>
