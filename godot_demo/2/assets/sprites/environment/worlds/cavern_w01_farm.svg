<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 700" width="540" height="700">
  <defs>
    <linearGradient id="farmCavBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#281a12"/>
      <stop offset="50%" stop-color="#1c110a"/>
      <stop offset="100%" stop-color="#120a06"/>
