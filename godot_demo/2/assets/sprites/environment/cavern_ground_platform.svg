<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 60" width="540" height="60">
  <defs>
    <!-- Bedrock stratum gradient -->
    <linearGradient id="groundBedrock" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="25%" stop-color="#334155"/>
      <stop offset="70%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <!-- Top chiseled stone ledge -->
    <linearGradient id="ledgeHighlight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#64748b"/>
    </linearGradient>
  </defs>

  <!-- Base Bedrock Shelf with Heavy Dark Contour -->
  <rect x="0" y="8" width="540" height="52" fill="url(#groundBedrock)"/>

  <!-- Top Chiseled Pavement Slabs -->
  <path d="M0 8 H540 V16 H0 Z" fill="url(#ledgeHighlight)"/>
  <line x1="0" y1="8" x2="540" y2="8" stroke="#cbd5e1" stroke-width="2.5"/>
  <line x1="0" y1="16" x2="540" y2="16" stroke="#0f172a" stroke-width="2"/>

  <!-- Chiseled Slab Vertical Grooves (Tiling every ~60-80px) -->
  <line x1="68" y1="8" x2="68" y2="16" stroke="#0f172a" stroke-width="2"/>
  <line x1="142" y1="8" x2="142" y2="16" stroke="#0f172a" stroke-width="2"/>
  <line x1="216" y1="8" x2="216" y2="16" stroke="#0f172a" stroke-width="2"/>
  <line x1="290" y1="8" x2="290" y2="16" stroke="#0f172a" stroke-width="2"/>
  <line x1="364" y1="8" x2="364" y2="16" stroke="#0f172a" stroke-width="2"/>
  <line x1="438" y1="8" x2="438" y2="16" stroke="#0f172a" stroke-width="2"/>
  <line x1="512" y1="8" x2="512" y2="16" stroke="#0f172a" stroke-width="2"/>

  <!-- Geological Strata Fault Lines in Bedrock -->
  <path d="M0 28 Q80 24, 160 30 T320 26 T480 32 L540 28" fill="none" stroke="#0f172a" stroke-width="2.5"/>
  <path d="M0 29 Q80 25, 160 31 T320 27 T480 33 L540 29" fill="none" stroke="#64748b" stroke-width="1" opacity="0.5"/>

  <path d="M0 44 Q120 48, 240 42 T460 46 L540 43" fill="none" stroke="#0a0f1d" stroke-width="3"/>

  <!-- Embedded Cobblestones & Mineral Deposits -->
  <ellipse cx="45" cy="36" rx="14" ry="6" fill="#1e293b" stroke="#0f172a" stroke-width="1.5"/>
  <ellipse cx="120" cy="46" rx="18" ry="7" fill="#1e293b" stroke="#0f172a" stroke-width="1.5"/>
  <ellipse cx="250" cy="35" rx="16" ry="6" fill="#334155" stroke="#0f172a" stroke-width="1.5"/>
  <ellipse cx="380" cy="45" rx="20" ry="7" fill="#1e293b" stroke="#0f172a" stroke-width="1.5"/>
  <ellipse cx="475" cy="36" rx="15" ry="6" fill="#334155" stroke="#0f172a" stroke-width="1.5"/>

  <!-- Cartoon Moss Tufts along Edge -->
  <path d="M22 8 Q26 2, 30 8 Q34 3, 38 8 Z" fill="#65a30d" stroke="#365314" stroke-width="1.2"/>
  <path d="M185 8 Q190 1, 195 8 Q200 2, 205 8 Z" fill="#65a30d" stroke="#365314" stroke-width="1.2"/>
  <path d="M330 8 Q335 3, 340 8 Q345 1, 350 8 Z" fill="#65a30d" stroke="#365314" stroke-width="1.2"/>
  <path d="M460 8 Q465 2, 470 8 Q475 3, 480 8 Z" fill="#65a30d" stroke="#365314" stroke-width="1.2"/>
</svg>
