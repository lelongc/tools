<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 400" width="540" height="400">
  <defs>
    <!-- Sky Atmosphere Gradient -->
    <linearGradient id="skyAtmosphere" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="45%" stop-color="#38bdf8"/>
      <stop offset="85%" stop-color="#7dd3fc"/>
      <stop offset="100%" stop-color="#bae6fd"/>
    </linearGradient>

    <!-- Cloud Volume Gradient -->
    <linearGradient id="cloudGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="70%" stop-color="#f0f9ff"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>

    <!-- Distant Mountain Gradient -->
    <linearGradient id="mountGradFar" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.1"/>
    </linearGradient>

    <linearGradient id="mountGradMid" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4ade80" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#22c55e" stop-opacity="0.9"/>
    </linearGradient>
  </defs>

  <!-- Sky Canvas -->
  <rect width="540" height="400" fill="url(#skyAtmosphere)"/>

  <!-- Distant Blue Alpine Peaks -->
  <polygon points="40,240 130,120 220,240" fill="url(#mountGradFar)"/>
  <polygon points="100,160 130,120 160,160 145,150 130,165 115,150" fill="#ffffff" opacity="0.85"/>

  <polygon points="180,240 290,90 400,240" fill="url(#mountGradFar)"/>
  <polygon points="250,140 290,90 330,140 310,130 290,145 270,130" fill="#ffffff" opacity="0.85"/>

  <polygon points="350,240 440,130 530,240" fill="url(#mountGradFar)"/>
  <polygon points="410,170 440,130 470,170 455,160 440,175 425,160" fill="#ffffff" opacity="0.85"/>

  <!-- Midground Rolling Green Foothills -->
  <path d="M-20 260 Q80 200, 200 240 T420 230 T560 250 L560 400 L-20 400 Z" fill="#86efac" opacity="0.7"/>
  <path d="M-20 290 Q120 240, 280 280 T560 270 L560 400 L-20 400 Z" fill="url(#mountGradMid)"/>

  <!-- Fluffy Cartoon Clouds Layer -->
  <!-- Cloud 1 (Left High) -->
  <g transform="translate(60, 60)" fill="url(#cloudGrad)">
    <circle cx="20" cy="20" r="18"/>
    <circle cx="42" cy="14" r="22"/>
    <circle cx="68" cy="18" r="18"/>
    <rect x="18" y="18" width="52" height="18" rx="8"/>
  </g>

  <!-- Cloud 2 (Center Big) -->
  <g transform="translate(230, 45)" fill="url(#cloudGrad)">
    <circle cx="24" cy="22" r="20"/>
    <circle cx="52" cy="12" r="26"/>
    <circle cx="82" cy="18" r="22"/>
    <circle cx="106" cy="24" r="16"/>
    <rect x="20" y="20" width="88" height="20" rx="9"/>
  </g>

  <!-- Cloud 3 (Right) -->
  <g transform="translate(420, 80)" fill="url(#cloudGrad)">
    <circle cx="18" cy="18" r="16"/>
    <circle cx="38" cy="12" r="20"/>
    <circle cx="60" cy="16" r="16"/>
    <rect x="16" y="16" width="46" height="16" rx="7"/>
  </g>
</svg>
