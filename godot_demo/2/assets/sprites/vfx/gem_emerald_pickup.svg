<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <defs>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4ade80"/>
      <stop offset="35%" stop-color="#22c55e"/>
      <stop offset="70%" stop-color="#16a34a"/>
      <stop offset="100%" stop-color="#14532d"/>
    </linearGradient>
  </defs>

  <!-- Ambient Emerald Glow -->
  <circle cx="24" cy="24" r="20" fill="#22c55e" opacity="0.25"/>

  <!-- Emerald Cut Octagon with Dark Contour -->
  <polygon points="14,6 34,6 42,14 42,34 34,42 14,42 6,34 6,14" fill="url(#emeraldGrad)" stroke="#052e16" stroke-width="2.5" stroke-linejoin="round"/>

  <!-- Top Table Facet -->
  <polygon points="18,12 30,12 36,18 36,30 30,36 18,36 12,30 12,18" fill="#bbf7d0" opacity="0.75" stroke="#15803d" stroke-width="1.2"/>

  <!-- Corner Bevel Facets -->
  <polygon points="14,6 18,12 12,18 6,14" fill="#86efac" opacity="0.9"/>
  <polygon points="34,6 30,12 36,18 42,14" fill="#16a34a" opacity="0.8"/>
  <polygon points="6,34 12,30 18,36 14,42" fill="#15803d" opacity="0.8"/>
  <polygon points="42,34 36,30 30,36 34,42" fill="#052e16" opacity="0.7"/>

  <!-- Center Table Crystal Glint -->
  <polygon points="18,12 30,12 24,24 14,24" fill="#ffffff" opacity="0.45"/>

  <!-- Sparkle Star -->
  <polygon points="16,10 17,6 18,10 22,10 19,12 20,16 17,13 14,16 15,12 11,10" fill="#ffffff"/>
  <polygon points="32,24 33,21 34,24 37,24 35,25 36,28 33,26 31,28 32,25 29,24" fill="#ffffff" opacity="0.8"/>
</svg>
