<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <!-- Gradient tia sao nổ rực rỡ phong cách truyện tranh -->
    <radialGradient id="starburstCore" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="25%" stop-color="#fef08a"/>
      <stop offset="60%" stop-color="#f59e0b"/>
      <stop offset="90%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#b45309"/>
    </radialGradient>
    <radialGradient id="sparkDotGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Viền dày truyện tranh hoạt hình sẫm màu (Dark Outline) -->
  <polygon points="128,4 148,84 216,36 174,104 252,128 174,152 216,220 148,172 128,252 108,172 40,220 82,152 4,128 82,104 40,36 108,84"
           fill="#78350f" stroke="#451a03" stroke-width="6" stroke-linejoin="round"/>

  <!-- Thân sao nổ vàng kim rạng rỡ (Radiant Golden Core) -->
  <polygon points="128,14 145,88 206,46 168,107 240,128 168,149 206,210 145,168 128,242 111,168 50,210 88,149 16,128 88,107 50,46 111,88"
           fill="url(#starburstCore)"/>

  <!-- Tia nhụy sáng 4 cánh bên trong (Inner 4-point Diamond Core) -->
  <polygon points="128,48 142,114 208,128 142,142 128,208 114,142 48,128 114,114"
           fill="#ffffff" opacity="0.95"/>

  <!-- Các đốm tia lửa phụ bay xung quanh tâm -->
  <circle cx="56" cy="72" r="6" fill="url(#sparkDotGlow)"/>
  <circle cx="200" cy="72" r="6" fill="url(#sparkDotGlow)"/>
  <circle cx="200" cy="184" r="6" fill="url(#sparkDotGlow)"/>
  <circle cx="56" cy="184" r="6" fill="url(#sparkDotGlow)"/>
  <circle cx="128" cy="128" r="22" fill="#ffffff"/>
</svg>
