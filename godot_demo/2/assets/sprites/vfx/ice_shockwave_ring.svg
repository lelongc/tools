<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96">
  <defs>
    <radialGradient id="iceHalo" cx="50%" cy="50%" r="50%">
      <stop offset="60%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="85%" stop-color="#bae6fd" stop-opacity="0.8"/>
      <stop offset="95%" stop-color="#38bdf8" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Ice Halo -->
  <circle cx="48" cy="48" r="44" fill="url(#iceHalo)"/>

  <!-- Radiating Ice Crystals / Frost Spikes -->
  <g fill="#ffffff" stroke="#38bdf8" stroke-width="1.2">
    <!-- 8 Major Points -->
    <polygon points="48,4 52,20 44,20"/>
    <polygon points="48,92 52,76 44,76"/>
    <polygon points="4,48 20,44 20,52"/>
    <polygon points="92,48 76,44 76,52"/>

    <polygon points="17,17 32,26 26,32"/>
    <polygon points="79,79 64,70 70,64"/>
    <polygon points="79,17 64,26 70,32"/>
    <polygon points="17,79 32,70 26,64"/>
  </g>

  <!-- Fine Frost Spikes -->
  <circle cx="48" cy="48" r="36" fill="none" stroke="#e0f2fe" stroke-width="2" stroke-dasharray="6,4"/>
</svg>
