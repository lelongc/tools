<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 128" width="32" height="128">
  <defs>
    <!-- Crystal Glass Gradient -->
    <linearGradient id="glassPillarGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#bae6fd" stop-opacity="0.85"/>
      <stop offset="35%" stop-color="#7dd3fc" stop-opacity="0.75"/>
      <stop offset="70%" stop-color="#38bdf8" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.9"/>
    </linearGradient>

    <linearGradient id="glassPillarShine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="40%" stop-color="#ffffff" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Main Glass Column Body -->
  <rect x="2" y="2" width="28" height="124" rx="3" fill="url(#glassPillarGrad)" stroke="#0284c7" stroke-width="2"/>

  <!-- Frosted Inner Inset -->
  <rect x="4" y="4" width="24" height="120" rx="2" fill="none" stroke="#e0f2fe" stroke-width="1.2" opacity="0.8"/>

  <!-- Vertical Specular Light Gleam -->
  <rect x="6" y="6" width="5" height="116" rx="2" fill="url(#glassPillarShine)"/>
  <rect x="13" y="14" width="2" height="100" rx="1" fill="#ffffff" opacity="0.5"/>

  <!-- Crystal Facet Diagonal Cuts -->
  <line x1="16" y1="25" x2="26" y2="45" stroke="#ffffff" stroke-width="1.2" stroke-dasharray="6 3" opacity="0.6"/>
  <line x1="8" y1="80" x2="22" y2="105" stroke="#ffffff" stroke-width="1.2" stroke-dasharray="6 3" opacity="0.6"/>

  <!-- Subtle Corner Clips -->
  <polygon points="2,2 8,2 2,8" fill="#e0f2fe"/>
  <polygon points="30,2 24,2 30,8" fill="#e0f2fe"/>
  <polygon points="2,126 8,126 2,120" fill="#bae6fd"/>
  <polygon points="30,126 24,126 30,120" fill="#bae6fd"/>
</svg>
