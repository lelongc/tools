<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 64" width="128" height="64">
  <defs>
    <!-- Prismatic crystal cyan-magenta gradient -->
    <linearGradient id="crystalGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="35%" stop-color="#818cf8"/>
      <stop offset="70%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>

    <linearGradient id="facetHighlight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.1"/>
    </linearGradient>

    <linearGradient id="facetShadow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4c1d95" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#1e1b4b" stop-opacity="0.8"/>
    </linearGradient>
  </defs>

  <!-- Base Crystal Body with Deep Indigo Border -->
  <rect x="2" y="2" width="124" height="60" rx="6" fill="url(#crystalGrad)" stroke="#1e1b4b" stroke-width="3"/>

  <!-- Top Glass Highlight Strip -->
  <path d="M4 5 H124 L118 12 H10 Z" fill="url(#facetHighlight)"/>
  <path d="M10 52 H118 L124 59 H4 Z" fill="url(#facetShadow)"/>

  <!-- Faceted Crystal Prism Geometric Cuts -->
  <!-- Facet 1 (Left) -->
  <polygon points="4,5 34,16 28,48 4,59" fill="#0284c7" opacity="0.4"/>
  <polygon points="4,5 34,16 18,5" fill="#e0f2fe" opacity="0.6"/>

  <!-- Facet 2 (Center Diamond Structure) -->
  <polygon points="34,16 64,8 94,16 64,24" fill="#ffffff" opacity="0.5"/>
  <polygon points="34,16 64,24 64,48 28,48" fill="#6366f1" opacity="0.35"/>
  <polygon points="64,24 94,16 100,48 64,48" fill="#9333ea" opacity="0.45"/>
  <polygon points="64,48 94,16 124,32 100,48" fill="#4338ca" opacity="0.3"/>

  <!-- Facet 3 (Right) -->
  <polygon points="94,16 124,5 124,59 100,48" fill="#7e22ce" opacity="0.45"/>
  <polygon points="94,16 124,5 110,5" fill="#f5d0fe" opacity="0.55"/>

  <!-- Crisp Internal Prism Refraction Seams -->
  <line x1="34" y1="16" x2="64" y2="24" stroke="#ffffff" stroke-width="1.8" opacity="0.9"/>
  <line x1="64" y1="24" x2="94" y2="16" stroke="#ffffff" stroke-width="1.8" opacity="0.9"/>
  <line x1="64" y1="24" x2="64" y2="48" stroke="#ffffff" stroke-width="1.5" opacity="0.8"/>
  <line x1="28" y1="48" x2="64" y2="48" stroke="#ffffff" stroke-width="1.5" opacity="0.8"/>
  <line x1="64" y1="48" x2="100" y2="48" stroke="#ffffff" stroke-width="1.5" opacity="0.8"/>

  <!-- Diamond Sparkle Stars -->
  <polygon points="64,8 65,4 66,8 70,8 67,10 68,14 65,11 62,14 63,10 60,8" fill="#ffffff"/>
  <polygon points="20,24 21,21 22,24 25,24 23,25 24,28 21,26 19,28 20,25 17,24" fill="#ffffff" opacity="0.9"/>
  <polygon points="108,30 109,27 110,30 113,30 111,31 112,34 109,32 107,34 108,31 105,30" fill="#ffffff" opacity="0.9"/>
</svg>
