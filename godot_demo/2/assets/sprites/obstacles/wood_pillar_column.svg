<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 128" width="32" height="128">
  <defs>
    <!-- Vertical Timber Gradient -->
    <linearGradient id="timberBody" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#9a4714"/>
      <stop offset="30%" stop-color="#d97706"/>
      <stop offset="70%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>
    <!-- Beveled Edge Lighting -->
    <linearGradient id="timberEnd" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#b45309" stop-opacity="0.1"/>
    </linearGradient>
  </defs>

  <!-- Main Wooden Pillar Body -->
  <rect x="2" y="2" width="28" height="124" rx="4" fill="url(#timberBody)" stroke="#451a03" stroke-width="2.5"/>

  <!-- Top Wooden Joint Bevel -->
  <path d="M4 4 H28 L25 8 H7 Z" fill="url(#timberEnd)"/>
  <!-- Bottom Wooden Joint Shadow -->
  <path d="M4 124 H28 L25 120 H7 Z" fill="#451a03" opacity="0.6"/>

  <!-- Vertical Wood Grain Lines (Organic & Stylized) -->
  <path d="M8 10 Q6 45, 9 80 T7 118" fill="none" stroke="#78350f" stroke-width="1.8" stroke-linecap="round" opacity="0.75"/>
  <path d="M15 6 Q17 50, 14 90 T16 122" fill="none" stroke="#92400e" stroke-width="1.6" stroke-linecap="round" opacity="0.65"/>
  <path d="M22 12 Q24 40, 21 75 T23 116" fill="none" stroke="#78350f" stroke-width="1.8" stroke-linecap="round" opacity="0.75"/>

  <!-- Natural Wood Knot -->
  <ellipse cx="15" cy="56" rx="3.5" ry="6" fill="none" stroke="#78350f" stroke-width="1.4" opacity="0.7"/>
  <ellipse cx="15" cy="56" rx="1.5" ry="2.5" fill="#451a03" opacity="0.85"/>

  <!-- Subtle Wooden Peg Joints at Ends (Natural, No Giant Metal Caps!) -->
  <circle cx="9" cy="7" r="1.8" fill="#fef08a" stroke="#451a03" stroke-width="0.8"/>
  <circle cx="23" cy="7" r="1.8" fill="#fef08a" stroke="#451a03" stroke-width="0.8"/>
  <circle cx="9" cy="121" r="1.8" fill="#fef08a" stroke="#451a03" stroke-width="0.8"/>
  <circle cx="23" cy="121" r="1.8" fill="#fef08a" stroke="#451a03" stroke-width="0.8"/>
</svg>
