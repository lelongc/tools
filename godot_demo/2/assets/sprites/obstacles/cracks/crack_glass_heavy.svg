  <line x1="64" y1="30" x2="4" y2="60" stroke="#ffffff" stroke-width="2.2"/>
  <line x1="64" y1="30" x2="124" y2="4" stroke="#ffffff" stroke-width="2.2"/>
  <line x1="64" y1="30" x2="124" y2="60" stroke="#ffffff" stroke-width="2.2"/>
  <line x1="64" y1="30" x2="64" y2="2" stroke="#ffffff" stroke-width="2.2"/>
  <line x1="64" y1="30" x2="64" y2="62" stroke="#ffffff" stroke-width="2.2"/>

  <!-- Dark refraction depth lines -->
  <line x1="65" y1="31" x2="5" y2="5" stroke="#0e7490" stroke-width="1.0" opacity="0.6"/>
  <line x1="65" y1="31" x2="125" y2="5" stroke="#0e7490" stroke-width="1.0" opacity="0.6"/>
</svg>
