  <polygon points="64,10 92,20 86,50 46,48 38,20" fill="none" stroke="#ffffff" stroke-width="1.8" opacity="0.8"/>
  <polygon points="64,4 112,14 104,58 24,56 16,16" fill="none" stroke="#ffffff" stroke-width="1.6" opacity="0.7"/>

  <!-- Radial spokes to edges -->
