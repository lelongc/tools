<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 32" width="96" height="32">
  <defs>
    <!-- Steel casing gradient -->
    <linearGradient id="grateSteel" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#94a3b8"/>
      <stop offset="35%" stop-color="#475569"/>
      <stop offset="85%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Glowing wind core from underneath -->
    <linearGradient id="turbineGlow" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="60%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#e0f2fe"/>
    </linearGradient>

    <!-- Hazard pattern -->
    <pattern id="hazardStripes" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="6" height="12" fill="#eab308"/>
      <rect x="6" width="6" height="12" fill="#1e293b"/>
    </pattern>
  </defs>

  <!-- Heavy Outer Iron Frame with Dark Contour -->
  <polygon points="2,8 6,2 90,2 94,8 90,30 6,30" fill="url(#grateSteel)" stroke="#0f172a" stroke-width="3" stroke-linejoin="round"/>

  <!-- Top Bevel Highlight -->
  <polygon points="7,3 89,3 86,7 10,7" fill="#cbd5e1" opacity="0.8"/>

  <!-- Hazard Stripes Trim along Bottom Edge -->
  <rect x="8" y="24" width="80" height="5" fill="url(#hazardStripes)" stroke="#0f172a" stroke-width="1"/>

  <!-- Deep Exhaust Pit (Internal cavity) -->
  <rect x="10" y="8" width="76" height="14" rx="2" fill="#090d16" stroke="#0f172a" stroke-width="1.5"/>

  <!-- Internal Glowing Turbine Light -->
  <ellipse cx="48" cy="15" rx="34" ry="5" fill="url(#turbineGlow)" opacity="0.85"/>

  <!-- 3D Slanted Ventilation Grille Slats -->
  <!-- Slat 1 -->
  <polygon points="12,9 18,9 16,21 10,21" fill="#64748b" stroke="#1e293b" stroke-width="1"/>
  <line x1="12" y1="9" x2="10" y2="21" stroke="#f1f5f9" stroke-width="0.8"/>
  <!-- Slat 2 -->
  <polygon points="21,9 27,9 25,21 19,21" fill="#64748b" stroke="#1e293b" stroke-width="1"/>
  <line x1="21" y1="9" x2="19" y2="21" stroke="#f1f5f9" stroke-width="0.8"/>
  <!-- Slat 3 -->
  <polygon points="30,9 36,9 34,21 28,21" fill="#64748b" stroke="#1e293b" stroke-width="1"/>
  <line x1="30" y1="9" x2="28" y2="21" stroke="#f1f5f9" stroke-width="0.8"/>
  <!-- Slat 4 (Center-Left) -->
  <polygon points="39,9 45,9 43,21 37,21" fill="#94a3b8" stroke="#1e293b" stroke-width="1"/>
  <line x1="39" y1="9" x2="37" y2="21" stroke="#ffffff" stroke-width="1"/>
  <!-- Slat 5 (Center-Right) -->
  <polygon points="48,9 54,9 52,21 46,21" fill="#94a3b8" stroke="#1e293b" stroke-width="1"/>
  <line x1="48" y1="9" x2="46" y2="21" stroke="#ffffff" stroke-width="1"/>
  <!-- Slat 6 -->
  <polygon points="57,9 63,9 61,21 55,21" fill="#64748b" stroke="#1e293b" stroke-width="1"/>
  <line x1="57" y1="9" x2="55" y2="21" stroke="#f1f5f9" stroke-width="0.8"/>
  <!-- Slat 7 -->
  <polygon points="66,9 72,9 70,21 64,21" fill="#64748b" stroke="#1e293b" stroke-width="1"/>
  <line x1="66" y1="9" x2="64" y2="21" stroke="#f1f5f9" stroke-width="0.8"/>
  <!-- Slat 8 -->
  <polygon points="75,9 81,9 79,21 73,21" fill="#64748b" stroke="#1e293b" stroke-width="1"/>
  <line x1="75" y1="9" x2="73" y2="21" stroke="#f1f5f9" stroke-width="0.8"/>

  <!-- Heavy Side Mount Bolts -->
  <circle cx="5" cy="16" r="3" fill="#cbd5e1" stroke="#0f172a" stroke-width="1.2"/>
  <line x1="3" y1="16" x2="7" y2="16" stroke="#0f172a" stroke-width="1"/>
  <circle cx="91" cy="16" r="3" fill="#cbd5e1" stroke="#0f172a" stroke-width="1.2"/>
  <line x1="89" y1="16" x2="93" y2="16" stroke="#0f172a" stroke-width="1"/>
</svg>
