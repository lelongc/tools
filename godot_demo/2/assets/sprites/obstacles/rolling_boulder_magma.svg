<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Black basalt with fiery glow -->
    <radialGradient id="magmaGrad" cx="40%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#451a03"/>
      <stop offset="35%" stop-color="#260e03"/>
      <stop offset="75%" stop-color="#180702"/>
      <stop offset="100%" stop-color="#0a0201"/>
    </radialGradient>
    <linearGradient id="lavaVein" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="40%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#dc2626"/>
    </linearGradient>
  </defs>

  <!-- Craggy Magma Silhouette with Dark Basalt Contour -->
  <polygon points="20,4 44,5 58,18 61,42 46,59 22,60 6,48 3,24" 
           fill="url(#magmaGrad)" stroke="#0a0201" stroke-width="3" stroke-linejoin="round"/>

  <!-- Basalt Chiseled Crust Facets -->
  <polygon points="20,4 44,5 36,18 16,16" fill="#78350f" opacity="0.4"/>
  <polygon points="44,5 58,18 48,32 36,18" fill="#451a03" opacity="0.5"/>
  <polygon points="22,60 46,59 40,46 18,48" fill="#030101" opacity="0.7"/>

  <!-- Glowing Molten Lava Fissures (Deep interior glow) -->
  <path d="M16 16 L28 28 L42 26 L48 40" 
        fill="none" stroke="url(#lavaVein)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"
        style="filter: drop-shadow(0px 0px 3px #ea580c);"/>
  <path d="M28 28 L22 42 L18 48" 
        fill="none" stroke="url(#lavaVein)" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"
        style="filter: drop-shadow(0px 0px 2px #ea580c);"/>
  <path d="M42 26 L52 20 M28 28 L38 34" 
        fill="none" stroke="url(#lavaVein)" stroke-width="2.2" stroke-linecap="round"/>

  <!-- Intense White-Hot Core Fissure Centers -->
  <path d="M20 20 L28 28 L40 26" fill="none" stroke="#fffbeb" stroke-width="1.2" stroke-linecap="round"/>
  <circle cx="28" cy="28" r="2" fill="#ffffff"/>
  <circle cx="42" cy="26" r="1.8" fill="#ffffff"/>

  <!-- Floating Flying Sparks & Embers -->
  <circle cx="12" cy="18" r="1.5" fill="#facc15" opacity="0.9"/>
  <circle cx="52" cy="38" r="1.2" fill="#f97316" opacity="0.85"/>
  <circle cx="34" cy="12" r="1.8" fill="#facc15" opacity="0.9"/>
  <circle cx="48" cy="50" r="1.5" fill="#ef4444" opacity="0.8"/>
</svg>
