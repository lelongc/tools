<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 64" width="48" height="64">
  <defs>
    <linearGradient id="drumYellow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ca8a04"/>
      <stop offset="30%" stop-color="#eab308"/>
      <stop offset="70%" stop-color="#fde047"/>
      <stop offset="100%" stop-color="#a16207"/>
    </linearGradient>
    <linearGradient id="ribGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#854d0e"/>
      <stop offset="50%" stop-color="#fef08a"/>
      <stop offset="100%" stop-color="#713f12"/>
    </linearGradient>
  </defs>

  <!-- Drum Body -->
  <rect x="6" y="8" width="36" height="52" rx="4" fill="url(#drumYellow)" stroke="#422006" stroke-width="2.5"/>

  <!-- Ribbed Steel Rings -->
  <rect x="5" y="16" width="38" height="5" rx="2" fill="url(#ribGrad)" stroke="#422006" stroke-width="1.2"/>
  <rect x="5" y="45" width="38" height="5" rx="2" fill="url(#ribGrad)" stroke="#422006" stroke-width="1.2"/>

  <!-- Diagonal Warning Hazard Stripes (Middle plate) -->
  <rect x="8" y="25" width="32" height="16" rx="2" fill="#0f172a" stroke="#0f172a" stroke-width="1.5"/>

  <!-- Radiation Symbol (Trefoil ☢️) -->
  <g transform="translate(24, 33)">
    <!-- Center Dot -->
    <circle cx="0" cy="0" r="2.2" fill="#eab308"/>
    <!-- 3 Blades -->
    <path d="M-1.5 -3.5 A5 5 0 0 1 1.5 -3.5 L3 -6.5 A8 8 0 0 0 -3 -6.5 Z" fill="#eab308"/>
    <path d="M2.5 1.5 A5 5 0 0 1 1 3 L3.5 5.5 A8 8 0 0 0 6.5 2 Z" fill="#eab308"/>
    <path d="M-2.5 1.5 A5 5 0 0 0 -1 3 L-3.5 5.5 A8 8 0 0 1 -6.5 2 Z" fill="#eab308"/>
  </g>

  <!-- Glowing Toxic Neon Green Sludge Drip -->
  <path d="M8 8 C11 8, 12 13, 14 13 C16 13, 17 9, 20 9 C22 9, 23 16, 25 16 C27 16, 28 8, 30 8" 
        fill="#22c55e" stroke="#15803d" stroke-width="1"/>
  <circle cx="14" cy="15" r="1.5" fill="#4ade80"/>
  <circle cx="25" cy="18.5" r="2" fill="#4ade80"/>
  <path d="M25 18.5 L24 22" stroke="#22c55e" stroke-width="1.5" stroke-linecap="round"/>
  <circle cx="24" cy="23" r="1.2" fill="#86efac"/>
</svg>
