<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 64" width="128" height="64">
  <defs>
    <linearGradient id="steelGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#64748b"/>
      <stop offset="25%" stop-color="#94a3b8"/>
      <stop offset="70%" stop-color="#475569"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
    <linearGradient id="innerBeamGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="50%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>

  <!-- Outer Flange Body -->
  <rect x="2" y="2" width="124" height="60" rx="4" fill="url(#steelGrad)" stroke="#0f172a" stroke-width="3"/>

  <!-- Top & Bottom Metallic Bevel Sheen -->
  <line x1="4" y1="4" x2="124" y2="4" stroke="#cbd5e1" stroke-width="2"/>
  <line x1="4" y1="60" x2="124" y2="60" stroke="#0f172a" stroke-width="2"/>

  <!-- Recessed Inner Web (I-Beam look) -->
  <rect x="16" y="14" width="96" height="36" rx="2" fill="url(#innerBeamGrad)" stroke="#1e293b" stroke-width="2"/>

  <!-- Warning Striping / Hazard Hatching on Web -->
  <path d="M24 14 L16 26 M36 14 L24 32 M48 14 L36 38 M60 14 L48 44 M72 14 L60 50 M84 14 L72 50 M96 14 L84 50 M108 14 L96 50 M112 26 L104 50 M112 40 L108 50" 
        stroke="#475569" stroke-width="1.8" opacity="0.4"/>

  <!-- Industrial Hex Bolts / Rivets -->
  <!-- Left Column -->
  <circle cx="8" cy="12" r="3.2" fill="#cbd5e1" stroke="#0f172a" stroke-width="1.2"/>
  <circle cx="8" cy="32" r="3.2" fill="#cbd5e1" stroke="#0f172a" stroke-width="1.2"/>
  <circle cx="8" cy="52" r="3.2" fill="#94a3b8" stroke="#0f172a" stroke-width="1.2"/>
  <!-- Right Column -->
  <circle cx="120" cy="12" r="3.2" fill="#cbd5e1" stroke="#0f172a" stroke-width="1.2"/>
  <circle cx="120" cy="32" r="3.2" fill="#cbd5e1" stroke="#0f172a" stroke-width="1.2"/>
  <circle cx="120" cy="52" r="3.2" fill="#94a3b8" stroke="#0f172a" stroke-width="1.2"/>
</svg>
