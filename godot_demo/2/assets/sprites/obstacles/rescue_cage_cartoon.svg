<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 72" width="64" height="72">
  <defs>
    <linearGradient id="ironBars" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#94a3b8"/>
      <stop offset="35%" stop-color="#475569"/>
      <stop offset="70%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="cageBase" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#78350f"/>
      <stop offset="50%" stop-color="#92400e"/>
      <stop offset="100%" stop-color="#451a03"/>
    </linearGradient>
    <radialGradient id="brassLock" cx="40%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="60%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#a16207"/>
    </radialGradient>
  </defs>

  <!-- Hanging Chain & Ring (Top) -->
  <circle cx="32" cy="6" r="4.5" fill="none" stroke="#475569" stroke-width="2.5"/>
  <line x1="32" y1="10" x2="32" y2="16" stroke="#334155" stroke-width="3"/>

  <!-- Arched Dome Roof -->
  <path d="M10 24 C10 12, 54 12, 54 24 Z" fill="url(#ironBars)" stroke="#0f172a" stroke-width="2.2"/>

  <!-- Wooden Perch/Base Floor -->
  <rect x="6" y="60" width="52" height="9" rx="3" fill="url(#cageBase)" stroke="#0f172a" stroke-width="2"/>

  <!-- Vertical Steel Bars -->
  <rect x="12" y="22" width="4.5" height="40" rx="2" fill="url(#ironBars)" stroke="#0f172a" stroke-width="1.2"/>
  <rect x="22" y="20" width="4.5" height="42" rx="2" fill="url(#ironBars)" stroke="#0f172a" stroke-width="1.2"/>
  <rect x="37.5" y="20" width="4.5" height="42" rx="2" fill="url(#ironBars)" stroke="#0f172a" stroke-width="1.2"/>
  <rect x="47.5" y="22" width="4.5" height="40" rx="2" fill="url(#ironBars)" stroke="#0f172a" stroke-width="1.2"/>

  <!-- Center Horizontal Reinforcement Bar -->
  <rect x="8" y="39" width="48" height="5" rx="2" fill="url(#ironBars)" stroke="#0f172a" stroke-width="1.5"/>

  <!-- Steel Rivets -->
  <circle cx="14.2" cy="41.5" r="1.2" fill="#cbd5e1"/>
  <circle cx="24.2" cy="41.5" r="1.2" fill="#cbd5e1"/>
  <circle cx="39.7" cy="41.5" r="1.2" fill="#cbd5e1"/>
  <circle cx="49.7" cy="41.5" r="1.2" fill="#cbd5e1"/>

  <!-- Brass Padlock in Center -->
  <!-- Shackle -->
  <path d="M28 40 C28 34, 36 34, 36 40" fill="none" stroke="#64748b" stroke-width="2.5"/>
  <!-- Lock Body -->
  <rect x="26" y="40" width="12" height="11" rx="2.5" fill="url(#brassLock)" stroke="#713f12" stroke-width="1.5"/>
  <circle cx="32" cy="44" r="1.2" fill="#451a03"/>
  <line x1="32" y1="44" x2="32" y2="48" stroke="#451a03" stroke-width="1.2"/>
</svg>
