<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 64" width="128" height="64">
  <defs>
    <linearGradient id="iceGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#bbf2f6" stop-opacity="0.85"/>
      <stop offset="50%" stop-color="#70d6eb" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#38b2d8" stop-opacity="0.85"/>
    </linearGradient>
    <linearGradient id="specularGlint" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="30%" stop-color="#ffffff" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Base Ice/Glass Body -->
  <rect x="2" y="2" width="124" height="60" rx="6" fill="url(#iceGrad)" stroke="#1e88a8" stroke-width="2.5"/>

  <!-- Inner Frosted Border -->
  <rect x="5" y="5" width="118" height="54" rx="4" fill="none" stroke="#e0f7fa" stroke-width="1.8" opacity="0.85"/>

  <!-- Diagonal Specular Gloss Bands (Angry Birds iconic glass shine) -->
  <polygon points="12,6 36,6 18,58 6,58" fill="url(#specularGlint)"/>
  <polygon points="44,6 54,6 38,58 28,58" fill="url(#specularGlint)" opacity="0.7"/>

  <!-- Ice Crystal Refraction Facets -->
  <line x1="85" y1="8" x2="118" y2="42" stroke="#ffffff" stroke-width="1.5" stroke-dasharray="8 4" opacity="0.6"/>
  <line x1="72" y1="28" x2="95" y2="52" stroke="#ffffff" stroke-width="1.2" opacity="0.5"/>

  <!-- Sparkle Star in Corner -->
  <g transform="translate(108, 16)">
    <polygon points="0,-7 2,-2 7,0 2,2 0,7 -2,2 -7,0 -2,-2" fill="#ffffff"/>
    <circle cx="0" cy="0" r="1.5" fill="#e0f7fa"/>
  </g>
</svg>
