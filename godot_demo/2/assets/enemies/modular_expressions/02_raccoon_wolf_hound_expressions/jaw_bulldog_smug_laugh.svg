<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 140 100" width="140" height="100">
  <!-- Spike Hound (Bulldog) Smug Goofy Laugh Underbite Jaw -->
  <defs>
    <linearGradient id="houndSkin2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>
  </defs>
  <!-- Huge Jowls -->
  <ellipse cx="36" cy="42" rx="26" ry="24" fill="url(#houndSkin2)" stroke="#0f172a" stroke-width="4"/>
  <ellipse cx="104" cy="42" rx="26" ry="24" fill="url(#houndSkin2)" stroke="#0f172a" stroke-width="4"/>
  <!-- Black Flat Nose -->
  <ellipse cx="70" cy="28" rx="18" ry="12" fill="#09090b" stroke="#0f172a" stroke-width="3"/>
  <ellipse cx="64" cy="30" rx="4" ry="5" fill="#27272a"/>
  <ellipse cx="76" cy="30" rx="4" ry="5" fill="#27272a"/>
  <!-- Big Laughing Underbite Mouth -->
  <path d="M 36,44 Q 70,38 104,44 C 108,76 96,86 70,86 C 44,86 32,76 36,44 Z" fill="#881337" stroke="#0f172a" stroke-width="4"/>
  <!-- Big Slobbery Pink Tongue -->
  <path d="M 52,56 Q 70,48 88,56 C 92,78 78,88 70,88 C 62,88 48,78 52,56 Z" fill="#fb7185" stroke="#0f172a" stroke-width="2.5"/>
  <line x1="70" y1="58" x2="70" y2="78" stroke="#e11d48" stroke-width="2.5"/>
  <!-- Prominent Gold Underbite Tusks Overhanging -->
  <polygon points="40,54 48,54 44,38" fill="#facc15" stroke="#0f172a" stroke-width="2"/>
  <polygon points="100,54 92,54 96,38" fill="#facc15" stroke="#0f172a" stroke-width="2"/>
</svg>
