<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 130 90" width="130" height="90">
  <!-- Mine Wolf Furious Red Gum Snarl Muzzle -->
  <defs>
    <linearGradient id="wolfFur" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <!-- Main Wolf Snout Bridge -->
  <path d="M 38,15 L 92,15 L 102,48 L 88,80 L 42,80 L 28,48 Z" fill="url(#wolfFur)" stroke="#0f172a" stroke-width="3.5" stroke-linejoin="round"/>
  <!-- Wrinkle Frown Lines on Bridge -->
  <path d="M 52,22 Q 65,30 78,22" fill="none" stroke="#0f172a" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M 55,29 Q 65,36 75,29" fill="none" stroke="#0f172a" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Black Snarling Nose -->
  <path d="M 50,38 Q 65,32 80,38 L 74,50 Q 65,54 56,50 Z" fill="#020617" stroke="#020617" stroke-width="2"/>
  <ellipse cx="60" cy="46" rx="2" ry="3" fill="#ffffff" opacity="0.6"/>
  <!-- Bared Crimson Gums & Razor Fangs -->
  <path d="M 35,52 Q 65,46 95,52 Q 90,75 65,76 Q 40,75 35,52 Z" fill="#991b1b" stroke="#0f172a" stroke-width="3"/>
  <!-- Upper Fangs (Long curved) -->
  <polygon points="40,51 47,51 44,67" fill="#ffffff" stroke="#0f172a" stroke-width="1.5"/>
  <polygon points="90,51 83,51 86,67" fill="#ffffff" stroke="#0f172a" stroke-width="1.5"/>
  <!-- Middle Incisors -->
  <polygon points="52,50 58,50 55,60" fill="#ffffff" stroke="#0f172a" stroke-width="1.2"/>
  <polygon points="62,50 68,50 65,60" fill="#ffffff" stroke="#0f172a" stroke-width="1.2"/>
  <polygon points="72,50 78,50 75,60" fill="#ffffff" stroke="#0f172a" stroke-width="1.2"/>
  <!-- Lower Fangs -->
  <polygon points="48,74 54,74 51,62" fill="#ffffff" stroke="#0f172a" stroke-width="1.5"/>
  <polygon points="82,74 76,74 79,62" fill="#ffffff" stroke="#0f172a" stroke-width="1.5"/>
</svg>
