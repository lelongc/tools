<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 60" width="120" height="60">
  <!-- Spike Hound (Bulldog) Furious Glaring Red-Veined Eyes -->
  <!-- Left Eye -->
  <ellipse cx="38" cy="30" rx="20" ry="16" fill="#ffffff" stroke="#0f172a" stroke-width="3"/>
  <circle cx="44" cy="30" r="7" fill="#dc2626"/>
  <circle cx="44" cy="30" r="3.5" fill="#0f172a"/>
  <circle cx="42" cy="28" r="1.5" fill="#ffffff"/>
  <!-- Bloodshot Veins Left -->
  <path d="M 22,26 Q 30,28 34,26" fill="none" stroke="#ef4444" stroke-width="1.2"/>
  <path d="M 24,34 Q 31,31 35,33" fill="none" stroke="#ef4444" stroke-width="1.2"/>
  <!-- Right Eye -->
  <ellipse cx="82" cy="30" rx="20" ry="16" fill="#ffffff" stroke="#0f172a" stroke-width="3"/>
  <circle cx="76" cy="30" r="7" fill="#dc2626"/>
  <circle cx="76" cy="30" r="3.5" fill="#0f172a"/>
  <circle cx="74" cy="28" r="1.5" fill="#ffffff"/>
  <!-- Bloodshot Veins Right -->
  <path d="M 98,26 Q 90,28 86,26" fill="none" stroke="#ef4444" stroke-width="1.2"/>
  <path d="M 96,34 Q 89,31 85,33" fill="none" stroke="#ef4444" stroke-width="1.2"/>
  <!-- Heavy Angry Brow Folds -->
  <path d="M 16,18 Q 38,28 58,16" fill="none" stroke="#0f172a" stroke-width="4.5" stroke-linecap="round"/>
  <path d="M 104,18 Q 82,28 62,16" fill="none" stroke="#0f172a" stroke-width="4.5" stroke-linecap="round"/>
</svg>
