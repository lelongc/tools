<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 80" width="120" height="80">
  <!-- Raccoon Bruised Hurt Ouch Muzzle -->
  <ellipse cx="60" cy="40" rx="44" ry="28" fill="#334155" stroke="#0f172a" stroke-width="4"/>
  <ellipse cx="60" cy="38" rx="34" ry="20" fill="#cbd5e1" stroke="#475569" stroke-width="3"/>
  <!-- Purple Swollen Bruise Patch -->
  <ellipse cx="46" cy="44" rx="14" ry="10" fill="#7c3aed" opacity="0.35"/>
  <ellipse cx="46" cy="44" rx="9" ry="6" fill="#4c1d95" opacity="0.45"/>
  <!-- Broken Bandaid on Cheek -->
  <rect x="74" y="32" width="16" height="8" rx="2" transform="rotate(25 82 36)" fill="#fde047" stroke="#ca8a04" stroke-width="1.5"/>
  <circle cx="82" cy="36" r="1.5" fill="#ca8a04"/>
  <!-- Crooked Nose -->
  <polygon points="58,26 49,37 68,39" fill="#0f172a" stroke="#0f172a" stroke-width="2" stroke-linejoin="round"/>
