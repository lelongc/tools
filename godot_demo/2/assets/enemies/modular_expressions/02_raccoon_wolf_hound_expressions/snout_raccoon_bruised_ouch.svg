  <path d="M 46,54 Q 54,49 60,53 Q 68,49 74,56 Q 60,62 46,54 Z" fill="#450a0a" stroke="#0f172a" stroke-width="2.5"/>
  <!-- Broken Tooth -->
  <polygon points="52,52 56,52 54,56" fill="#f8fafc" stroke="#0f172a" stroke-width="1.2"/>
  <rect x="64" y="52" width="5" height="5" rx="1" fill="#f8fafc" stroke="#0f172a" stroke-width="1.2"/>
  <!-- Drooping Whiskers -->
  <line x1="28" y1="40" x2="10" y2="48" stroke="#0f172a" stroke-width="2" stroke-linecap="round"/>
  <line x1="92" y1="40" x2="110" y2="48" stroke="#0f172a" stroke-width="2" stroke-linecap="round"/>
</svg>
