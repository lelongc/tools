<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 140 100" width="140" height="100">
  <!-- Baron Von Claws Mole King Furious Growl Muzzle with Bristling Pointed Mustache -->
  <defs>
    <linearGradient id="moleMuzzle2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fed7aa"/>
      <stop offset="100%" stop-color="#fdba74"/>
    </linearGradient>
    <linearGradient id="mustacheGrad2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#451a03"/>
      <stop offset="100%" stop-color="#1c1917"/>
    </linearGradient>
  </defs>
  <!-- Fur Muzzle -->
  <ellipse cx="70" cy="48" rx="42" ry="28" fill="url(#moleMuzzle2)" stroke="#0f172a" stroke-width="3.5"/>
  <!-- Black Nose with Angry Snarl Bridge Wrinkle -->
  <polygon points="70,22 58,37 82,37" fill="#0f172a" stroke="#0f172a" stroke-width="2" stroke-linejoin="round"/>
  <!-- Angry Snarl Teeth Clench -->
  <path d="M 46,55 Q 70,50 94,55 C 90,72 70,76 46,55 Z" fill="#991b1b" stroke="#0f172a" stroke-width="3"/>
  <!-- Sharp Gold Canine + Gritted Incisors -->
  <polygon points="54,53 60,53 57,66" fill="#facc15" stroke="#0f172a" stroke-width="1.5"/>
  <polygon points="86,53 80,53 83,66" fill="#ffffff" stroke="#0f172a" stroke-width="1.5"/>
  <rect x="62" y="53" width="6" height="7" rx="1" fill="#ffffff" stroke="#0f172a" stroke-width="1.2"/>
  <rect x="70" y="53" width="6" height="7" rx="1" fill="#ffffff" stroke="#0f172a" stroke-width="1.2"/>
  <!-- Bristling Furious Handlebar Mustache (Pointed Upwards like Horns) -->
  <path d="M 70,44 C 54,42 34,34 18,18 C 14,28 20,40 32,46 C 44,52 58,52 70,50 Z" fill="url(#mustacheGrad2)" stroke="#0f172a" stroke-width="3.5"/>
  <path d="M 70,44 C 86,42 106,34 122,18 C 126,28 120,40 108,46 C 96,52 82,52 70,50 Z" fill="url(#mustacheGrad2)" stroke="#0f172a" stroke-width="3.5"/>
  <!-- Whiskers Stiff with Rage -->
  <line x1="38" y1="42" x2="12" y2="40" stroke="#0f172a" stroke-width="2.5"/>
  <line x1="102" y1="42" x2="128" y2="40" stroke="#0f172a" stroke-width="2.5"/>
</svg>
