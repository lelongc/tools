<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 140 100" width="140" height="100">
  <!-- Baron Von Claws Mole King Panicked Shivering Muzzle with Drooping Handlebar Mustache -->
  <defs>
    <linearGradient id="moleMuzzle1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fed7aa"/>
      <stop offset="100%" stop-color="#fdba74"/>
    </linearGradient>
    <linearGradient id="mustacheGrad1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#451a03"/>
      <stop offset="100%" stop-color="#1c1917"/>
    </linearGradient>
  </defs>
  <!-- Cream/Tan Mole Fur Muzzle -->
  <ellipse cx="70" cy="48" rx="42" ry="28" fill="url(#moleMuzzle1)" stroke="#0f172a" stroke-width="3.5"/>
  <!-- Mole Black Nose -->
  <polygon points="70,25 58,40 82,40" fill="#0f172a" stroke="#0f172a" stroke-width="2" stroke-linejoin="round"/>
  <ellipse cx="66" cy="30" rx="3" ry="2" fill="#ffffff" opacity="0.8"/>
  <!-- Panicked Screaming Agaped Mouth (O-Shape) -->
  <ellipse cx="70" cy="62" rx="18" ry="18" fill="#450a0a" stroke="#0f172a" stroke-width="3.5"/>
  <!-- Gold Canine Tooth Quivering -->
  <polygon points="62,49 68,49 65,60" fill="#facc15" stroke="#0f172a" stroke-width="1.5"/>
  <!-- Shivering, Drooping Limp Handlebar Mustache (Deflated in Panic) -->
  <path d="M 70,44 C 54,42 36,46 22,62 C 18,68 14,76 16,84 C 18,74 28,68 40,64 C 52,60 62,56 70,52 Z" fill="url(#mustacheGrad1)" stroke="#0f172a" stroke-width="3"/>
  <path d="M 70,44 C 86,42 104,46 118,62 C 122,68 126,76 124,84 C 122,74 112,68 100,64 C 88,60 78,56 70,52 Z" fill="url(#mustacheGrad1)" stroke="#0f172a" stroke-width="3"/>
  <!-- Shiver Lines Around Mustache -->
  <path d="M 12,66 Q 10,72 12,78" fill="none" stroke="#0284c7" stroke-width="2" stroke-linecap="round"/>
  <path d="M 128,66 Q 130,72 128,78" fill="none" stroke="#0284c7" stroke-width="2" stroke-linecap="round"/>
  <!-- Whiskers -->
  <line x1="38" y1="36" x2="16" y2="28" stroke="#0f172a" stroke-width="2"/>
  <line x1="102" y1="36" x2="124" y2="28" stroke="#0f172a" stroke-width="2"/>
</svg>
