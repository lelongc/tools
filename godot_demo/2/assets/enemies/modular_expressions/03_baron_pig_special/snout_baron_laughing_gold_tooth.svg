  <line x1="40" y1="62" x2="8" y2="66" stroke="#261203" stroke-width="3" stroke-linecap="round"/>
  <line x1="180" y1="50" x2="210" y2="42" stroke="#261203" stroke-width="3" stroke-linecap="round"/>
  <line x1="180" y1="62" x2="212" y2="66" stroke="#261203" stroke-width="3" stroke-linecap="round"/>

  <!-- Wide Open Laughing Mouth -->
  <path d="M68 76 Q110 134 152 76 Z" fill="#450a0a" stroke="#261203" stroke-width="5"/>
