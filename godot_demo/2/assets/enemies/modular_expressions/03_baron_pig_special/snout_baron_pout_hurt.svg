<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 140 100" width="140" height="100">
  <!-- Baron Von Claws Mole King Pout Hurt Muzzle with Bruised Nose -->
  <defs>
    <linearGradient id="moleMuzzle3" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fed7aa"/>
      <stop offset="100%" stop-color="#fdba74"/>
    </linearGradient>
    <linearGradient id="mustacheGrad3" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#451a03"/>
      <stop offset="100%" stop-color="#1c1917"/>
    </linearGradient>
  </defs>
  <!-- Fur Muzzle with Bruise Patch -->
  <ellipse cx="70" cy="48" rx="42" ry="28" fill="url(#moleMuzzle3)" stroke="#0f172a" stroke-width="3.5"/>
  <ellipse cx="56" cy="40" rx="14" ry="10" fill="#7c3aed" opacity="0.35"/>
  <!-- Swollen Bruised Nose with Bandaid -->
  <polygon points="70,24 56,38 84,38" fill="#450a0a" stroke="#0f172a" stroke-width="2" stroke-linejoin="round"/>
  <rect x="58" y="29" width="18" height="7" rx="2" fill="#fde047" stroke="#ca8a04" stroke-width="1.2"/>
  <!-- Tearful Pouting Mouth (Wobbly curved down) -->
  <path d="M 52,66 Q 70,56 88,66 Q 84,74 70,72 Q 56,74 52,66 Z" fill="#701a75" stroke="#0f172a" stroke-width="2.5"/>
  <!-- Quivering Lower Lip -->
  <path d="M 58,72 Q 70,78 82,72" fill="none" stroke="#be185d" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Drooping Disheveled Mustache with Kinks -->
  <path d="M 70,44 C 54,44 38,54 26,68 C 22,74 18,84 20,88 C 24,80 32,74 44,68 C 54,64 62,56 70,50 Z" fill="url(#mustacheGrad3)" stroke="#0f172a" stroke-width="3"/>
  <path d="M 70,44 C 86,44 102,54 114,68 C 118,74 122,84 120,88 C 116,80 108,74 96,68 C 86,64 78,56 70,50 Z" fill="url(#mustacheGrad3)" stroke="#0f172a" stroke-width="3"/>
  <!-- Single Tear Drop rolling off chin -->
  <path d="M 70,78 C 67,83 66,88 70,92 C 74,88 73,83 70,78 Z" fill="#38bdf8"/>
</svg>
