<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160">
  <g transform="rotate(25 80 80)">
    <!-- Popping Monocle Frame -->
    <circle cx="80" cy="70" r="38" fill="#bae6fd" fill-opacity="0.6" stroke="#eab308" stroke-width="8"/>
    <circle cx="72" cy="62" rx="10" ry="6" fill="#ffffff"/>
    <!-- Broken Chain Links -->
    <circle cx="120" cy="70" r="5" fill="none" stroke="#ca8a04" stroke-width="4"/>
    <circle cx="132" cy="80" r="5" fill="none" stroke="#ca8a04" stroke-width="4"/>
    <circle cx="140" cy="94" r="5" fill="none" stroke="#ca8a04" stroke-width="4"/>
    <!-- Speed Motion Lines -->
    <line x1="20" y1="70" x2="38" y2="70" stroke="#ca8a04" stroke-width="5" stroke-linecap="round"/>
    <line x1="26" y1="56" x2="42" y2="56" stroke="#ca8a04" stroke-width="4" stroke-linecap="round"/>
    <line x1="24" y1="84" x2="40" y2="84" stroke="#ca8a04" stroke-width="4" stroke-linecap="round"/>
  </g>
</svg>