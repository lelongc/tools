<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 140 100" width="140" height="100">
  <!-- Ironclad Rhino Furious Ramming Muzzle with Giant Horn & Steel Plates -->
  <defs>
    <linearGradient id="steelRhino" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#94a3b8"/>
      <stop offset="50%" stop-color="#475569"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="hornRhino" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e2e8f0"/>
      <stop offset="60%" stop-color="#64748b"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
  </defs>
  <!-- Armored Heavy Rhino Snout Plate -->
  <path d="M 30,35 L 110,35 L 118,75 L 22,75 Z" fill="url(#steelRhino)" stroke="#0f172a" stroke-width="4" stroke-linejoin="round"/>
  <!-- Steel Rivets -->
  <circle cx="32" cy="42" r="3.5" fill="#f8fafc" stroke="#0f172a" stroke-width="1.5"/>
  <circle cx="108" cy="42" r="3.5" fill="#f8fafc" stroke="#0f172a" stroke-width="1.5"/>
  <circle cx="30" cy="68" r="3.5" fill="#f8fafc" stroke="#0f172a" stroke-width="1.5"/>
  <circle cx="110" cy="68" r="3.5" fill="#f8fafc" stroke="#0f172a" stroke-width="1.5"/>
  <!-- Furious Snarl Mouth (Lower edge) -->
  <path d="M 40,75 Q 70,82 100,75 L 94,92 Q 70,96 46,92 Z" fill="#7f1d1d" stroke="#0f172a" stroke-width="3"/>
  <!-- Steel Fangs / Spikes -->
  <polygon points="50,75 56,75 53,86" fill="#ffffff" stroke="#0f172a" stroke-width="1.5"/>
  <polygon points="90,75 84,75 87,86" fill="#ffffff" stroke="#0f172a" stroke-width="1.5"/>
  <!-- GIANT STEEL RAMMING HORN (Centered and Pointing Upwards) -->
  <path d="M 52,48 C 50,30 65,2 70,0 C 75,2 90,30 88,48 Z" fill="url(#hornRhino)" stroke="#0f172a" stroke-width="4"/>
  <line x1="70" y1="2" x2="70" y2="46" stroke="#f8fafc" stroke-width="2" opacity="0.6"/>
  <!-- Furious Steam Jets from horn base -->
  <path d="M 42,48 Q 28,45 22,40 Q 32,38 42,42 Z" fill="#e2e8f0" opacity="0.8"/>
  <path d="M 98,48 Q 112,45 118,40 Q 108,38 98,42 Z" fill="#e2e8f0" opacity="0.8"/>
</svg>
