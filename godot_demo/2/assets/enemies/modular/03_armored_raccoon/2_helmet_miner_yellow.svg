<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 160" width="256" height="160">
  <!-- Yellow Miner Hardhat with Headlamp -->
  <defs>
    <linearGradient id="hardhat_grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="70%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#a16207"/>
    </linearGradient>
    <radialGradient id="lamp_glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#7dd3fc"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </radialGradient>
  </defs>
  <!-- Hardhat Dome -->
  <path d="M36 104 C30 36 74 16 128 16 C182 16 226 36 220 104 L236 112 L20 112 Z" fill="url(#hardhat_grad)" stroke="#451a03" stroke-width="7"/>
  <!-- Ridge Rib on Top -->
  <path d="M116 16 L116 104 M140 16 L140 104" stroke="#ca8a04" stroke-width="4"/>
  <!-- Front Headlamp Bracket -->
  <rect x="106" y="66" width="44" height="38" rx="6" fill="#374151" stroke="#111827" stroke-width="4"/>
  <!-- Glowing Lens -->
  <circle cx="128" cy="85" r="14" fill="url(#lamp_glow)" stroke="#ffffff" stroke-width="2"/>
</svg>