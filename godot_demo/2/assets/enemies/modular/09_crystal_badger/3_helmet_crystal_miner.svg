<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 100" width="160" height="100">
  <!-- Hardened Dark Steel Mining Helmet with Glowing Amethyst Crystal Visor -->
  <defs>
    <linearGradient id="helmSteel" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="crystalVisor" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#e879f9"/>
    </linearGradient>
  </defs>
  <!-- Dome of Helmet -->
  <path d="M 22,65 Q 20,15 80,10 Q 140,15 138,65 Q 80,50 22,65 Z" fill="url(#helmSteel)" stroke="#020617" stroke-width="4.5"/>
  <!-- Helmet Crest Ridge -->
  <path d="M 72,11 L 88,11 L 85,55 L 75,55 Z" fill="#64748b" stroke="#020617" stroke-width="2"/>
  <!-- Headlamp / Crystal Socket -->
  <circle cx="80" cy="35" r="14" fill="#0f172a" stroke="#ca8a04" stroke-width="3"/>
  <polygon points="80,24 89,32 86,44 74,44 71,32" fill="#22d3ee" stroke="#0f172a" stroke-width="2"/>
  <circle cx="80" cy="35" r="4" fill="#ffffff"/>
  <!-- Glowing Crystal Visor Rim -->
  <path d="M 18,65 Q 80,48 142,65 L 140,78 Q 80,62 20,78 Z" fill="url(#crystalVisor)" stroke="#020617" stroke-width="3"/>
  <!-- Rim Rivets -->
  <circle cx="28" cy="70" r="2.5" fill="#f8fafc"/>
  <circle cx="132" cy="70" r="2.5" fill="#f8fafc"/>
</svg>
