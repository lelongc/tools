  <polygon points="78,44 72,44 75,54" fill="#ffffff" stroke="#020617" stroke-width="1.2"/>
  <polygon points="56,68 60,68 58,60" fill="#ffffff" stroke="#020617" stroke-width="1.2"/>
  <polygon points="74,68 70,68 72,60" fill="#ffffff" stroke="#020617" stroke-width="1.2"/>
  <!-- Shivering Whiskers -->
