<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 80" width="160" height="80">
  <!-- Spiked Amethyst Crystal Shoulder Pauldrons -->
  <defs>
    <linearGradient id="amethystGem" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e879f9"/>
      <stop offset="50%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#581c87"/>
    </linearGradient>
  </defs>
  <!-- Left Spiked Shoulder Gem Cluster -->
  <g transform="translate(10, 10)">
    <polygon points="30,55 10,25 25,10 45,35" fill="url(#amethystGem)" stroke="#0f172a" stroke-width="3" stroke-linejoin="round"/>
    <polygon points="40,55 35,5 55,18 52,48" fill="#d946ef" stroke="#0f172a" stroke-width="3" stroke-linejoin="round"/>
    <!-- Highlight Facet -->
    <polygon points="32,20 20,22 28,14" fill="#ffffff" opacity="0.6"/>
  </g>
  <!-- Right Spiked Shoulder Gem Cluster -->
  <g transform="translate(90, 10)">
    <polygon points="20,55 40,25 25,10 5,35" fill="url(#amethystGem)" stroke="#0f172a" stroke-width="3" stroke-linejoin="round"/>
    <polygon points="10,55 15,5 -5,18 -2,48" fill="#d946ef" stroke="#0f172a" stroke-width="3" stroke-linejoin="round"/>
    <!-- Highlight Facet -->
    <polygon points="18,20 30,22 22,14" fill="#ffffff" opacity="0.6"/>
  </g>
</svg>
