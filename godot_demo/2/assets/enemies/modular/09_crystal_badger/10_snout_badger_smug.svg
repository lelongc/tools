  <!-- Nose -->
  <polygon points="65,22 50,36 80,36" fill="#020617" stroke="#020617" stroke-width="2" stroke-linejoin="round"/>
  <!-- Smug Cocky Grin -->
  <path d="M 44,48 Q 65,46 88,44 Q 82,62 62,60 Q 48,58 44,48 Z" fill="#831843" stroke="#020617" stroke-width="3"/>
  <!-- Gold Tooth Glint -->
  <rect x="70" y="45" width="7" height="7" rx="1.5" fill="#facc15" stroke="#020617" stroke-width="1.2"/>
  <rect x="58" y="46" width="6" height="6" rx="1" fill="#ffffff" stroke="#020617" stroke-width="1.2"/>
  <!-- Whiskers -->
  <line x1="30" y1="38" x2="8" y2="34" stroke="#020617" stroke-width="2"/>
  <line x1="100" y1="38" x2="122" y2="34" stroke="#020617" stroke-width="2"/>
