<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 130" width="220" height="130">
  <defs>
    <linearGradient id="mustache_gold_grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="30%" stop-color="#eab308"/>
      <stop offset="70%" stop-color="#ca8a04"/>
      <stop offset="100%" stop-color="#854d0e"/>
    </linearGradient>
    <radialGradient id="muzzle_grad" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#fef3c7"/>
      <stop offset="100%" stop-color="#fed7aa"/>
    </radialGradient>
  </defs>

  <!-- Muzzle Fur Patch (Soft Cream/Tan Mole Cheeks) -->
  <path d="M46 45 Q110 25 174 45 Q190 75 160 92 Q110 102 60 92 Q30 75 46 45 Z" 
        fill="url(#muzzle_grad)" stroke="#261203" stroke-width="5"/>

  <!-- Whiskers (Left and Right) -->
  <line x1="40" y1="56" x2="10" y2="48" stroke="#261203" stroke-width="3" stroke-linecap="round"/>
  <line x1="40" y1="68" x2="8" y2="72" stroke="#261203" stroke-width="3" stroke-linecap="round"/>
  <line x1="180" y1="56" x2="210" y2="48" stroke="#261203" stroke-width="3" stroke-linecap="round"/>
  <line x1="180" y1="68" x2="212" y2="72" stroke="#261203" stroke-width="3" stroke-linecap="round"/>

  <!-- Glossy Black Triangular Mole Nose (NO PIG SNOUT!) -->
  <path d="M96 36 Q110 32 124 36 Q128 48 110 54 Q92 48 96 36 Z" fill="#18181b" stroke="#09090b" stroke-width="3"/>
  <ellipse cx="106" cy="38" rx="4" ry="2.5" fill="#ffffff" opacity="0.8"/>

  <!-- Smug Mouth Line with Golden Tooth -->
  <path d="M80 66 Q110 82 140 64" stroke="#261203" stroke-width="5" stroke-linecap="round" fill="none"/>
  <!-- Gold Fang Tooth -->
  <polygon points="120,68 128,68 124,80" fill="#facc15" stroke="#854d0e" stroke-width="2"/>

  <!-- Magnificent Curly Golden Handlebar Commander Mustache -->
  <path d="M110 58 C86 52 46 56 26 78 C18 90 38 98 52 86 C68 74 90 70 110 74 C130 70 152 74 168 86 C182 98 202 90 194 78 C174 56 134 52 110 58 Z" 
        fill="url(#mustache_gold_grad)" stroke="#451a03" stroke-width="4.5" stroke-linejoin="round"/>
</svg>