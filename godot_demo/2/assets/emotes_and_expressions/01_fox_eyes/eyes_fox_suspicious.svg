<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 90" width="160" height="90">
  <!-- Left Eye: Normal size, pupil top-right -->
  <ellipse cx="45" cy="50" rx="30" ry="32" fill="#ffffff" stroke="#4a1503" stroke-width="6"/>
  <circle cx="58" cy="38" r="12" fill="#1a0b06"/>
  <circle cx="62" cy="34" r="3.5" fill="#ffffff"/>
  <!-- Right Eye: Squinted lower -->
  <path d="M85 58 Q115 36 145 54 Q115 76 85 58 Z" fill="#ffffff" stroke="#4a1503" stroke-width="6"/>
  <circle cx="124" cy="50" r="10" fill="#1a0b06"/>
  <circle cx="127" cy="47" r="3" fill="#ffffff"/>
  <!-- Eyebrows: Left raised high, Right furrowed down -->
  <path d="M16 22 Q42 8 68 26" stroke="#4a1503" stroke-width="8" stroke-linecap="round" fill="none"/>
  <path d="M90 42 Q118 48 144 36" stroke="#4a1503" stroke-width="8" stroke-linecap="round" fill="none"/>
</svg>