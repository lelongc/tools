<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160">
  <defs>
    <linearGradient id="zzz_grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#bae6fd"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="2" flood-color="#0369a1" flood-opacity="0.3"/>
    </filter>
  </defs>
  <!-- Small Z -->
  <g transform="translate(30, 96)" filter="url(#shadow)">
    <path d="M0 0 L24 0 L6 24 L24 24" fill="none" stroke="#0284c7" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M0 0 L24 0 L6 24 L24 24" fill="none" stroke="#e0f2fe" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <!-- Medium Z -->
  <g transform="translate(60, 52)" filter="url(#shadow)">
    <path d="M0 0 L34 0 L8 34 L34 34" fill="none" stroke="#0284c7" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M0 0 L34 0 L8 34 L34 34" fill="none" stroke="#e0f2fe" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <!-- Large Z -->
  <g transform="translate(98, 10)" filter="url(#shadow)">
    <path d="M0 0 L44 0 L10 44 L44 44" fill="none" stroke="#0284c7" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M0 0 L44 0 L10 44 L44 44" fill="none" stroke="#e0f2fe" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <!-- Snot Bubbles -->
  <circle cx="24" cy="136" r="8" fill="#bae6fd" fill-opacity="0.7" stroke="#0284c7" stroke-width="3"/>
  <circle cx="44" cy="144" r="5" fill="#bae6fd" fill-opacity="0.7" stroke="#0284c7" stroke-width="2"/>
</svg>