<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 48 48">
  <defs>
    <linearGradient id="rainbowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff1744"/>
      <stop offset="25%" stop-color="#ff9100"/>
      <stop offset="50%" stop-color="#ffea00"/>
      <stop offset="75%" stop-color="#00e676"/>
      <stop offset="100%" stop-color="#00b0ff"/>
    </linearGradient>
  </defs>

  <!-- Pulsing Outer Halo -->
  <circle cx="24" cy="24" r="22" fill="none" stroke="#ffff00" stroke-width="2" stroke-dasharray="6 3" opacity="0.8"/>

  <!-- Rainbow Prismatic Bubble -->
  <circle cx="24" cy="24" r="18" fill="url(#rainbowGrad)" stroke="#ffffff" stroke-width="2.5"/>

  <!-- Star Sparkles around -->
  <polygon points="10,12 12,8 14,12 18,14 14,16 12,20 10,16 6,14" fill="#ffffff"/>
  <polygon points="36,32 38,28 40,32 44,34 40,36 38,40 36,36 32,34" fill="#ffff00"/>
  <polygon points="34,14 35,11 36,14 39,15 36,16 35,19 34,16 31,15" fill="#ffffff"/>

  <!-- Glass Bubble Highlight -->
  <ellipse cx="19" cy="17" rx="5" ry="3" fill="#ffffff" opacity="0.85" transform="rotate(-30 19 17)"/>
  <circle cx="27" cy="29" r="2" fill="#ffffff" opacity="0.6"/>
</svg>
