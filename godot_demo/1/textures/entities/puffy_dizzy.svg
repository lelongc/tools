<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="dizzyBodyGrad" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#FFF59D"/>
      <stop offset="30%" stop-color="#FFCA28"/>
      <stop offset="70%" stop-color="#FFA000"/>
      <stop offset="100%" stop-color="#E65100"/>
    </radialGradient>
    <radialGradient id="dizzyCheekGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#BA68C8" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#BA68C8" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Drooping Tail -->
  <path d="M 120 270 C 60 250, 30 280, 20 310 C 45 320, 60 310, 120 290 Z" 
        fill="#FFA000" stroke="#E65100" stroke-width="7"/>

  <!-- Dizzy Body with Slight Tilt -->
  <circle cx="260" cy="270" r="175" fill="url(#dizzyBodyGrad)" stroke="#BF360C" stroke-width="10"/>

  <!-- Cream Belly -->
  <path d="M 160 310 C 160 410, 360 410, 390 320 C 350 350, 230 355, 160 310 Z" 
        fill="#FFF9C4" stroke="#FFA000" stroke-width="5"/>

  <!-- Purple Queasy Cheeks -->
  <circle cx="240" cy="305" r="30" fill="url(#dizzyCheekGrad)"/>
  <circle cx="420" cy="305" r="30" fill="url(#dizzyCheekGrad)"/>

  <!-- Dizzy Spiral Eyes -->
  <!-- Left Eye -->
  <circle cx="295" cy="215" r="50" fill="#FFFFFF" stroke="#D84315" stroke-width="7"/>
  <path d="M 295 215 
           m -5, 0 a 5,5 0 1,0 10,0 a 5,5 0 1,0 -10,0
           m -12, 0 a 17,17 0 1,0 34,0 a 17,17 0 1,0 -34,0
           m -12, 0 a 29,29 0 1,0 58,0 a 29,29 0 1,0 -58,0" 
        stroke="#4A148C" stroke-width="5" fill="none" stroke-linecap="round"/>

  <!-- Right Eye -->
  <circle cx="395" cy="215" r="46" fill="#FFFFFF" stroke="#D84315" stroke-width="7"/>
  <path d="M 395 215 
           m -5, 0 a 5,5 0 1,0 10,0 a 5,5 0 1,0 -10,0
           m -11, 0 a 16,16 0 1,0 32,0 a 16,16 0 1,0 -32,0
           m -11, 0 a 27,27 0 1,0 54,0 a 27,27 0 1,0 -54,0" 
        stroke="#4A148C" stroke-width="5" fill="none" stroke-linecap="round"/>

  <!-- Wobbly Mouth -->
  <path d="M 325 320 Q 345 305 365 325 T 395 315" stroke="#BF360C" stroke-width="6" stroke-linecap="round" fill="none"/>

  <!-- Orbiting Dizzy Bubbles around Head -->
  <circle cx="260" cy="85" r="18" fill="#E1F5FE" stroke="#81D4FA" stroke-width="3" opacity="0.9"/>
  <ellipse cx="254" cy="79" rx="5" ry="3" fill="#FFFFFF" opacity="0.95"/>
  <circle cx="340" cy="102" r="14" fill="#E1F5FE" stroke="#81D4FA" stroke-width="2.5" opacity="0.85"/>
  <ellipse cx="335" cy="97" rx="4" ry="2.5" fill="#FFFFFF" opacity="0.95"/>
  <circle cx="190" cy="106" r="13" fill="#E1F5FE" stroke="#81D4FA" stroke-width="2.5" opacity="0.85"/>
  <ellipse cx="186" cy="102" rx="3.5" ry="2" fill="#FFFFFF" opacity="0.95"/>
</svg>
