<svg xmlns="http://www.w3.org/2000/svg" width="120" height="100" viewBox="0 0 120 100">
  <defs>
    <radialGradient id="octoHead" cx="40%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#ab47bc"/>
      <stop offset="60%" stop-color="#6a1b9a"/>
      <stop offset="100%" stop-color="#311b92"/>
    </radialGradient>
    <radialGradient id="suctionCup" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#80deea"/>
      <stop offset="100%" stop-color="#00838f"/>
    </radialGradient>
  </defs>

  <!-- Background Tentacles -->
  <path d="M30 65 Q10 75 8 92 Q14 98 22 88 Q28 78 38 68" fill="#4a148c" stroke="#311b92" stroke-width="2"/>
  <path d="M90 65 Q110 75 112 92 Q106 98 98 88 Q92 78 82 68" fill="#4a148c" stroke="#311b92" stroke-width="2"/>

  <!-- Suction Cups on Back Tentacles -->
  <circle cx="12" cy="85" r="3.5" fill="url(#suctionCup)"/>
  <circle cx="108" cy="85" r="3.5" fill="url(#suctionCup)"/>
  <circle cx="20" cy="78" r="3" fill="url(#suctionCup)"/>
  <circle cx="100" cy="78" r="3" fill="url(#suctionCup)"/>

  <!-- Foreground Writhing Tentacles -->
  <path d="M42 70 Q30 85 36 96 Q44 98 48 88 Q48 78 52 70" fill="#7b1fa2" stroke="#4a148c" stroke-width="2.5"/>
  <path d="M78 70 Q90 85 84 96 Q76 98 72 88 Q72 78 68 70" fill="#7b1fa2" stroke="#4a148c" stroke-width="2.5"/>
  <path d="M52 72 Q56 88 60 98 Q64 88 68 72" fill="#8e24aa" stroke="#4a148c" stroke-width="2.5"/>

  <!-- Suction Cups on Front Tentacles -->
  <circle cx="34" cy="90" r="3" fill="url(#suctionCup)"/>
  <circle cx="86" cy="90" r="3" fill="url(#suctionCup)"/>
  <circle cx="60" cy="92" r="3.5" fill="url(#suctionCup)"/>

  <!-- Bulbous Octopus Head -->
  <ellipse cx="60" cy="46" rx="34" ry="28" fill="url(#octoHead)" stroke="#311b92" stroke-width="3"/>

  <!-- Glowing Yellow Predator Eyes -->
  <ellipse cx="46" cy="48" rx="8" ry="10" fill="#fff59d" stroke="#311b92" stroke-width="2"/>
  <ellipse cx="74" cy="48" rx="8" ry="10" fill="#fff59d" stroke="#311b92" stroke-width="2"/>
  <!-- Slit Pupils -->
  <rect x="44" y="44" width="3.5" height="9" rx="1.5" fill="#e65100"/>
  <rect x="73" y="44" width="3.5" height="9" rx="1.5" fill="#e65100"/>

  <!-- Pirate Captain Tricorn Hat -->
  <polygon points="60,6 24,28 96,28" fill="#212121" stroke="#ffd600" stroke-width="2.5"/>
  <polygon points="60,10 32,26 88,26" fill="#37474f"/>
  <!-- Skull Crossbones Icon on Hat -->
  <circle cx="60" cy="20" r="3.5" fill="#ffffff"/>
  <line x1="55" y1="17" x2="65" y2="23" stroke="#ffffff" stroke-width="1.2"/>
  <line x1="55" y1="23" x2="65" y2="17" stroke="#ffffff" stroke-width="1.2"/>
</svg>
