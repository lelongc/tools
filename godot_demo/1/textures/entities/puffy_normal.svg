<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <!-- Body 3D Gradient -->
    <radialGradient id="bodyGrad" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#FFF59D"/>
      <stop offset="25%" stop-color="#FFCA28"/>
      <stop offset="75%" stop-color="#FFA000"/>
      <stop offset="100%" stop-color="#E65100"/>
    </radialGradient>

    <!-- Belly Gradient -->
    <linearGradient id="bellyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="40%" stop-color="#FFFDE7"/>
      <stop offset="100%" stop-color="#FFF59D"/>
    </linearGradient>

    <!-- Cheek Glow -->
    <radialGradient id="cheekGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FF5252" stop-opacity="0.8"/>
      <stop offset="60%" stop-color="#FF8A80" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#FF8A80" stop-opacity="0"/>
    </radialGradient>

    <!-- Fin Gradient -->
    <linearGradient id="finGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFD54F"/>
      <stop offset="100%" stop-color="#FF8F00"/>
    </linearGradient>

    <!-- Eye Iris Gradient -->
    <radialGradient id="eyeGrad" cx="40%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#424242"/>
      <stop offset="60%" stop-color="#212121"/>
      <stop offset="100%" stop-color="#000000"/>
    </radialGradient>
  </defs>

  <!-- Tail Fin -->
  <path d="M 120 270 C 60 210, 40 180, 20 200 C 45 250, 50 280, 20 340 C 50 350, 70 320, 120 290 Z" 
        fill="url(#finGrad)" stroke="#E65100" stroke-width="8" stroke-linejoin="round"/>
  <path d="M 50 240 Q 90 265 110 272" stroke="#FFA000" stroke-width="4" stroke-linecap="round" fill="none"/>
  <path d="M 50 300 Q 90 285 110 278" stroke="#FFA000" stroke-width="4" stroke-linecap="round" fill="none"/>

  <!-- Top Dorsal Fin -->
  <path d="M 220 105 C 240 60, 270 50, 300 75 C 290 95, 280 110, 270 120 Z" 
        fill="url(#finGrad)" stroke="#E65100" stroke-width="7" stroke-linejoin="round"/>

  <!-- Tiny Soft Spikes along Top & Back -->
  <path d="M 155 180 L 135 150 L 175 165 Z" fill="#FF8F00" stroke="#E65100" stroke-width="5" stroke-linejoin="round"/>
  <path d="M 195 130 L 185 95 L 220 120 Z" fill="#FF8F00" stroke="#E65100" stroke-width="5" stroke-linejoin="round"/>
  <path d="M 130 230 L 95 220 L 130 255 Z" fill="#FF8F00" stroke="#E65100" stroke-width="5" stroke-linejoin="round"/>
  <path d="M 140 330 L 105 345 L 145 360 Z" fill="#FF8F00" stroke="#E65100" stroke-width="5" stroke-linejoin="round"/>
  <path d="M 180 395 L 165 435 L 210 415 Z" fill="#FF8F00" stroke="#E65100" stroke-width="5" stroke-linejoin="round"/>

  <!-- Main Chubby Body -->
  <circle cx="270" cy="270" r="175" fill="url(#bodyGrad)" stroke="#BF360C" stroke-width="10"/>

  <!-- Cream Belly -->
  <path d="M 160 310 C 160 410, 360 410, 390 320 C 350 350, 230 355, 160 310 Z" 
        fill="url(#bellyGrad)" stroke="#FFA000" stroke-width="5"/>

  <!-- Side Pectoral Fin -->
  <path d="M 190 280 C 140 290, 130 340, 165 355 C 190 350, 205 320, 205 295 Z" 
        fill="url(#finGrad)" stroke="#E65100" stroke-width="7" stroke-linejoin="round"/>
  <path d="M 155 315 Q 185 315 195 305" stroke="#FFA000" stroke-width="4" stroke-linecap="round" fill="none"/>

  <!-- Cute Skin Freckles -->
  <circle cx="210" cy="180" r="7" fill="#FF8F00" opacity="0.6"/>
  <circle cx="235" cy="165" r="5" fill="#FF8F00" opacity="0.6"/>
  <circle cx="260" cy="150" r="8" fill="#FF8F00" opacity="0.6"/>
  <circle cx="180" cy="210" r="6" fill="#FF8F00" opacity="0.6"/>

  <!-- Rosy Blushing Cheeks -->
  <circle cx="250" cy="300" r="32" fill="url(#cheekGrad)"/>
  <circle cx="430" cy="300" r="32" fill="url(#cheekGrad)"/>

  <!-- Big Sparkling Cartoon Eyes -->
  <!-- Left Eye -->
  <ellipse cx="305" cy="215" rx="55" ry="60" fill="#FFFFFF" stroke="#D84315" stroke-width="8"/>
  <ellipse cx="320" cy="210" rx="34" ry="38" fill="url(#eyeGrad)"/>
  <!-- Highlights -->
  <ellipse cx="308" cy="192" rx="14" ry="16" fill="#FFFFFF"/>
  <circle cx="335" cy="228" r="7" fill="#FFFFFF"/>
  <ellipse cx="325" cy="210" rx="36" ry="40" fill="none" stroke="#29B6F6" stroke-width="3" opacity="0.35"/>

  <!-- Right Eye -->
  <ellipse cx="405" cy="215" rx="50" ry="55" fill="#FFFFFF" stroke="#D84315" stroke-width="8"/>
  <ellipse cx="418" cy="210" rx="30" ry="35" fill="url(#eyeGrad)"/>
  <!-- Highlights -->
  <ellipse cx="408" cy="192" rx="12" ry="14" fill="#FFFFFF"/>
  <circle cx="432" cy="226" r="6" fill="#FFFFFF"/>
  <ellipse cx="422" cy="210" rx="32" ry="36" fill="none" stroke="#29B6F6" stroke-width="3" opacity="0.35"/>

  <!-- Cute Open Smiling Mouth -->
  <path d="M 330 295 Q 365 340 400 295" fill="#BF360C" stroke="#D84315" stroke-width="7" stroke-linecap="round"/>
  <path d="M 345 305 Q 365 330 385 305" fill="#FF8A80"/>
</svg>
