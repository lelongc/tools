<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <!-- Puffy Body (Chubby Yellow Round Fish) -->
  <circle cx="32" cy="34" r="24" fill="#ffca28" stroke="#ff8f00" stroke-width="3"/>
  <!-- Belly -->
  <ellipse cx="32" cy="42" rx="16" ry="10" fill="#fff9c4"/>
  <!-- Tiny Spikes (Soft) -->
  <polygon points="12,30 6,28 10,36" fill="#ff8f00"/>
  <polygon points="16,18 12,12 22,16" fill="#ff8f00"/>
  <polygon points="32,10 32,4 36,12" fill="#ff8f00"/>
  <!-- Tail fin -->
  <path d="M8 34 L0 24 L2 44 Z" fill="#ffa000"/>
  <!-- Side fins -->
  <ellipse cx="20" cy="38" rx="6" ry="4" fill="#ffb300"/>
  <!-- Big Googly Eyes -->
  <circle cx="38" cy="26" r="9" fill="#ffffff" stroke="#e65100" stroke-width="1.5"/>
  <circle cx="50" cy="26" r="8" fill="#ffffff" stroke="#e65100" stroke-width="1.5"/>
  <!-- Pupils looking up/curious -->
  <circle cx="41" cy="25" r="4.5" fill="#212121"/>
  <circle cx="52" cy="25" r="4" fill="#212121"/>
  <circle cx="42.5" cy="23" r="1.5" fill="#ffffff"/>
  <circle cx="53.5" cy="23" r="1.5" fill="#ffffff"/>
  <!-- Rosy Cute Cheeks -->
  <circle cx="30" cy="36" r="4" fill="#ff8a80" fill-opacity="0.75"/>
  <!-- Cute small mouth -->
  <ellipse cx="45" cy="36" rx="3" ry="2" fill="#d84315"/>
</svg>
