<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 110" width="100" height="110">
  <defs>
    <radialGradient id="jellyDome" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#E0F7FA" stop-opacity="0.95" />
      <stop offset="60%" stop-color="#4DD0E1" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#00838F" stop-opacity="0.9" />
    </radialGradient>
    <linearGradient id="tentacleGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#80DEEA" />
      <stop offset="100%" stop-color="#00ACC1" stop-opacity="0.2" />
    </linearGradient>
  </defs>

  <!-- Mũ nấm sứa đàn hồi lấp lánh -->
  <path d="M 12 56 C 12 18, 88 18, 88 56 C 88 64, 76 68, 64 63 C 54 59, 46 59, 36 63 C 24 68, 12 64, 12 56 Z" 
        fill="url(#jellyDome)" stroke="#B2EBF2" stroke-width="3" />

  <!-- Chấm phát sáng sinh học trên mũ sứa -->
  <circle cx="36" cy="32" r="4.5" fill="#FFF" opacity="0.8" />
  <circle cx="64" cy="32" r="4.5" fill="#FFF" opacity="0.8" />
  <circle cx="50" cy="24" r="5" fill="#E0F7FA" opacity="0.9" />
  <circle cx="26" cy="44" r="3" fill="#FFF" opacity="0.7" />
  <circle cx="74" cy="44" r="3" fill="#FFF" opacity="0.7" />

  <!-- Mắt cười hiền lành đáng yêu -->
  <ellipse cx="40" cy="48" rx="4" ry="5.5" fill="#006064" />
  <circle cx="41.5" cy="46" r="1.8" fill="#FFF" />
  <ellipse cx="60" cy="48" rx="4" ry="5.5" fill="#006064" />
  <circle cx="61.5" cy="46" r="1.8" fill="#FFF" />
  <path d="M 46 54 Q 50 58 54 54" stroke="#006064" stroke-width="2" fill="none" stroke-linecap="round" />

  <!-- Xúc tu mềm mại uốn lượn -->
  <path d="M 24 64 Q 20 85 28 104" stroke="url(#tentacleGrad)" stroke-width="3.5" fill="none" stroke-linecap="round" />
  <path d="M 40 64 Q 36 86 42 106" stroke="url(#tentacleGrad)" stroke-width="4" fill="none" stroke-linecap="round" />
  <path d="M 60 64 Q 64 86 58 106" stroke="url(#tentacleGrad)" stroke-width="4" fill="none" stroke-linecap="round" />
  <path d="M 76 64 Q 80 85 72 104" stroke="url(#tentacleGrad)" stroke-width="3.5" fill="none" stroke-linecap="round" />
</svg>
