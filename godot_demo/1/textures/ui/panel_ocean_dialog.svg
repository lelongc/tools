<svg xmlns="http://www.w3.org/2000/svg" width="600" height="460" viewBox="0 0 600 460">
  <defs>
    <!-- Deep Ocean Glass -->
    <linearGradient id="dialogBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0D253F" stop-opacity="0.96"/>
      <stop offset="50%" stop-color="#081A2F" stop-opacity="0.97"/>
      <stop offset="100%" stop-color="#040D1A" stop-opacity="0.98"/>
    </linearGradient>

    <!-- Golden Coral Trim -->
    <linearGradient id="goldBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF9C4"/>
      <stop offset="25%" stop-color="#FFD54F"/>
      <stop offset="70%" stop-color="#FFA000"/>
      <stop offset="100%" stop-color="#FF8F00"/>
    </linearGradient>

    <!-- Dialog Shadow -->
    <filter id="dialogShadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="12" stdDeviation="10" flood-color="#000000" flood-opacity="0.75"/>
    </filter>
  </defs>

  <!-- Base Panel with Heavy Drop Shadow -->
  <rect x="12" y="12" width="576" height="436" rx="28" ry="28" 
        fill="url(#dialogBg)" stroke="url(#goldBorder)" stroke-width="6" filter="url(#dialogShadow)"/>

  <!-- Inner Subtle Cyan Rim -->
  <rect x="20" y="20" width="560" height="420" rx="22" ry="22" 
        fill="none" stroke="#26C6DA" stroke-width="2" opacity="0.45"/>

  <!-- Top Glass Sheen -->
  <path d="M 22 80 C 22 36, 36 22, 80 22 L 520 22 C 564 22, 578 36, 578 80 C 420 110, 180 110, 22 80 Z" 
        fill="#FFFFFF" opacity="0.06"/>

  <!-- 4 Corner Scallop Shell Accents (Golden Shell Ornaments) -->
  <!-- Top-Left Shell -->
  <g transform="translate(18, 18)">
    <circle cx="16" cy="16" r="14" fill="#FFD54F" stroke="#E65100" stroke-width="2"/>
    <path d="M 6 22 Q 16 6 26 22" stroke="#FFF9C4" stroke-width="2" fill="none"/>
    <circle cx="16" cy="16" r="4" fill="#FFFFFF"/>
  </g>

  <!-- Top-Right Shell -->
  <g transform="translate(554, 18)">
    <circle cx="16" cy="16" r="14" fill="#FFD54F" stroke="#E65100" stroke-width="2"/>
    <path d="M 6 22 Q 16 6 26 22" stroke="#FFF9C4" stroke-width="2" fill="none"/>
    <circle cx="16" cy="16" r="4" fill="#FFFFFF"/>
  </g>

  <!-- Bottom-Left Shell -->
  <g transform="translate(18, 414)">
    <circle cx="16" cy="16" r="14" fill="#FFD54F" stroke="#E65100" stroke-width="2"/>
    <path d="M 6 10 Q 16 26 26 10" stroke="#FFF9C4" stroke-width="2" fill="none"/>
    <circle cx="16" cy="16" r="4" fill="#FFFFFF"/>
  </g>

  <!-- Bottom-Right Shell -->
  <g transform="translate(554, 414)">
    <circle cx="16" cy="16" r="14" fill="#FFD54F" stroke="#E65100" stroke-width="2"/>
    <path d="M 6 10 Q 16 26 26 10" stroke="#FFF9C4" stroke-width="2" fill="none"/>
    <circle cx="16" cy="16" r="4" fill="#FFFFFF"/>
  </g>
</svg>
