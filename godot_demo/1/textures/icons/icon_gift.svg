<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <defs>
    <filter id="giftShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#4A148C" flood-opacity="0.4"/>
    </filter>
  </defs>
  <!-- Gift Box Base -->
  <rect x="14" y="26" width="36" height="28" rx="4" ry="4" 
        fill="#FFD54F" stroke="#E65100" stroke-width="2.5" filter="url(#giftShadow)"/>
  <!-- Gift Lid -->
  <rect x="10" y="20" width="44" height="9" rx="3" ry="3" 
        fill="#FFE082" stroke="#E65100" stroke-width="2.5"/>
  <!-- Ribbon Vertical -->
  <rect x="29" y="20" width="6" height="34" fill="#FF5252"/>
  <!-- Ribbon Bow -->
  <path d="M 28 20 C 22 12, 14 14, 20 20 Z" fill="#FF5252" stroke="#B71C1C" stroke-width="1.5"/>
  <path d="M 36 20 C 42 12, 50 14, 44 20 Z" fill="#FF5252" stroke="#B71C1C" stroke-width="1.5"/>
</svg>
