  <line x1="6" y1="32" x2="58" y2="32" stroke="#FFFFFF" stroke-width="2" opacity="0.85"/>
  <path d="M 12 20 Q 32 26 52 20" fill="none" stroke="#FFFFFF" stroke-width="1.8" opacity="0.75"/>
  <path d="M 12 44 Q 32 38 52 44" fill="none" stroke="#FFFFFF" stroke-width="1.8" opacity="0.75"/>
