<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <defs>
    <radialGradient id="globeGrad" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#E0F7FA"/>
      <stop offset="40%" stop-color="#4DD0E1"/>
      <stop offset="80%" stop-color="#0097A7"/>
      <stop offset="100%" stop-color="#006064"/>
    </radialGradient>
    <filter id="globeShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#001824" flood-opacity="0.5"/>
    </filter>
  </defs>
  <!-- Globe Sphere -->
  <circle cx="32" cy="32" r="26" fill="url(#globeGrad)" stroke="#B2EBF2" stroke-width="2.5" filter="url(#globeShadow)"/>
