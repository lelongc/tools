<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>Bio-Probe Platformer</title>
    
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.60.0/dist/phaser.min.js"></script>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;700;900&family=Public+Sans:wght@300;400;600&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
    <link rel="stylesheet" href="css/ui.css">
    
    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        primary: "#00ffff", // Neon Cyan
                        secondary: "#44ff44", // Neon Green
                        surface: "#0a0a0f",
                        "on-surface-variant": "#94a3b8",
                        "primary-container": "rgba(0, 255, 255, 0.1)",
                    },
                    borderRadius: {
                        "DEFAULT": "0.125rem",
                        "lg": "0.25rem",
                        "xl": "0.5rem",
                        "full": "0.75rem"
                    },
                    fontFamily: {
                        headline: ["Space Grotesk"],
                        display: ["Space Grotesk"],
                        body: ["Public Sans"],
                        label: ["Public Sans"]
                    }
                },
            },
        }
    </script>
    <style>
        body { margin: 0; background: #000; overflow: hidden; }
        .game-container { position: absolute; top:0; left:0; width: 100vw; height: 100vh; z-index: 1; }
        #phaser-game { width: 100%; height: 100%; }
        
        #error-log {
            position: fixed;
            bottom: 10px;
            left: 10px;
            right: 10px;
            background: rgba(200, 0, 0, 0.7);
            color: white;
            padding: 10px;
            border: 1px solid red;
            font-size: 12px;
            z-index: 9999;
            display: none;
            max-height: 150px;
            overflow-y: auto;
            white-space: pre-wrap;
            pointer-events: none;
        }
    </style>
</head>
<body class="bg-black text-primary font-body overflow-hidden h-screen w-screen selection:bg-primary selection:text-surface">
    
    <div class="game-container">
        <div id="phaser-game"></div>
    </div>

    <!-- HUD Overlay -->
    <div id="hud-overlay" class="text-primary font-body">
        
        <!-- Global Scanned Overlay -->
        <div class="fixed inset-0 pointer-events-none z-[100] opacity-20 overflow-hidden">
            <div class="absolute inset-0 scanline-overlay animate-[scanline_10s_linear_infinite]"></div>
        </div>

        <!-- TOP APP BAR / HEADER (Top Center Indicator) -->
        <header class="fixed top-0 left-0 w-full z-50 flex justify-between items-center px-6 py-4 bg-gradient-to-b from-surface/80 to-transparent pointer-events-none">
            <!-- Leading Icon -->
            <div class="flex items-center gap-4">
                <span class="material-symbols-outlined text-primary text-2xl animate-pulse">memory</span>
                <div class="hidden md:block">
                    <div class="text-[10px] tracking-[0.3em] text-primary/60 font-bold uppercase">SYSTEM_LINK</div>
                    <div class="text-xs font-headline font-black text-primary">STABLE_0XF1</div>
                </div>
            </div>
            
            <!-- Center Zone Indicator -->
            <div class="absolute left-1/2 -translate-x-1/2 flex flex-col items-center">
                <div class="bg-primary/10 border-x-2 border-primary px-8 py-1 skew-x-[-20deg] relative overflow-hidden group">
                    <div class="absolute inset-0 bg-primary/20 translate-x-full group-hover:translate-x-[-100%] transition-transform duration-1000"></div>
                    <h1 id="hud-zone-name" class="text-xl font-headline font-black tracking-[0.4em] uppercase text-primary drop-shadow-[0_0_8px_rgba(0,255,255,0.8)] skew-x-[20deg]">
                        CYBER LAB
                    </h1>
                </div>
            </div>

            <!-- Trailing Icon -->
            <div class="flex items-center gap-2 text-primary">
                <span class="material-symbols-outlined text-2xl">settings_input_component</span>
            </div>
        </header>

        <!-- TOP-LEFT: STATUS BARS -->
        <div class="fixed top-8 left-8 z-40 pointer-events-none" style="transform: scale(0.65); transform-origin: top left;">
            <div class="space-y-4">
                <!-- Health Bar -->
                <div class="relative w-72">
                    <div class="flex justify-between items-end mb-1">
                        <span class="text-xs font-black tracking-tighter text-primary">VITAL_SIGNS</span>
                        <span id="hud-hp-text" class="text-sm font-headline font-bold text-primary">100 / 100</span>
                    </div>
                    <div class="h-6 w-full bg-surface/60 border border-primary/30 p-[2px] glitch-border overflow-hidden">
                        <div id="hud-hp-bar" class="h-full w-full segmented-bar bg-primary shadow-[0_0_15px_rgba(0,255,255,0.5)] transition-all duration-300" style="width: 100%;"></div>
                    </div>
                    <div class="absolute -left-2 top-0 h-full w-1 bg-primary/40"></div>
                </div>
                <!-- Energy Bar -->
                <div class="relative w-64 ml-4">
                    <div class="flex justify-between items-end mb-1">
                        <span class="text-xs font-black tracking-tighter text-secondary">NEURAL_CHARGE</span>
                        <span id="hud-mana-text" class="text-sm font-headline font-bold text-secondary">100%</span>
                    </div>
                    <div class="h-4 w-full bg-surface/60 border border-secondary/30 p-[2px] glitch-border overflow-hidden">
                        <div id="hud-mana-bar" class="h-full w-full segmented-bar bg-secondary shadow-[0_0_12px_rgba(68,255,68,0.5)] transition-all duration-100" style="width: 100%;"></div>
                    </div>
                </div>
            </div>
        </div>

        <!-- BOTTOM-LEFT: SKILL GRID -->
        <div class="fixed bottom-8 left-8 z-40 pointer-events-none" style="transform: scale(0.65); transform-origin: bottom left;">
            <div class="flex gap-4">
                <!-- Skill 1: DASH (J key - Attack/Combo) -->
                <div class="relative group">
                    <div class="w-16 h-16 bg-surface/80 border-2 border-primary/40 p-1 glitch-border backdrop-blur-md relative overflow-hidden flex items-center justify-center">
                        <span class="material-symbols-outlined text-primary text-3xl">swords</span>
                        <div class="absolute bottom-1 right-1 text-xs font-black text-primary/60 bg-surface/80 px-1 border border-primary/20">J</div>
                        <!-- Cooldown Overlay -->
                        <div id="cd-dash" class="absolute bottom-0 left-0 right-0 bg-surface/80 border-t-2 border-primary transition-all" style="height: 0%;"></div>
                    </div>
                    <div class="absolute -bottom-6 left-0 right-0 text-center text-[10px] font-bold text-primary/40 tracking-[0.2em]">SLASH</div>
                </div>
                <!-- Skill 2: SHIELD (I key - Bio-Drill) -->
                <div class="relative group">
                    <div class="w-16 h-16 bg-surface/80 border-2 border-primary/40 p-1 glitch-border backdrop-blur-md relative overflow-hidden flex items-center justify-center">
                        <span class="material-symbols-outlined text-primary text-3xl">tornado</span>
                        <div class="absolute bottom-1 right-1 text-xs font-black text-primary/60 bg-surface/80 px-1 border border-primary/20">I</div>
                        <!-- Cooldown Overlay -->
                        <div id="cd-shield" class="absolute bottom-0 left-0 right-0 bg-surface/80 border-t-2 border-primary transition-all" style="height: 0%;"></div>
                    </div>
                    <div class="absolute -bottom-6 left-0 right-0 text-center text-[10px] font-bold text-primary/40 tracking-[0.2em]">DRILL</div>
                </div>
                <!-- Skill 3: SCAN (L key - Upward Blast) -->
                <div class="relative group">
                    <div class="w-16 h-16 bg-surface/80 border-2 border-primary/40 p-1 glitch-border backdrop-blur-md relative overflow-hidden flex items-center justify-center">
                        <span class="material-symbols-outlined text-primary text-3xl">explosion</span>
                        <div class="absolute bottom-1 right-1 text-xs font-black text-primary/60 bg-surface/80 px-1 border border-primary/20">L</div>
                        <!-- Cooldown Overlay -->
                        <div id="cd-sonar" class="absolute bottom-0 left-0 right-0 bg-surface/80 border-t-2 border-primary transition-all" style="height: 0%;"></div>
                    </div>
                    <div class="absolute -bottom-6 left-0 right-0 text-center text-[10px] font-bold text-primary/40 tracking-[0.2em]">NOVA</div>
                </div>
                <!-- Skill 4: ULTIMATE (K key - Dash Strike) -->
                <div class="relative group">
                    <div class="w-16 h-16 bg-surface/80 border-2 border-secondary/40 p-1 glitch-border backdrop-blur-md relative overflow-hidden flex items-center justify-center">
                        <span class="material-symbols-outlined text-secondary text-3xl">electric_bolt</span>
                        <div class="absolute bottom-1 right-1 text-xs font-black text-secondary/60 bg-surface/80 px-1 border border-secondary/20">K</div>
                        <!-- Cooldown Overlay -->
                        <div id="cd-ultimate" class="absolute bottom-0 left-0 right-0 bg-surface/80 border-t-2 border-secondary transition-all" style="height: 0%;"></div>
                    </div>
                    <div class="absolute -bottom-6 left-0 right-0 text-center text-[10px] font-bold text-secondary/60 tracking-[0.2em]">STRIKE</div>
                </div>
            </div>
        </div>

        <!-- BOTTOM-RIGHT: MINIMAP -->
        <div class="fixed bottom-8 right-8 z-40 pointer-events-none" style="transform: scale(0.65); transform-origin: bottom right;">
            <div class="relative w-40 h-40 rounded-full bg-surface/80 border-2 border-primary/30 backdrop-blur-md flex items-center justify-center shadow-[0_0_30px_rgba(0,0,0,0.5)] overflow-hidden">
                <!-- Radar Grid -->
                <div class="absolute inset-0 opacity-20" style="background-image: radial-gradient(circle, #00ffff 1px, transparent 1px); background-size: 20px 20px;"></div>
                <div class="absolute inset-0 border border-primary/10 rounded-full scale-75"></div>
                <div class="absolute inset-0 border border-primary/10 rounded-full scale-50"></div>
                <!-- Radar Sweep -->
                <div class="absolute inset-0 bg-gradient-to-r from-transparent via-primary/10 to-transparent w-full h-full animate-[spin_4s_linear_infinite]" style="transform-origin: center;"></div>
                
                <!-- Player Icon -->
                <div id="hud-minimap-player" class="absolute top-1/2 left-1/2 w-4 h-4 text-primary flex items-center justify-center transition-transform duration-100">
                    <span class="material-symbols-outlined text-lg font-bold" style="font-variation-settings: 'FILL' 1;">navigation</span>
                </div>
                
                <!-- Map Coordinates -->
                <div id="hud-minimap-coords" class="absolute bottom-2 left-1/2 -translate-x-1/2 text-[10px] font-mono text-primary/60 tracking-widest whitespace-nowrap">
                    X: 0 | Y: 0
                </div>
            </div>
            <!-- Decorative Frame -->
            <div class="absolute -top-2 -left-2 w-4 h-4 border-t-2 border-l-2 border-primary/50"></div>
            <div class="absolute -bottom-2 -right-2 w-4 h-4 border-b-2 border-r-2 border-primary/50"></div>
        </div>

    </div>
    
    <div id="error-log">
        <div id="error-text"></div>
    </div>

    <script>
        const errorLog = document.getElementById('error-log');
        const errorText = document.getElementById('error-text');

        window.onerror = function(msg, url, lineNo, columnNo, error) {
            errorLog.style.display = 'block';
            const errStr = `Error: ${msg}\nLine: ${lineNo}\nColumn: ${columnNo}\nStack: ${error ? error.stack : ''}`;
            errorText.innerText += errStr + "\n\n";
            return false;
        };
        window.addEventListener("unhandledrejection", function(event) {
            errorLog.style.display = 'block';
            errorText.innerText += `Promise Rejection: ${event.reason}\n\n`;
        });
    </script>

    <script type="module">
        const t = Date.now();
        import('./js/main.js?t=' + t);
    </script>
</body>
</html>
