<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2D Pixel Game</title>
    <style>
        body {
            margin: 0;
            background: #080d16;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            color: white;
            font-family: 'Courier New', Courier, monospace;
        }
        .game-container {
            display: flex;
            gap: 20px;
            align-items: flex-start;
            flex-direction: row;
        }
        canvas {
            background: #02050a;
            border: 4px solid #00ffcc;
            box-shadow: 0 0 25px rgba(0, 255, 204, 0.3);
        }
        #ui {
            background: rgba(0, 15, 25, 0.9);
            border: 2px solid #00ffcc;
            border-radius: 8px;
            padding: 20px;
            width: 260px;
            box-shadow: 0 0 20px rgba(0, 255, 204, 0.15);
            font-size: 13px;
        }
        #ui h2 {
            margin: 0 0 15px 0;
            font-size: 18px;
            color: #00ffcc;
            text-shadow: 0 0 8px rgba(0, 255, 204, 0.6);
            border-bottom: 1px dashed rgba(0, 255, 204, 0.4);
            padding-bottom: 8px;
            text-align: center;
        }
        #ui h3 {
            color: #ff0077;
            margin: 15px 0 5px 0;
            font-size: 14px;
            text-shadow: 0 0 5px rgba(255, 0, 119, 0.4);
        }
        #ui p {
            margin: 6px 0;
            line-height: 1.4;
        }
        .key-badge {
            background: rgba(0, 255, 204, 0.2);
            color: #00ffcc;
            padding: 2px 6px;
            border-radius: 4px;
            border: 1px solid rgba(0, 255, 204, 0.4);
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="game-container">
        <canvas id="gameCanvas" width="640" height="480"></canvas>
        
        <div id="ui">
            <h2>BIO-PROBE HUD</h2>
            
            <h3>CONTROLS</h3>
            <p><span class="key-badge">A</span> / <span class="key-badge">D</span> : Move Left / Right</p>
            <p><span class="key-badge">W</span> / <span class="key-badge">Space</span> : Jump / Flip</p>
            <p><span class="key-badge">U</span> : Basic Dash</p>
            <p><span class="key-badge">I</span> : Basic Attack</p>

            <h3>COMBAT SKILLS</h3>
            <p><span class="key-badge">J</span> : Tentacle Lash (3-Hit Combo)</p>
            <p><span class="key-badge">K</span> : Spiral Drill Dash</p>
            <p><span class="key-badge">L</span> : Bio-Smash (Use in Air)</p>
        </div>
    </div>
    
    <script type="module">
        // Force fresh load every time - bypass all browser cache
        const t = Date.now();
        import('./js/main.js?t=' + t);
    </script>
</body>
</html>
