<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Local 3D Viewer</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="drop-zone">
        <div id="drop-text">Drag and Drop a .GLB, .GLTF, or .FBX file here<br><span style="font-size: 14px; opacity: 0.7;">Or click to select a file</span></div>
        <input type="file" id="file-input" accept=".glb,.gltf,.fbx" style="display: none;">
    </div>

    <div id="viewer-container" style="display: none;">
        <div id="ui-panel">
            <h2>Animations</h2>
            <div id="animation-list">
                <p>No animations found.</p>
            </div>
            <button id="btn-close">Close Model</button>
        </div>
        <canvas id="canvas3d"></canvas>
    </div>

    <!-- Import maps polyfill -->
    <script async src="https://unpkg.com/es-module-shims@1.8.0/dist/es-module-shims.js"></script>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>
    <script type="module" src="main.js"></script>
</body>
</html>
