<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smart Reminder</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <!-- Header -->
  <header class="header">
    <div class="header-left">
      <div class="logo">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none">
          <path d="M12 2C10.343 2 9 3.343 9 5V6.08C6.164 7.029 4 9.79 4 13V17L2 19V20H22V19L20 17V13C20 9.79 17.836 7.029 15 6.08V5C15 3.343 13.657 2 12 2Z" fill="url(#bell-grad)"/>
          <path d="M12 24C13.657 24 15 22.657 15 21H9C9 22.657 10.343 24 12 24Z" fill="url(#bell-grad2)"/>
          <defs>
            <linearGradient id="bell-grad" x1="2" y1="2" x2="22" y2="20">
              <stop stop-color="#6C63FF"/>
              <stop offset="1" stop-color="#3F8EFC"/>
            </linearGradient>
            <linearGradient id="bell-grad2" x1="9" y1="21" x2="15" y2="24">
              <stop stop-color="#6C63FF"/>
              <stop offset="1" stop-color="#3F8EFC"/>
            </linearGradient>
          </defs>
        </svg>
      </div>
      <div>
        <h1 class="header-title">Smart Reminder</h1>
        <p class="header-subtitle">Nhắc nhở thông minh</p>
      </div>
    </div>
    <button id="btnToggleForm" class="btn-add" title="Thêm nhắc nhở">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
        <line x1="12" y1="5" x2="12" y2="19"></line>
        <line x1="5" y1="12" x2="19" y2="12"></line>
      </svg>
    </button>
  </header>

  <!-- Main Views Container -->
  <main class="main-content">
    
    <!-- View 1: Reminder List -->
    <div id="listView" class="view visible">
      <section class="list-section">
        <div id="emptyState" class="empty-state">
          <div class="empty-icon">
            <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2" opacity="0.4">
              <path d="M12 2C10.343 2 9 3.343 9 5V6.08C6.164 7.029 4 9.79 4 13V17L2 19V20H22V19L20 17V13C20 9.79 17.836 7.029 15 6.08V5C15 3.343 13.657 2 12 2Z"/>
              <path d="M12 24C13.657 24 15 22.657 15 21H9C9 22.657 10.343 24 12 24Z"/>
            </svg>
          </div>
          <p class="empty-text">Chưa có nhắc nhở nào</p>
          <p class="empty-hint">Nhấn nút + để tạo nhắc nhở mới</p>
        </div>
        
        <div id="reminderList" class="reminder-list"></div>
      </section>
    </div>

    <!-- View 2: Create / Edit Form -->
    <div id="formView" class="view hidden">
      <section id="formSection" class="form-section">
        <div class="form-card">
          <h2 id="formTitle" class="form-title">Tạo nhắc nhở mới</h2>
          
          <form id="reminderForm">
            <!-- Hidden field for editing -->
            <input type="hidden" id="editId" value="">
            
            <div class="form-group">
              <label for="title">Tiêu đề</label>
              <input type="text" id="title" placeholder="VD: Uống nước" required maxlength="50">
            </div>
            
            <div class="form-group">
              <label for="message">Nội dung</label>
              <input type="text" id="message" placeholder="VD: Nhớ uống 1 ly nước nhé!" maxlength="100">
            </div>
            
            <!-- Reminder Type Selector -->
            <div class="type-selector">
              <button type="button" class="type-btn active" data-type="fixed">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <circle cx="12" cy="12" r="10"></circle>
                  <polyline points="12,6 12,12 16,14"></polyline>
                </svg>
                Giờ cố định
              </button>
              <button type="button" class="type-btn" data-type="repeat">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <polyline points="23,4 23,10 17,10"></polyline>
                  <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"></path>
                </svg>
                Lặp lại
              </button>
            </div>
            
            <!-- Fixed Time Input -->
            <div id="fixedTimeGroup" class="form-group time-group">
              <label for="fixedTime">Giờ nhắc nhở</label>
              <input type="time" id="fixedTime" value="08:00">
            </div>
            
            <!-- Repeat Interval Input -->
            <div id="repeatGroup" class="form-group hidden">
              <div class="time-group">
                <label for="repeatStartTime">Bắt đầu từ (chặn lặp)</label>
                <input type="time" id="repeatStartTime" value="00:00">
              </div>
              <div class="time-group" style="margin-top: 10px;">
                <label for="intervalMinutes">Lặp lại mỗi</label>
                <div class="interval-input">
                  <input type="number" id="intervalMinutes" min="1" max="1440" value="30">
                  <span class="interval-unit">phút</span>
                </div>
              </div>
            </div>

            <!-- Toast Duration Input -->
            <div class="form-group">
              <label for="duration">Thời gian hiển thị</label>
              <div class="interval-input">
                <input type="number" id="duration" min="1" max="60" value="8">
                <span class="interval-unit">giây</span>
              </div>
            </div>
            
            <div class="form-actions">
              <button type="button" id="btnCancel" class="btn btn-cancel">Hủy</button>
              <button type="submit" id="btnSubmit" class="btn btn-create">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                  <polyline points="20,6 9,17 4,12"></polyline>
                </svg>
                <span id="btnSubmitText">Tạo</span>
              </button>
            </div>
          </form>
        </div>
      </section>
    </div>

  </main>

  <script src="popup.js"></script>
</body>
</html>
